<!-- FRAGMENTO: equipo.html – Gestión completa de Equipo (Comercial / Distribución) -->
<div class="tabs-compact" id="equipo-tabs">
    <button class="tab-btn-compact active" data-tab="comercial"><i class="fas fa-user-tie"></i> Comercial</button>
    <button class="tab-btn-compact" data-tab="distribucion"><i class="fas fa-truck"></i> Distribución</button>
</div>
<div class="card">
    <div class="card-header">
        <h2 id="equipo-titulo">Equipo Comercial</h2>
        <button class="btn-solid" onclick="abrirModalUsuario(null,'comercial')"><i class="fas fa-plus"></i> Nuevo Miembro</button>
    </div>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Teléfonos</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="equipo-tbody">
                <tr><td colspan="6" style="text-align:center;">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Usuario (FORMULARIO COMPLETO) -->
<div class="modal-overlay" id="modal-usuario">
    <div class="modal">
        <div class="modal-header">
            <h2 id="titulo-modal-usuario">Nuevo Miembro</h2>
            <button class="close-modal" onclick="cerrarModalUsuario()">&times;</button>
        </div>
        <form id="form-usuario" autocomplete="off">
            <input type="hidden" id="usuario-id">
            <input type="hidden" id="empleado-id">
            <div class="info-banner"><i class="fas fa-info-circle"></i> Complete primero el <strong>País</strong> para que los campos de documento, moneda, estados y ciudades se configuren automáticamente.</div>
            
            <!-- País, Extensión -->
            <div class="form-row">
                <div class="form-col"><div class="form-group"><label>País</label><input id="usr-pais" list="usr-paises-list" autocomplete="off" oninput="capitalizarInput(this)"><datalist id="usr-paises-list"></datalist></div></div>
                <div class="form-col"><div class="form-group"><label>Extensión Tel.</label><input id="usr-extension" readonly style="background:#f1f5f9;"></div></div>
            </div>
            
            <!-- Nombres, Apellidos -->
            <div class="form-row">
                <div class="form-col"><div class="form-group"><label>Nombres *</label><input id="usr-nombres" required oninput="capitalizarInput(this)"></div></div>
                <div class="form-col"><div class="form-group"><label>Apellido Paterno *</label><input id="usr-ap" required oninput="capitalizarInput(this)"></div></div>
                <div class="form-col"><div class="form-group"><label>Apellido Materno</label><input id="usr-am" oninput="capitalizarInput(this)"></div></div>
            </div>
            
            <!-- Email, Rol, Teléfonos -->
            <div class="form-row">
                <div class="form-col"><div class="form-group"><label>Email *</label><input id="usr-email" type="email" required></div></div>
                <div class="form-col"><div class="form-group"><label>Rol *</label><select id="usr-rol" required></select></div></div>
                <div class="form-col"><div class="form-group"><label>Teléfonos</label>
                    <div id="telefonos-container"></div>
                    <button type="button" class="btn-add-phone" onclick="agregarTelefono()" title="Agregar teléfono" style="margin-top:8px;"><i class="fas fa-plus"></i> Agregar teléfono</button>
                </div></div>
            </div>
            
            <!-- Contraseña -->
            <div class="form-row" id="password-fields">
                <div class="form-col" style="position:relative;">
                    <div class="form-group"><label>Contraseña *</label><input id="usr-password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>
                    <button type="button" class="password-toggle" tabindex="-1" onclick="togglePassword('usr-password', this)"><i class="far fa-eye"></i></button>
                </div>
                <div class="form-col" style="position:relative;">
                    <div class="form-group"><label>Repetir contraseña *</label><input id="usr-password2" type="password" placeholder="Repita la contraseña" autocomplete="new-password"></div>
                    <button type="button" class="password-toggle" tabindex="-1" onclick="togglePassword('usr-password2', this)"><i class="far fa-eye"></i></button>
                </div>
            </div>
            
            <!-- Documento, Fecha Nac. -->
            <div class="form-row">
                <div class="form-col"><div class="form-group"><label>Tipo Documento</label><select id="usr-tipo-doc"></select></div></div>
                <div class="form-col"><div class="form-group"><label>Número Documento</label><input id="usr-num-doc"></div></div>
                <div class="form-col"><div class="form-group"><label>Fecha Nacimiento</label><input id="usr-fecha-nac" type="date"></div></div>
            </div>
            
            <!-- Dirección, Estado, Ciudad -->
            <div class="form-row">
                <div class="form-col"><div class="form-group"><label>Dirección</label><input id="usr-direccion" oninput="capitalizarInput(this)"></div></div>
                <div class="form-col"><div class="form-group"><label>Estado / Provincia</label><input id="usr-estado" list="usr-estados-list" autocomplete="off"><datalist id="usr-estados-list"></datalist></div></div>
                <div class="form-col"><div class="form-group"><label>Ciudad</label><input id="usr-ciudad" list="usr-ciudades-list" autocomplete="off" oninput="capitalizarInput(this)"><datalist id="usr-ciudades-list"></datalist></div></div>
            </div>
            
            <!-- Puesto, Depto, Supervisor -->
            <div class="form-row">
                <div class="form-col"><div class="form-group"><label>Puesto</label><input id="usr-puesto" list="puestos-list" oninput="capitalizarInput(this)"><datalist id="puestos-list"></datalist></div></div>
                <div class="form-col"><div class="form-group"><label>Departamento</label><input id="usr-departamento" list="departamentos-list" oninput="capitalizarInput(this)"><datalist id="departamentos-list"></datalist></div></div>
                <div class="form-col"><div class="form-group"><label>Supervisor</label><select id="usr-supervisor"><option value="">Sin supervisor</option></select></div></div>
            </div>
            
            <!-- Salario, Moneda, Contrato -->
            <div class="form-row">
                <div class="form-col"><div class="form-group"><label>Salario Base</label><input id="usr-salario" type="number" step="0.01" min="0"></div></div>
                <div class="form-col"><div class="form-group"><label>Moneda Salario</label><input id="usr-moneda-salario" list="monedas-global-list-emp"><datalist id="monedas-global-list-emp"></datalist></div></div>
                <div class="form-col"><div class="form-group"><label>Tipo Contrato</label><input id="usr-tipo-contrato" list="tipos-contrato-list" oninput="capitalizarInput(this)"><datalist id="tipos-contrato-list"></datalist></div></div>
            </div>
            
            <!-- Fechas, Imagen -->
            <div class="form-row">
                <div class="form-col"><div class="form-group"><label>Fecha Contratación</label><input id="usr-fecha-contrato" type="date"></div></div>
                <div class="form-col"><div class="form-group"><label>Fecha Fin (opcional)</label><input id="usr-fecha-fin" type="date"></div></div>
                <div class="form-col"><div class="form-group"><label>Imagen</label><input type="file" id="file-usr-imagen" accept="image/*"></div></div>
            </div>
            
            <!-- Capacidad Vehículo (solo para Logístico) -->
            <div class="form-row" id="row-capacidad-vehiculo" style="display:none;">
                <div class="form-col"><div class="form-group"><label>Capacidad Vehículo</label><input id="usr-capacidad-vehiculo" type="number" step="0.01" min="0" placeholder="Ej: 2.5"></div></div>
                <div class="form-col"><div class="form-group"><label>Unidad Capacidad</label><input id="usr-unidad-capacidad" list="unidad-cap-list" placeholder="toneladas, kg, m³..."><datalist id="unidad-cap-list"></datalist></div></div>
            </div>
            
            <div style="margin-top:16px; display:flex; gap:12px; justify-content:flex-end;">
                <button type="button" class="btn-outline" style="color:#1e293b; border-color:#cbd5e1;" onclick="cerrarModalUsuario()">Cancelar</button>
                <button type="submit" class="btn-solid"><i class="fas fa-save"></i> Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- WhatsApp iframe oculto -->
<iframe id="whatsapp-iframe" style="display:none;width:0;height:0;border:0;"></iframe>

<script>
(function() {
    // Esperar a que el entorno global (SUPABASE, currentUser, etc.) esté disponible
    if (typeof apiFetch !== 'function' || typeof currentUser === 'undefined') {
        setTimeout(arguments.callee, 50);
        return;
    }

    // Constantes
    const rolesDisponibles = ['Ejecutivo Comercial', 'Especialista Logístico', 'Gestor de Almacén'];
    const puestoPorRol = {
        'Ejecutivo Comercial':'Ejecutivo Comercial',
        'Especialista Logístico':'Especialista Logístico',
        'Gestor de Almacén':'Gestor de Almacén'
    };
    const deptosPorRol = {
        'Ejecutivo Comercial':'Ventas',
        'Especialista Logístico':'Logística',
        'Gestor de Almacén':'Almacén'
    };
    const tiposDocCompletos = {
        'CI':'CI - Cédula de Identidad', 'Pasaporte':'Pasaporte',
        'NIT':'NIT - Número de Identificación Tributaria', 'DNI':'DNI - Documento Nacional de Identidad',
        'CUIT':'CUIT - Clave Única de Identificación Tributaria', 'RUC':'RUC - Registro Único de Contribuyentes',
        'RUN':'RUN - Rol Único Nacional', 'RUT':'RUT - Rol Único Tributario',
        'CC':'CC - Cédula de Ciudadanía', 'INE':'INE - Instituto Nacional Electoral',
        'RFC':'RFC - Registro Federal de Contribuyentes', 'NIE':'NIE - Número de Identidad de Extranjero',
        'SSN':'SSN - Social Security Number', 'Driver License':'Driver License - Licencia de Conducir'
    };
    const tiposDocPorPais = {
        'Bolivia':['CI','Pasaporte','NIT'],
        'Argentina':['DNI','Pasaporte','CUIT'],
        'Perú':['DNI','Pasaporte','RUC'],
        'Chile':['RUN','Pasaporte','RUT'],
        'Colombia':['CC','Pasaporte','NIT'],
        'Ecuador':['CI','Pasaporte','RUC'],
        'Paraguay':['CI','Pasaporte','RUC'],
        'Uruguay':['CI','Pasaporte','RUT'],
        'México':['INE','Pasaporte','RFC'],
        'España':['DNI','Pasaporte','NIE'],
        'Estados Unidos':['Pasaporte','SSN','Driver License']
    };
    const contratosBase = {
        'Bolivia':['Indefinido','Plazo fijo','Por obra','Temporal','Consultoría'],
        'Argentina':['Indefinido','Plazo fijo','Temporal','Pasantía','Freelance'],
        'default':['Indefinido','Plazo fijo','Temporal','Pasantía','Freelance','Consultoría']
    };

    let tabActivo = 'comercial';

    // Inicializar datalists y eventos
    llenarDatalists();
    llenarRolesSelect();
    document.getElementById('usr-pais').addEventListener('input', onPaisChange);
    document.getElementById('usr-estado').addEventListener('input', onEstadoChange);
    document.getElementById('usr-rol').addEventListener('change', onRolChange);

    // Tabs
    document.querySelectorAll('#equipo-tabs .tab-btn-compact').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#equipo-tabs .tab-btn-compact').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            tabActivo = this.dataset.tab;
            cargarEquipo(tabActivo);
        });
    });

    // Cargar primera vista
    cargarEquipo('comercial');

    /* ===== FUNCIONES PÚBLICAS (expuestas al scope global) ===== */
    window.abrirModalUsuario = function(id, tab) {
        const modal = document.getElementById('modal-usuario');
        modal.classList.add('active');
        const form = document.getElementById('form-usuario');
        form.reset();
        document.getElementById('usuario-id').value = '';
        document.getElementById('empleado-id').value = '';
        document.getElementById('password-fields').style.display = 'flex';
        document.getElementById('titulo-modal-usuario').textContent = 'Nuevo Miembro';
        document.getElementById('row-capacidad-vehiculo').style.display = 'none';
        document.getElementById('usr-moneda-salario').value = (typeof monedaPorDefecto === 'function') ? monedaPorDefecto() : (empresaMonedaCodigo || 'USD');
        document.getElementById('usr-pais').value = empresaPais || '';
        if (empresaPais) {
            actualizarDependenciasPaisEmpleado(empresaPais);
        } else {
            actualizarSelectTiposDocumento('', 'usr-tipo-doc');
            actualizarTiposContrato('');
        }
        llenarInputsTelefonoDesdeJson('#telefonos-container', [{etiqueta:'', numero:''}]);
        llenarRolesSelect();
        llenarSelectSupervisores('usr-supervisor');
        if (tab === 'distribucion') {
            document.getElementById('usr-rol').value = 'Especialista Logístico';
            document.getElementById('usr-rol').dispatchEvent(new Event('change'));
        } else if (tab === 'comercial') {
            document.getElementById('usr-rol').value = 'Ejecutivo Comercial';
            document.getElementById('usr-rol').dispatchEvent(new Event('change'));
        }
        if (id) editarUsuario(id);
        if (typeof initTooltips === 'function') initTooltips();
    };

    window.cerrarModalUsuario = function() {
        document.getElementById('modal-usuario').classList.remove('active');
    };

    window.editarUsuario = async function(id) {
        const usuarios = await apiFetch(`usuarios?id=eq.${id}&select=*`);
        if (!usuarios.length) return;
        const u = usuarios[0];
        document.getElementById('usuario-id').value = u.id;
        document.getElementById('usr-nombres').value = u.nombres;
        document.getElementById('usr-ap').value = u.apellido_paterno;
        document.getElementById('usr-am').value = u.apellido_materno || '';
        document.getElementById('usr-email').value = u.email;
        document.getElementById('usr-rol').value = u.rol;
        document.getElementById('usr-extension').value = u.extension || '';
        document.getElementById('usr-fecha-nac').value = u.fecha_nacimiento || '';
        document.getElementById('password-fields').style.display = 'flex';
        document.getElementById('usr-password').value = '';
        document.getElementById('usr-password2').value = '';
        document.getElementById('usr-password').required = false;
        document.getElementById('usr-password2').required = false;
        document.getElementById('titulo-modal-usuario').textContent = 'Editar Miembro';
        onRolChange.call(document.getElementById('usr-rol'));

        document.getElementById('usr-puesto').value = puestoPorRol[u.rol] || '';
        document.getElementById('usr-departamento').value = deptosPorRol[u.rol] || '';
        document.getElementById('usr-moneda-salario').value = (typeof monedaPorDefecto === 'function') ? monedaPorDefecto() : '';

        const empleados = await apiFetch(`empleados?empresa_id=eq.${currentUser.empresa_id}&email=eq.${encodeURIComponent(u.email)}&select=*&order=creado_en.desc&limit=1`);
        if (empleados.length) {
            const e = empleados[0];
            document.getElementById('empleado-id').value = e.id;
            document.getElementById('usr-tipo-doc').value = e.tipo_documento || '';
            document.getElementById('usr-num-doc').value = e.numero_documento || '';
            document.getElementById('usr-direccion').value = e.direccion || '';
            document.getElementById('usr-pais').value = e.pais || empresaPais;
            document.getElementById('usr-estado').value = e.estado_provincia || '';
            document.getElementById('usr-ciudad').value = e.ciudad || '';
            document.getElementById('usr-puesto').value = e.puesto || '';
            document.getElementById('usr-departamento').value = e.departamento || '';
            document.getElementById('usr-salario').value = e.salario_base || '';
            document.getElementById('usr-fecha-contrato').value = e.fecha_contratacion || '';
            document.getElementById('usr-fecha-fin').value = e.fecha_fin_contrato || '';
            document.getElementById('usr-tipo-contrato').value = e.tipo_contrato || '';
            document.getElementById('usr-capacidad-vehiculo').value = e.capacidad_vehiculo || '';
            document.getElementById('usr-unidad-capacidad').value = e.unidad_capacidad_vehiculo || '';
            if (e.moneda_salario_id) {
                const mon = await apiFetch(`monedas?id=eq.${e.moneda_salario_id}&select=codigo,nombre`);
                if (mon.length) document.getElementById('usr-moneda-salario').value = `${mon[0].codigo} - ${mon[0].nombre}`;
            }
            actualizarDependenciasPaisEmpleado(e.pais || empresaPais);
            llenarInputsTelefonoDesdeJson('#telefonos-container', u.telefonos || e.telefonos || [{etiqueta:'', numero:''}]);
            await llenarSelectSupervisores('usr-supervisor', e.supervisor_id || '');
        } else {
            llenarInputsTelefonoDesdeJson('#telefonos-container', u.telefonos || [{etiqueta:'', numero:''}]);
            if (empresaPais) {
                actualizarDependenciasPaisEmpleado(empresaPais);
            } else {
                actualizarSelectTiposDocumento('', 'usr-tipo-doc');
                actualizarTiposContrato('');
            }
            await llenarSelectSupervisores('usr-supervisor');
        }
        document.getElementById('modal-usuario').classList.add('active');
        if (typeof initTooltips === 'function') initTooltips();
    };

    window.toggleUsuario = function(id, activo) {
        const accion = activo ? 'activar' : 'desactivar';
        window.mostrarConfirmacion(`¿${accion} usuario?`, 'Cambiar estado', async () => {
            await apiFetch(`usuarios?id=eq.${id}`, 'PATCH', { activo });
            cargarEquipo(tabActivo);
            showNotification(activo ? 'Usuario activado' : 'Usuario desactivado');
        });
    };

    window.eliminarUsuarioDefinitivo = function(id) {
        window.mostrarConfirmacion('¿Eliminar permanentemente este usuario y su empleado asociado?', 'Eliminar Usuario', async () => {
            await apiFetch(`usuarios?id=eq.${id}`, 'DELETE');
            cargarEquipo(tabActivo);
            showNotification('Usuario eliminado');
        });
    };

    window.togglePassword = function(fid, btn) {
        const i = document.getElementById(fid);
        i.type = i.type === 'password' ? 'text' : 'password';
        btn.querySelector('i').classList.toggle('fa-eye');
        btn.querySelector('i').classList.toggle('fa-eye-slash');
    };

    window.agregarTelefono = function() {
        agregarTelefonoGenerico('#telefonos-container');
    };

    // Envío del formulario
    document.getElementById('form-usuario').addEventListener('submit', async function(e) {
        e.preventDefault();
        const userId = document.getElementById('usuario-id').value;
        const empleadoId = document.getElementById('empleado-id').value;
        const rol = document.getElementById('usr-rol').value;
        const telefonosArray = jsonATelefonosDesdeInputs('#telefonos-container');

        const payloadUsuario = {
            nombres: document.getElementById('usr-nombres').value.trim(),
            apellido_paterno: document.getElementById('usr-ap').value.trim(),
            apellido_materno: document.getElementById('usr-am').value.trim() || null,
            email: document.getElementById('usr-email').value.trim(),
            rol: rol,
            telefonos: telefonosArray,
            extension: document.getElementById('usr-extension').value.trim() || null,
            fecha_nacimiento: document.getElementById('usr-fecha-nac').value || null
        };

        const pass = document.getElementById('usr-password').value;
        const pass2 = document.getElementById('usr-password2').value;
        if (pass && pass.length >= 6) {
            if (pass !== pass2) { showNotification('Las contraseñas no coinciden', 'error'); return; }
            const hashResp = await apiFetch('rpc/crypt_password', 'POST', { pass });
            payloadUsuario.password_hash = typeof hashResp === 'string' ? hashResp : hashResp.crypt_password;
        }

        const tipoDocVal = document.getElementById('usr-tipo-doc').value.trim();
        const payloadEmpleado = {
            tipo_documento: tipoDocVal || null,
            numero_documento: document.getElementById('usr-num-doc').value.trim() || null,
            nombres: payloadUsuario.nombres,
            apellido_paterno: payloadUsuario.apellido_paterno,
            apellido_materno: payloadUsuario.apellido_materno,
            email: payloadUsuario.email,
            telefonos: telefonosArray,
            direccion: document.getElementById('usr-direccion').value.trim() || null,
            pais: document.getElementById('usr-pais').value.trim() || null,
            estado_provincia: document.getElementById('usr-estado').value.trim() || null,
            ciudad: document.getElementById('usr-ciudad').value.trim() || null,
            fecha_nacimiento: payloadUsuario.fecha_nacimiento,
            puesto: document.getElementById('usr-puesto').value.trim() || null,
            departamento: document.getElementById('usr-departamento').value.trim() || null,
            salario_base: parseFloat(document.getElementById('usr-salario').value) || null,
            tipo_contrato: document.getElementById('usr-tipo-contrato').value.trim() || null,
            fecha_contratacion: document.getElementById('usr-fecha-contrato').value || null,
            fecha_fin_contrato: document.getElementById('usr-fecha-fin').value || null,
            supervisor_id: document.getElementById('usr-supervisor').value || null
        };

        if (rol === 'Especialista Logístico') {
            payloadEmpleado.capacidad_vehiculo = parseFloat(document.getElementById('usr-capacidad-vehiculo').value) || null;
            payloadEmpleado.unidad_capacidad_vehiculo = document.getElementById('usr-unidad-capacidad').value.trim() || null;
        } else {
            payloadEmpleado.capacidad_vehiculo = null;
            payloadEmpleado.unidad_capacidad_vehiculo = null;
        }

        const monSal = document.getElementById('usr-moneda-salario').value.trim();
        if (monSal) payloadEmpleado.moneda_salario_id = await window.ensureCurrency(monSal);

        try {
            const file = document.getElementById('file-usr-imagen').files[0];
            if (file) {
                const url = await window.uploadFile(file, 'empleados');
                payloadUsuario.imagen = url;
                payloadEmpleado.imagen = url;
            }
        } catch {}

        try {
            if (!userId) {
                if (!pass || pass.length < 6) { showNotification('Contraseña mínima 6 caracteres', 'error'); return; }
                if (pass !== pass2) { showNotification('Las contraseñas no coinciden', 'error'); return; }
                if (!payloadUsuario.password_hash) {
                    const hashResp = await apiFetch('rpc/crypt_password', 'POST', { pass });
                    payloadUsuario.password_hash = typeof hashResp === 'string' ? hashResp : hashResp.crypt_password;
                }
                payloadUsuario.empresa_id = currentUser.empresa_id;
                await apiFetch('usuarios', 'POST', payloadUsuario);
                payloadEmpleado.empresa_id = currentUser.empresa_id;
                await apiFetch('empleados', 'POST', payloadEmpleado);
            } else {
                await apiFetch(`usuarios?id=eq.${userId}`, 'PATCH', payloadUsuario);
                if (empleadoId) {
                    await apiFetch(`empleados?id=eq.${empleadoId}`, 'PATCH', payloadEmpleado);
                } else {
                    payloadEmpleado.empresa_id = currentUser.empresa_id;
                    await apiFetch('empleados', 'POST', payloadEmpleado);
                }
            }
            cerrarModalUsuario();
            cargarEquipo(tabActivo);
            showNotification(userId ? 'Usuario actualizado' : 'Usuario creado');
        } catch (err) {
            showNotification('Error: ' + err.message, 'error');
        }
    });

    /* ===== FUNCIONES PRIVADAS ===== */
    async function cargarEquipo(tab) {
        if (!currentUser || !currentUser.empresa_id) return;
        tabActivo = tab;
        const empId = currentUser.empresa_id;
        let rolesFiltro = tab === 'comercial' ? ['Ejecutivo Comercial'] : ['Especialista Logístico', 'Gestor de Almacén'];
        const rolesEncoded = rolesFiltro.map(r => encodeURIComponent(`"${r}"`)).join(',');
        const usuarios = await apiFetch(`usuarios?empresa_id=eq.${empId}&select=*&order=apellido_paterno&rol=in.(${rolesEncoded})&limit=1000`);
        let filas = '';
        usuarios.forEach(u => {
            const telsMostrar = extraerTelefonosParaMostrar(u.telefonos);
            const estadoBadge = u.activo ? '<span class="badge badge-success">Activo</span>' : '<span class="badge badge-danger">Inactivo</span>';
            const acciones = (u.activo ?
                `<button class="btn-sm btn-edit" onclick="editarUsuario('${u.id}')"><i class="fas fa-edit"></i></button>
                 <button class="btn-sm btn-delete" onclick="toggleUsuario('${u.id}',false)"><i class="fas fa-ban"></i></button>` :
                `<button class="btn-sm btn-activate" onclick="toggleUsuario('${u.id}',true)"><i class="fas fa-check"></i></button>`) +
                `<button class="btn-sm btn-remove-permanent" onclick="eliminarUsuarioDefinitivo('${u.id}')"><i class="fas fa-trash-alt"></i></button>` +
                (telsMostrar ? generarBotonWhatsApp(u.telefonos) : '');
            filas += `<tr>
                <td>${u.nombres} ${u.apellido_paterno} ${u.apellido_materno || ''}</td>
                <td>${u.email}</td>
                <td>${u.rol}</td>
                <td>${telsMostrar || '-'}</td>
                <td>${estadoBadge}</td>
                <td class="action-buttons">${acciones}</td>
            </tr>`;
        });
        if (!filas) filas = '<tr><td colspan="6" style="text-align:center;">No hay miembros.</td></tr>';
        document.getElementById('equipo-tbody').innerHTML = filas;
        document.getElementById('equipo-titulo').textContent = tab === 'comercial' ? 'Equipo Comercial' : 'Equipo Distribución';
    }

    function llenarDatalists() {
        // Países
        const dlPaises = document.getElementById('usr-paises-list');
        if (dlPaises && typeof paisesData !== 'undefined') {
            dlPaises.innerHTML = '';
            paisesData.forEach(p => { const o = document.createElement('option'); o.value = p.name.common; dlPaises.appendChild(o); });
        }
        // Monedas
        const dlMon = document.getElementById('monedas-global-list-emp');
        if (dlMon && typeof todasLasMonedas !== 'undefined') {
            dlMon.innerHTML = '';
            todasLasMonedas.forEach(m => { const o = document.createElement('option'); o.value = `${m.codigo} - ${m.nombre}`; dlMon.appendChild(o); });
        }
        // Capacidades
        const dlCap = document.getElementById('unidad-cap-list');
        if (dlCap) {
            dlCap.innerHTML = '';
            ['toneladas','kg','m³','litros','unidades','pallets'].forEach(u => { const o = document.createElement('option'); o.value = u; dlCap.appendChild(o); });
        }
    }

    function llenarRolesSelect() {
        const sel = document.getElementById('usr-rol');
        if (!sel) return;
        sel.innerHTML = '';
        rolesDisponibles.forEach(r => { const o = document.createElement('option'); o.value = r; o.text = r; sel.appendChild(o); });
    }

    function actualizarSelectTiposDocumento(pais, selectId) {
        const sel = document.getElementById(selectId);
        if (!sel) return;
        sel.innerHTML = '';
        const clave = Object.keys(tiposDocPorPais).find(k => k.toLowerCase() === pais.toLowerCase());
        const tipos = clave ? tiposDocPorPais[clave] : ['CI','Pasaporte','DNI','RUC','NIT'];
        tipos.forEach(codigo => { const o = document.createElement('option'); o.value = codigo; o.text = tiposDocCompletos[codigo] || codigo; sel.appendChild(o); });
    }

    function actualizarTiposContrato(pais) {
        const dl = document.getElementById('tipos-contrato-list');
        if (!dl) return;
        dl.innerHTML = '';
        const clave = Object.keys(contratosBase).find(k => k.toLowerCase() === pais.toLowerCase());
        const lista = contratosBase[clave] || contratosBase['default'];
        lista.forEach(c => { const o = document.createElement('option'); o.value = c; dl.appendChild(o); });
    }

    function actualizarDependenciasPaisEmpleado(paisVal) {
        if (!paisVal) return;
        actualizarExtensionTelefono(paisVal);
        actualizarMonedaConPais({value: paisVal}, 'usr-moneda-salario');
        if (typeof cargarEstados === 'function') cargarEstados(paisVal, 'usr-estados-list');
        actualizarSelectTiposDocumento(paisVal, 'usr-tipo-doc');
        actualizarTiposContrato(paisVal);
        document.getElementById('usr-estado').value = '';
        document.getElementById('usr-ciudad').value = '';
        const dlCiudades = document.getElementById('usr-ciudades-list');
        if (dlCiudades) dlCiudades.innerHTML = '';
    }

    function actualizarExtensionTelefono(paisVal) {
        const extInput = document.getElementById('usr-extension');
        if (!extInput || !paisVal) return;
        const pais = paisesData.find(p => p.name.common.toLowerCase() === paisVal.toLowerCase());
        if (pais && pais.idd) extInput.value = (pais.idd.root || '') + (pais.idd.suffixes?.[0] || '');
        else extInput.value = '';
    }

    function actualizarMonedaConPais(paisInput, monedaInputId) {
        const val = typeof paisInput === 'string' ? paisInput : paisInput.value.trim();
        if (val.length > 1 && typeof paisesData !== 'undefined') {
            const pais = paisesData.find(p => p.name.common.toLowerCase() === val.toLowerCase());
            if (pais && pais.currencies) {
                const cod = Object.keys(pais.currencies)[0];
                document.getElementById(monedaInputId).value = `${cod} - ${pais.currencies[cod].name}`;
            }
        }
    }

    async function llenarSelectSupervisores(selectId, seleccionado = '') {
        if (!currentUser || !currentUser.empresa_id) return;
        const sel = document.getElementById(selectId);
        if (!sel) return;
        sel.innerHTML = '<option value="">Sin supervisor</option>';
        try {
            const supervisorRoles = ['Supervisor Senior', 'Director General', 'Director Financiero'];
            const rolesFiltro = supervisorRoles.map(r => `"${r}"`).join(',');
            const supervisoresUsuarios = await apiFetch(`usuarios?empresa_id=eq.${currentUser.empresa_id}&rol=in.(${encodeURIComponent(rolesFiltro)})&select=email&limit=1000`);
            const emails = supervisoresUsuarios.map(u => u.email.toLowerCase());
            if (emails.length === 0) return;
            const emps = await apiFetch(`empleados?empresa_id=eq.${currentUser.empresa_id}&activo=eq.true&select=id,nombres,apellido_paterno,email&limit=1000`);
            const filtrados = emps.filter(e => emails.includes((e.email||'').toLowerCase()));
            filtrados.forEach(e => {
                const o = document.createElement('option');
                o.value = e.id;
                o.text = `${e.nombres} ${e.apellido_paterno}`;
                if (e.id === seleccionado) o.selected = true;
                sel.appendChild(o);
            });
        } catch(e) {}
    }

    function onPaisChange() { actualizarDependenciasPaisEmpleado(this.value.trim()); }
    function onEstadoChange() {
        const pais = document.getElementById('usr-pais').value.trim();
        const est = this.value.trim();
        if (pais && est && typeof cargarCiudades === 'function') cargarCiudades(pais, est, 'usr-ciudades-list');
    }
    function onRolChange() {
        const rol = this.value;
        document.getElementById('usr-puesto').value = puestoPorRol[rol] || '';
        document.getElementById('usr-departamento').value = deptosPorRol[rol] || '';
        const rowCap = document.getElementById('row-capacidad-vehiculo');
        if (rol === 'Especialista Logístico') {
            rowCap.style.display = 'flex';
        } else {
            rowCap.style.display = 'none';
            document.getElementById('usr-capacidad-vehiculo').value = '';
            document.getElementById('usr-unidad-capacidad').value = '';
        }
    }

    /* Teléfonos dinámicos */
    function llenarInputsTelefonoDesdeJson(containerSelector, telefonos) {
        const container = document.querySelector(containerSelector);
        if (!container) return;
        container.innerHTML = '';
        const lista = Array.isArray(telefonos) ? telefonos : [];
        if (!lista.length) lista.push({ etiqueta:'', numero:'' });
        lista.forEach(item => {
            let etiqueta='', numero='';
            if (typeof item === 'string') { numero = item; }
            else if (item && typeof item === 'object') { etiqueta = item.etiqueta || ''; numero = item.numero || ''; }
            const row = document.createElement('div'); row.className = 'phone-input-row';
            const tagInp = document.createElement('input'); tagInp.type='text'; tagInp.className='tag-input'; tagInp.placeholder='Etiqueta'; tagInp.value=etiqueta;
            tagInp.addEventListener('input', function() { if (typeof capitalizarInput === 'function') capitalizarInput(this); });
            const numInp = document.createElement('input'); numInp.type='text'; numInp.placeholder='555-1234'; numInp.value=numero;
            row.appendChild(tagInp); row.appendChild(numInp);
            container.appendChild(row);
        });
        actualizarEstadoTelefonos(containerSelector);
    }

    function agregarTelefonoGenerico(containerSelector) {
        const container = document.querySelector(containerSelector);
        if (!container) return;
        const row = document.createElement('div'); row.className = 'phone-input-row';
        const tagInp = document.createElement('input'); tagInp.type='text'; tagInp.className='tag-input'; tagInp.placeholder='Etiqueta';
        tagInp.addEventListener('input', function() { if (typeof capitalizarInput === 'function') capitalizarInput(this); });
        const numInp = document.createElement('input'); numInp.type='text'; numInp.placeholder='555-1234';
        row.appendChild(tagInp); row.appendChild(numInp);
        container.appendChild(row);
        actualizarEstadoTelefonos(containerSelector);
    }

    function actualizarEstadoTelefonos(containerSelector) {
        const container = document.querySelector(containerSelector);
        if (!container) return;
        const filas = container.querySelectorAll('.phone-input-row');
        filas.forEach(fila => {
            const existingBtn = fila.querySelector('.btn-remove-phone');
            if (filas.length === 1 && existingBtn) existingBtn.remove();
            else if (filas.length > 1 && !existingBtn) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn-remove-phone';
                btn.innerHTML = '<i class="fas fa-minus"></i>';
                btn.title = 'Eliminar';
                btn.onclick = function() { fila.remove(); actualizarEstadoTelefonos(containerSelector); };
                fila.appendChild(btn);
            }
        });
    }

    function jsonATelefonosDesdeInputs(containerSelector) {
        const rows = document.querySelectorAll(containerSelector + ' .phone-input-row');
        const tels = [];
        rows.forEach(row => {
            const tagInput = row.querySelector('input.tag-input');
            const numInput = row.querySelector('input:not(.tag-input)');
            const etiqueta = tagInput ? tagInput.value.trim() : '';
            const numero = numInput ? numInput.value.trim() : '';
            if (numero || etiqueta) tels.push({ etiqueta, numero });
        });
        return tels;
    }

    function extraerTelefonosParaMostrar(telefonos) {
        if (!telefonos) return '';
        const arr = Array.isArray(telefonos) ? telefonos : [];
        return arr.map(item => typeof item === 'string' ? item : (item.numero || '')).filter(Boolean).join(', ');
    }

    /* WhatsApp */
    function generarBotonWhatsApp(telefonosJson) {
        const numeros = [];
        if (Array.isArray(telefonosJson)) {
            telefonosJson.forEach(item => {
                if (typeof item === 'string') numeros.push(item);
                else if (item && item.numero) numeros.push(item.numero);
            });
        } else if (typeof telefonosJson === 'string') {
            numeros.push(...telefonosJson.split(',').map(t => t.trim()).filter(t => t));
        }
        if (!numeros.length) return '';
        if (numeros.length === 1) {
            return `<button class="btn-sm btn-whatsapp" onclick="abrirWhatsApp('${numeros[0]}')" title="Hablar por WhatsApp"><i class="fab fa-whatsapp"></i></button>`;
        }
        const idUnico = 'whatsapp-dd-' + Math.random().toString(36).substr(2,9);
        let opciones = numeros.map(n => `<a href="#" onclick="event.preventDefault(); abrirWhatsApp('${n}'); document.getElementById('${idUnico}').classList.remove('show');">📞 ${n}</a>`).join('');
        return `<div class="whatsapp-dropdown">
            <button class="btn-sm btn-whatsapp" onclick="event.stopPropagation(); toggleWhatsAppDropdown(this, '${idUnico}')"><i class="fab fa-whatsapp"></i> <i class="fas fa-caret-down" style="font-size:0.7rem;"></i></button>
            <div class="whatsapp-dropdown-content" id="${idUnico}">${opciones}</div>
        </div>`;
    }

    window.abrirWhatsApp = function(numero) {
        const iframe = document.getElementById('whatsapp-iframe');
        iframe.src = `whatsapp://send?phone=${numero}`;
        setTimeout(() => { iframe.src = ''; }, 2000);
    };

    window.toggleWhatsAppDropdown = function(btn, idUnico) {
        const dd = document.getElementById(idUnico);
        if (!dd) return;
        const isOpening = !dd.classList.contains('show');
        document.querySelectorAll('.whatsapp-dropdown-content.show').forEach(d => d.classList.remove('show'));
        if (isOpening) {
            const btnRect = btn.getBoundingClientRect();
            dd.style.top = (btnRect.bottom + 4) + 'px';
            dd.style.left = (btnRect.left - 100) + 'px';
            dd.classList.add('show');
        }
    };

    document.addEventListener('click', function(e) {
        const dropdowns = document.querySelectorAll('.whatsapp-dropdown-content.show');
        let inside = false;
        dropdowns.forEach(dd => { if (dd.contains(e.target)) inside = true; });
        if (!inside) dropdowns.forEach(dd => dd.classList.remove('show'));
    });

})();
</script>
