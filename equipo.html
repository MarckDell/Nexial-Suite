        function llenarInputsTelefonoDesdeJson(containerSelector,telefonos){const container=document.querySelector(containerSelector);if(!container)return;container.innerHTML='';const lista=Array.isArray(telefonos)?telefonos:[];if(!lista.length)lista.push({etiqueta:'',numero:''});lista.forEach(item=>{let etiqueta='',numero='';if(typeof item==='string'){numero=item;}else if(item&&typeof item==='object'){etiqueta=item.etiqueta||'';numero=item.numero||'';}const row=document.createElement('div');row.className='phone-input-row';const tagInp=document.createElement('input');tagInp.type='text';tagInp.className='tag-input';tagInp.placeholder='Etiqueta';tagInp.value=etiqueta;tagInp.addEventListener('input',function(){capitalizarInput(this);});const numInp=document.createElement('input');numInp.type='text';numInp.placeholder='555-1234';numInp.value=numero;row.appendChild(tagInp);row.appendChild(numInp);container.appendChild(row);});actualizarEstadoTelefonos(containerSelector);}
        function agregarTelefonoGenerico(containerSelector){const container=document.querySelector(containerSelector);if(!container)return;const row=document.createElement('div');row.className='phone-input-row';const tagInp=document.createElement('input');tagInp.type='text';tagInp.className='tag-input';tagInp.placeholder='Etiqueta';tagInp.addEventListener('input',function(){capitalizarInput(this);});const numInp=document.createElement('input');numInp.type='text';numInp.placeholder='555-1234';row.appendChild(tagInp);row.appendChild(numInp);container.appendChild(row);actualizarEstadoTelefonos(containerSelector);}

        function actualizarEstadoTelefonos(containerSelector){const container=document.querySelector(containerSelector);if(!container)return;const filas=container.querySelectorAll('.phone-input-row');filas.forEach(fila=>{const existingBtn=fila.querySelector('.btn-remove-phone');if(filas.length===1&&existingBtn)existingBtn.remove();else if(filas.length>1&&!existingBtn){const btn=document.createElement('button');btn.type='button';btn.className='btn-remove-phone';btn.innerHTML='<i class="fas fa-minus"></i>';btn.title='Eliminar';btn.onclick=function(){fila.remove();actualizarEstadoTelefonos(containerSelector);};fila.appendChild(btn);}});}
        function initTooltips(){const tooltip=document.getElementById('tooltip-global');document.querySelectorAll('.tooltip-trigger').forEach(trigger=>{trigger.addEventListener('mouseenter',function(e){const text=this.getAttribute('data-tooltip');if(!text)return;tooltip.textContent=text;tooltip.classList.add('visible');});trigger.addEventListener('mouseleave',()=>tooltip.classList.remove('visible'));trigger.addEventListener('mousemove',function(e){tooltip.style.left=e.clientX-160+'px';tooltip.style.top=e.clientY-10-tooltip.offsetHeight+'px';});});}
        function extraerCodigo(v){return(v.split(' - ')[0]||'').trim().toUpperCase();}
        async function ensureCurrency(input){const cod=extraerCodigo(input);if(!cod)throw new Error('Moneda inválida');const exist=await apiFetch(`monedas?codigo=eq.${encodeURIComponent(cod)}&select=id`);if(exist.length)return exist[0].id;const data=todasLasMonedas.find(m=>m.codigo===cod)||{nombre:cod,symbol:null};const nueva=await apiFetch('monedas','POST',{codigo:cod,nombre:data.nombre,simbolo:data.symbol});return Array.isArray(nueva)?nueva[0].id:nueva.id;}
        async function ensureUnidadMedida(nombre){if(!nombre||!nombre.trim())return null;const nm=nombre.trim();const exist=await apiFetch(`unidades_medida?nombre=eq.${encodeURIComponent(nm)}&select=id`);if(exist.length)return exist[0].id;const nueva=await apiFetch('unidades_medida','POST',{nombre:nm,codigo:nm.substring(0,20),abreviacion:nm.substring(0,10)});return Array.isArray(nueva)?nueva[0].id:nueva.id;}
        async function buscarPaisId(nombre){try{const r=await fetch(`${GEO_API_BASE}/countries/search/${encodeURIComponent(nombre)}`);if(!r.ok)return null;const d=await r.json();return d.length?d[0].id:null;}catch{return null;}}
        async function cargarEstados(paisNombre,datalistId){const dl=document.getElementById(datalistId);if(!dl)return;dl.innerHTML='';const id=await buscarPaisId(paisNombre);if(!id)return;const r=await fetch(`${GEO_API_BASE}/countries/${id}/states`);if(!r.ok)return;const estados=await r.json();estados.forEach(e=>{const o=document.createElement('option');o.value=e.name;dl.appendChild(o);});}
        async function cargarCiudades(paisNombre,estadoNombre,datalistId){const dl=document.getElementById(datalistId);if(!dl)return;dl.innerHTML='';const paisId=await buscarPaisId(paisNombre);if(!paisId)return;const r=await fetch(`${GEO_API_BASE}/countries/${paisId}/states`);if(!r.ok)return;const estados=await r.json();const est=estados.find(e=>e.name.toLowerCase()===estadoNombre.toLowerCase());if(!est)return;const c=await fetch(`${GEO_API_BASE}/states/${est.id}/cities`);if(!c.ok)return;const cities=await c.json();cities.forEach(city=>{const o=document.createElement('option');o.value=city.name;dl.appendChild(o);});}
        function monedaPorDefecto(){const mon=todasLasMonedas.find(m=>m.codigo===empresaMonedaCodigo);return mon?`${mon.codigo} - ${mon.nombre}`:empresaMonedaCodigo;}

        function actualizarSelectTiposDocumento(pais,selectId){const sel=document.getElementById(selectId);if(!sel)return;sel.innerHTML='';const clave=Object.keys(tiposDocPorPais).find(k=>k.toLowerCase()===pais.toLowerCase());const tipos=clave?tiposDocPorPais[clave]:['CI','Pasaporte','DNI','RUC','NIT'];tipos.forEach(codigo=>{const o=document.createElement('option');o.value=codigo;o.text=tiposDocCompletos[codigo]||codigo;sel.appendChild(o);});}
        function actualizarTiposContrato(pais){const dl=document.getElementById('tipos-contrato-list');if(!dl)return;dl.innerHTML='';const clave=Object.keys(contratosBase).find(k=>k.toLowerCase()===pais.toLowerCase());const lista=contratosBase[clave]||contratosBase['default'];lista.forEach(c=>{const o=document.createElement('option');o.value=c;dl.appendChild(o);});}
        function actualizarMonedaConPais(paisInput,monedaInputId){const val=typeof paisInput==='string'?paisInput:paisInput.value.trim();if(val.length>1){const pais=paisesData.find(p=>p.name.common.toLowerCase()===val.toLowerCase());if(pais&&pais.currencies){const cod=Object.keys(pais.currencies)[0];document.getElementById(monedaInputId).value=`${cod} - ${pais.currencies[cod].name}`;}}}
        function togglePassword(fid,btn){const i=document.getElementById(fid);i.type=i.type==='password'?'text':'password';btn.querySelector('i').classList.toggle('fa-eye');btn.querySelector('i').classList.toggle('fa-eye-slash');}

        function toggleWhatsAppDropdown(btn,idUnico){const dd=document.getElementById(idUnico);if(!dd)return;const isOpening=!dd.classList.contains('show');document.querySelectorAll('.whatsapp-dropdown-content.show').forEach(d=>d.classList.remove('show'));if(isOpening){const btnRect=btn.getBoundingClientRect();dd.style.top=(btnRect.bottom+4)+'px';dd.style.left=(btnRect.left-100)+'px';dd.classList.add('show');}}

        function generarBotonWhatsApp(telefonosJson){const numeros=[];if(Array.isArray(telefonosJson)){telefonosJson.forEach(item=>{if(typeof item==='string')numeros.push(item);else if(item&&item.numero)numeros.push(item.numero);});}else if(typeof telefonosJson==='string')numeros.push(...telefonosJson.split(',').map(t=>t.trim()).filter(t=>t));if(!numeros.length)return'';if(numeros.length===1)return`<button class="btn-sm btn-whatsapp" onclick="abrirWhatsApp('${numeros[0]}')" title="Hablar por WhatsApp"><i class="fab fa-whatsapp"></i></button>`;const idUnico='whatsapp-dd-'+Math.random().toString(36).substr(2,9);let opciones=numeros.map(n=>`<a href="#" onclick="event.preventDefault(); abrirWhatsApp('${n}'); document.getElementById('${idUnico}').classList.remove('show');">📞 ${n}</a>`).join('');return`<div class="whatsapp-dropdown"><button class="btn-sm btn-whatsapp" onclick="event.stopPropagation(); toggleWhatsAppDropdown(this, '${idUnico}')"><i class="fab fa-whatsapp"></i> <i class="fas fa-caret-down" style="font-size:0.7rem;"></i></button><div class="whatsapp-dropdown-content" id="${idUnico}">${opciones}</div></div>`;}

        function llenarRolesSelect(){const sel=document.getElementById('usr-rol');if(!sel)return;sel.innerHTML='';rolesDisponibles.forEach(r=>{const o=document.createElement('option');o.value=r;o.text=r;sel.appendChild(o);});}
        async function llenarSelectSupervisores(selectId,seleccionado=''){if(!currentUser||!currentUser.empresa_id)return;const sel=document.getElementById(selectId);if(!sel)return;sel.innerHTML='<option value="">Sin supervisor</option>';try{const rolesFiltro=['Supervisor Senior','Director General','Director Financiero'].map(r=>`"${r}"`).join(',');const supervisoresUsuarios=await apiFetch(`usuarios?empresa_id=eq.${currentUser.empresa_id}&rol=in.(${encodeURIComponent(rolesFiltro)})&select=email&limit=1000`);const emails=supervisoresUsuarios.map(u=>u.email.toLowerCase());if(emails.length===0)return;const emps=await apiFetch(`empleados?empresa_id=eq.${currentUser.empresa_id}&activo=eq.true&select=id,nombres,apellido_paterno,email&limit=1000`);const filtrados=emps.filter(e=>emails.includes((e.email||'').toLowerCase()));filtrados.forEach(e=>{const o=document.createElement('option');o.value=e.id;o.text=`${e.nombres} ${e.apellido_paterno}`;if(e.id===seleccionado)o.selected=true;sel.appendChild(o);});}catch(e){}}

        async function cargarEquipo(tab='comercial'){
            if(!currentUser||!currentUser.empresa_id)return;
            const empId=currentUser.empresa_id;
            let rolesFiltro=tab==='comercial'?['Ejecutivo Comercial']:['Especialista Logístico','Gestor de Almacén'];
            const rolesEncoded=rolesFiltro.map(r=>encodeURIComponent(`"${r}"`)).join(',');
            const usuarios=await apiFetch(`usuarios?empresa_id=eq.${empId}&select=*&order=apellido_paterno&rol=in.(${rolesEncoded})&limit=1000`);
            let filas='';
            usuarios.forEach(u=>{
                const telsMostrar=extraerTelefonosParaMostrar(u.telefonos);
                filas+=`<tr><td>${u.nombres} ${u.apellido_paterno} ${u.apellido_materno||''}</td><td>${u.email}</td><td>${u.rol}</td><td>${telsMostrar||'-'}</td><td><span class="badge ${u.activo?'badge-success':'badge-danger'}">${u.activo?'Activo':'Inactivo'}</span></td><td class="action-buttons"><button class="btn-sm btn-edit" onclick="editarUsuario('${u.id}')"><i class="fas fa-edit"></i></button>${u.activo?`<button class="btn-sm btn-delete" onclick="toggleUsuario('${u.id}',false)"><i class="fas fa-ban"></i></button>`:`<button class="btn-sm btn-activate" onclick="toggleUsuario('${u.id}',true)"><i class="fas fa-check"></i></button>`}<button class="btn-sm btn-remove-permanent" onclick="eliminarUsuarioDefinitivo('${u.id}')"><i class="fas fa-trash-alt"></i></button>${telsMostrar?generarBotonWhatsApp(u.telefonos):''}</td></tr>`;
            });
            if(!filas)filas='<tr><td colspan="6" style="text-align:center;">No hay miembros.</td></tr>';
            document.getElementById('equipo-container').innerHTML=`
            <div class="tabs-compact"><button class="tab-btn-compact ${tab==='comercial'?'active':''}" onclick="cargarEquipo('comercial')"><i class="fas fa-user-tie"></i> Comercial</button><button class="tab-btn-compact ${tab==='distribucion'?'active':''}" onclick="cargarEquipo('distribucion')"><i class="fas fa-truck"></i> Distribución</button></div>
            <div class="card"><div class="card-header"><h2>${tab==='comercial'?'Equipo Comercial':'Equipo Distribución'}</h2><button class="btn-solid" onclick="abrirModalUsuario(null,'${tab}')"><i class="fas fa-plus"></i> Nuevo Miembro</button></div><div class="table-wrapper"><table><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Teléfonos</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${filas}</tbody></table></div></div>`;
            llenarRolesSelect();
            initTooltips();
        }

        async function abrirModalUsuario(id=null,tab=null){
            document.getElementById('modal-usuario').classList.add('active');
            document.getElementById('form-usuario').reset();document.getElementById('usuario-id').value='';document.getElementById('empleado-id').value='';
            document.getElementById('password-fields').style.display='flex';
            document.getElementById('titulo-modal-usuario').textContent='Nuevo Miembro';
            document.getElementById('row-capacidad-vehiculo').style.display='none';
            document.getElementById('usr-moneda-salario').value=monedaPorDefecto();
            document.getElementById('usr-pais').value=empresaPais;
            if(empresaPais)actualizarDependenciasPaisEmpleado(empresaPais);
            else{actualizarSelectTiposDocumento('','usr-tipo-doc');actualizarTiposContrato('');}
            llenarInputsTelefonoDesdeJson('#telefonos-container',[{etiqueta:'',numero:''}]);

        function cerrarModalUsuario(){document.getElementById('modal-usuario').classList.remove('active');}
        async function editarUsuario(id){
            const usuarios=await apiFetch(`usuarios?id=eq.${id}&select=*`);if(!usuarios.length)return;
            const u=usuarios[0];
            document.getElementById('usuario-id').value=u.id;
            document.getElementById('usr-nombres').value=u.nombres;document.getElementById('usr-ap').value=u.apellido_paterno;document.getElementById('usr-am').value=u.apellido_materno||'';
            document.getElementById('usr-email').value=u.email;document.getElementById('usr-rol').value=u.rol;
            document.getElementById('usr-extension').value=u.extension||'';document.getElementById('usr-fecha-nac').value=u.fecha_nacimiento||'';
            document.getElementById('password-fields').style.display='none';
            document.getElementById('titulo-modal-usuario').textContent='Editar Miembro';
            const rowCap=document.getElementById('row-capacidad-vehiculo');
            if(u.rol==='Especialista Logístico')rowCap.style.display='flex';else{rowCap.style.display='none';document.getElementById('usr-capacidad-vehiculo').value='';document.getElementById('usr-unidad-capacidad').value='';}
            document.getElementById('usr-puesto').value=puestoPorRol[u.rol]||'';document.getElementById('usr-departamento').value=deptosPorRol[u.rol]||'';
            document.getElementById('usr-moneda-salario').value=monedaPorDefecto();
            const empleados=await apiFetch(`empleados?empresa_id=eq.${currentUser.empresa_id}&email=eq.${encodeURIComponent(u.email)}&select=*&order=creado_en.desc&limit=1`);
            if(empleados.length){
                const e=empleados[0];
                document.getElementById('empleado-id').value=e.id;
                document.getElementById('usr-tipo-doc').value=e.tipo_documento||'';document.getElementById('usr-num-doc').value=e.numero_documento||'';
                document.getElementById('usr-direccion').value=e.direccion||'';document.getElementById('usr-pais').value=e.pais||empresaPais;
                document.getElementById('usr-estado').value=e.estado_provincia||'';document.getElementById('usr-ciudad').value=e.ciudad||'';
                document.getElementById('usr-puesto').value=e.puesto||'';document.getElementById('usr-departamento').value=e.departamento||'';
                document.getElementById('usr-salario').value=e.salario_base||'';document.getElementById('usr-fecha-contrato').value=e.fecha_contratacion||'';
                document.getElementById('usr-fecha-fin').value=e.fecha_fin_contrato||'';document.getElementById('usr-tipo-contrato').value=e.tipo_contrato||'';
                document.getElementById('usr-capacidad-vehiculo').value=e.capacidad_vehiculo||'';document.getElementById('usr-unidad-capacidad').value=e.unidad_capacidad_vehiculo||'';
                if(e.moneda_salario_id){const mon=await apiFetch(`monedas?id=eq.${e.moneda_salario_id}&select=codigo,nombre`);if(mon.length)document.getElementById('usr-moneda-salario').value=`${mon[0].codigo} - ${mon[0].nombre}`;}
                actualizarDependenciasPaisEmpleado(e.pais||empresaPais);
                llenarInputsTelefonoDesdeJson('#telefonos-container',u.telefonos||e.telefonos||[{etiqueta:'',numero:''}]);
                await llenarSelectSupervisores('usr-supervisor',e.supervisor_id||'');
            }else{
                llenarInputsTelefonoDesdeJson('#telefonos-container',u.telefonos||[{etiqueta:'',numero:''}]);
                if(empresaPais)actualizarDependenciasPaisEmpleado(empresaPais);else{actualizarSelectTiposDocumento('','usr-tipo-doc');actualizarTiposContrato('');}
                await llenarSelectSupervisores('usr-supervisor');
            }
            document.getElementById('modal-usuario').classList.add('active');
            initTooltips();
        }
        function toggleUsuario(id,activo){const accion=activo?'activar':'desactivar';mostrarConfirmacion(`¿${accion} usuario?`,'Cambiar estado',async()=>{await apiFetch(`usuarios?id=eq.${id}`,'PATCH',{activo});cargarEquipo(document.querySelector('#equipo-container .tab-btn-compact.active')?.dataset.tab||'comercial');showNotification(activo?'Usuario activado':'Usuario desactivado');});}

        });

        document.getElementById('usr-pais').addEventListener('input',function(){actualizarDependenciasPaisEmpleado(this.value.trim());});
        document.getElementById('usr-estado').addEventListener('input',function(){const pais=document.getElementById('usr-pais').value.trim();const est=this.value.trim();if(pais&&est)cargarCiudades(pais,est,'usr-ciudades-list');});
        document.getElementById('usr-rol').addEventListener('change',function(){
            const rol=this.value;
            document.getElementById('usr-puesto').value=puestoPorRol[rol]||'';
            document.getElementById('usr-departamento').value=deptosPorRol[rol]||'';
            const rowCap=document.getElementById('row-capacidad-vehiculo');
            if(rol==='Especialista Logístico'){rowCap.style.display='flex';}
            else{rowCap.style.display='none';document.getElementById('usr-capacidad-vehiculo').value='';document.getElementById('usr-unidad-capacidad').value='';}
        });
        document.querySelectorAll('form').forEach(f=>f.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&!e.target.closest('button[type="submit"]'))e.preventDefault();}));

        async function cargarDatosIniciales(){
            paisesData=PAISES_ESTATICOS;
            ['usr-paises-list'].forEach(id=>{const dl=document.getElementById(id);if(!dl)return;dl.innerHTML='';paisesData.forEach(p=>{const o=document.createElement('option');o.value=p.name.common;dl.appendChild(o);});});
            const monSet=new Map();
            paisesData.forEach(p=>{if(p.currencies)Object.entries(p.currencies).forEach(([c,i])=>{if(!monSet.has(c))monSet.set(c,{name:i.name,symbol:i.symbol||''});});});
            todasLasMonedas=Array.from(monSet,([c,d])=>({codigo:c,nombre:d.name,simbolo:d.symbol}));
            try{const bdMonedas=await apiFetch('monedas?select=codigo,nombre,simbolo');bdMonedas.forEach(m=>{if(!todasLasMonedas.find(t=>t.codigo===m.codigo))todasLasMonedas.push({codigo:m.codigo,nombre:m.nombre,simbolo:m.simbolo||''});});}catch(e){}
            ['monedas-global-list-emp'].forEach(id=>{const dl=document.getElementById(id);if(!dl)return;dl.innerHTML='';todasLasMonedas.forEach(m=>{const o=document.createElement('option');o.value=`${m.codigo} - ${m.nombre}`;dl.appendChild(o);});});
            if(currentUser&&currentUser.empresa_id){
                const emp=await apiFetch(`empresas?id=eq.${currentUser.empresa_id}&select=moneda_principal_id,pais`);
                if(emp.length>0){
                    if(emp[0].moneda_principal_id){const mon=await apiFetch(`monedas?id=eq.${emp[0].moneda_principal_id}&select=codigo`);if(mon.length>0)empresaMonedaCodigo=mon[0].codigo;}
                    empresaPais=emp[0].pais||'';
                }
            }
            const caps=['toneladas','kg','m³','litros','unidades','pallets'];
            const dlCap=document.getElementById('unidad-cap-list');if(dlCap){dlCap.innerHTML='';caps.forEach(u=>{const o=document.createElement('option');o.value=u;dlCap.appendChild(o);});}
        }

        window.onload=async function(){
            verificarSesion();
            if(currentUser){
                await cargarDatosIniciales();
                cargarEquipo('comercial');
            }
        };
    </script>
</body>
</html>
