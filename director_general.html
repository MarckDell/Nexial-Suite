<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Nexial Suite · Panel de Control</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background:#f4f6fb; color:#1a1f36; line-height:1.6; touch-action:manipulation; }
        .navbar { position:fixed; top:0; width:100%; background:rgba(10,15,30,0.94); backdrop-filter:blur(14px); z-index:1000; border-bottom:1px solid rgba(255,255,255,0.05); padding:0 32px; height:72px; display:flex; align-items:center; justify-content:space-between; }
        .logo-area { display:flex; align-items:center; gap:12px; text-decoration:none; }
        .logo-icon { font-size:2.2rem; background:linear-gradient(135deg,#1a56db,#00a3ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 12px rgba(26,86,219,0.6)); }
        .logo-text { font-size:1.5rem; font-weight:700; background:linear-gradient(to right,#ffffff,#c0d0f0); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .nav-actions { display:flex; align-items:center; gap:20px; }
        .user-info { display:flex; align-items:center; gap:14px; color:white; padding:8px 20px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(8px); }
        .user-icon { font-size:1.6rem; color:#1a56db; filter:drop-shadow(0 0 6px rgba(26,86,219,0.5)); }
        .user-details { display:flex; flex-direction:column; line-height:1.3; }
        .user-name { font-weight:700; font-size:1.15rem; letter-spacing:0.2px; color:#fff; }
        .user-role-badge { font-size:0.7rem; font-weight:600; background:linear-gradient(135deg,#1a56db,#4a8eff); padding:3px 12px; border-radius:20px; text-transform:uppercase; letter-spacing:0.8px; width:fit-content; margin-top:4px; color:#fff; box-shadow:0 2px 8px rgba(26,86,219,0.3); }
        .btn-outline { background:transparent; border:1.5px solid rgba(255,255,255,0.35); color:white; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; transition:0.25s; display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; }
        .btn-outline:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.7); box-shadow:0 0 18px rgba(0,150,255,0.3); }
        .btn-solid { background:#1a56db; border:none; color:white; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; transition:0.25s; display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; }
        .btn-solid:hover { background:#1340a0; box-shadow:0 0 18px rgba(26,86,219,0.5); }
        .dashboard-container { margin-top:72px; display:flex; min-height:calc(100vh - 72px); }
        .sidebar { width:260px; background:white; border-right:1px solid #e5e7eb; padding:20px 0; display:flex; flex-direction:column; position:fixed; top:72px; bottom:0; overflow-y:auto; z-index:900; }
        .sidebar-menu { list-style:none; flex:1; }
        .sidebar-menu li { padding:0 16px; margin-bottom:2px; }
        .sidebar-menu a { display:flex; align-items:center; gap:12px; padding:12px 18px; border-radius:12px; color:#475569; font-weight:500; font-size:0.9rem; text-decoration:none; transition:0.2s; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background:#f1f5f9; color:#1a56db; font-weight:600; }
        .sidebar-menu a i { font-size:1.1rem; width:22px; text-align:center; }
        .sidebar-menu a.external-link i.fa-external-link-alt { font-size:0.7rem; margin-left:auto; opacity:0.5; }
        .main-content { margin-left:260px; flex:1; padding:32px; background:#f4f6fb; }
        .loading { text-align:center; padding:40px; color:#64748b; }
        .error { color:#c2412c; padding:20px; text-align:center; }
        /* Modal de confirmación */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(2,6,18,0.8); backdrop-filter:blur(8px); z-index:2000; display:none; align-items:flex-start; justify-content:center; padding:24px; overflow-y:auto; }
        .modal-overlay.active { display:flex; }
        .modal { background:white; border-radius:28px; padding:36px 32px; max-width:440px; width:100%; box-shadow:0 30px 60px rgba(0,0,0,0.4); animation:modalIn 0.3s ease; position:relative; margin:auto 0; text-align:center; }
        @keyframes modalIn { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
        .modal-header { margin-bottom:24px; }
        .modal-header h2 { font-size:1.7rem; font-weight:700; color:#0f172a; }
        .confirm-buttons { display:flex; gap:12px; justify-content:center; margin-top:24px; }
        .notification { position:fixed; top:24px; right:32px; background:#1a1f36; color:white; padding:14px 28px; border-radius:60px; font-weight:500; z-index:3000; box-shadow:0 12px 28px rgba(0,0,0,0.3); display:none; align-items:center; gap:10px; font-size:0.9rem; }
        .notification.error { background:#c2412c; }
        .notification.success { background:#2c6e49; }
        @media (max-width:900px) {
            .sidebar { width:100%; height:auto; position:relative; top:auto; bottom:auto; flex-direction:row; overflow-x:auto; padding:8px; border-right:none; border-bottom:1px solid #e2e8f0; }
            .sidebar-menu { display:flex; gap:4px; }
            .sidebar-menu li { padding:0; }
            .sidebar-menu a { padding:8px 14px; font-size:0.78rem; white-space:nowrap; }
            .main-content { margin-left:0; padding:16px; }
            .dashboard-container { flex-direction:column; }
            .navbar { padding:0 12px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo-area">
            <i class="fas fa-brain logo-icon"></i>
            <span class="logo-text">Nexial Suite</span>
        </a>
        <div class="nav-actions">
            <div class="user-info" id="user-display"></div>
            <button class="btn-outline" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar-menu"></aside>
        <main class="main-content" id="main-panel">
            <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Cargando panel...</div>
        </main>
    </div>

    <!-- Modal Confirmación Global -->
    <div class="modal-overlay" id="modal-confirm">
        <div class="modal">
            <div class="modal-header"><h2 id="confirm-titulo">Confirmar acción</h2></div>
            <p id="confirm-mensaje" style="color:#475569; font-size:0.95rem; margin-bottom:8px;"></p>
            <div class="confirm-buttons">
                <button class="btn-outline" style="color:#1e293b; border-color:#cbd5e1;" onclick="cerrarModalConfirm(false)">Cancelar</button>
                <button class="btn-solid" style="background:#c2412c;" onclick="cerrarModalConfirm(true)">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Notificación -->
    <div id="notification" class="notification"><i class="fas fa-circle-info"></i><span></span></div>

    <script>
        // ===================== CONFIGURACIÓN GLOBAL =====================
        const SUPABASE_URL = 'https://zgzwhyywkervutpvazqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aE2X3gv4CE110VzI4uoT-Q_yo4Xv6Zb';
        const STORAGE_BUCKET = 'empresas';

        let currentUser = null;

        // ===================== PERMISOS POR ROL =====================
        const ROLE_PERMISSIONS = {
            'Director Corporativo': ['inicio', 'equipo', 'metas', 'distribucion', 'clientes', 'productos', 'rutas', 'carga', 'admin'],
            'Director General':    ['inicio', 'equipo', 'metas', 'distribucion', 'clientes', 'productos', 'rutas', 'carga'],
            'Director Financiero': ['inicio', 'equipo', 'metas', 'distribucion', 'clientes', 'productos'],
            'Supervisor Senior':  ['inicio', 'equipo', 'metas', 'distribucion', 'clientes', 'productos', 'rutas', 'carga'],
            'Ejecutivo Comercial': ['inicio', 'mis_metas', 'clientes', 'productos'],
            'Especialista Logístico': ['inicio', 'distribucion', 'clientes', 'productos', 'rutas', 'carga'],
            'Gestor de Almacén':   ['inicio', 'productos', 'distribucion', 'inventario']
        };

        // Definición de los módulos y sus íconos / enlaces externos
        const MENU_ITEMS = {
            inicio:        { icon: 'fa-home',       label: 'Inicio' },
            equipo:        { icon: 'fa-users',      label: 'Equipo' },
            metas:         { icon: 'fa-bullseye',   label: 'Metas' },
            distribucion:  { icon: 'fa-boxes',      label: 'Distribución' },
            clientes:      { icon: 'fa-building',   label: 'Clientes' },
            productos:     { icon: 'fa-box',        label: 'Productos' },
            rutas:         { icon: 'fa-route',      label: 'Asignación de rutas', external: 'asignacion_rutas.html' },
            carga:         { icon: 'fa-truck-loading', label: 'Asignación de carga', external: 'asignacion_carga.html' },
            admin:         { icon: 'fa-cogs',       label: 'Administración' },
            mis_metas:     { icon: 'fa-bullseye',   label: 'Mis Metas' },
            inventario:    { icon: 'fa-warehouse',  label: 'Inventario' }
        };

        // ===================== FUNCIONES GLOBALES (usables por los paneles) =====================
        async function apiFetch(endpoint, method = 'GET', body = null) {
            const headers = { 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` };
            if (method === 'POST' || method === 'PATCH') headers['Prefer'] = 'return=representation';
            const opts = { method, headers };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, opts);
            if (!res.ok) { const e = await res.text(); throw new Error(e); }
            const txt = await res.text();
            return txt ? JSON.parse(txt) : {};
        }

        function showNotification(m, t = 'success') {
            const n = document.getElementById('notification');
            n.querySelector('span').innerText = m;
            n.className = `notification ${t}`;
            n.style.display = 'flex';
            setTimeout(() => n.style.display = 'none', 4500);
        }

        function mostrarConfirmacion(mensaje, titulo, callback) {
            document.getElementById('confirm-mensaje').innerText = mensaje;
            document.getElementById('confirm-titulo').innerText = titulo || 'Confirmar acción';
            document.getElementById('modal-confirm').classList.add('active');
            window.confirmCallback = callback;
        }
        function cerrarModalConfirm(resultado) {
            document.getElementById('modal-confirm').classList.remove('active');
            if (window.confirmCallback && resultado) window.confirmCallback();
            window.confirmCallback = null;
        }

        function cerrarSesion() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // ===================== SESIÓN Y SIDEBAR =====================
        function verificarSesion() {
            const s = sessionStorage.getItem('currentUser');
            if (!s) { window.location.href = 'login.html'; return false; }
            currentUser = JSON.parse(s);
            // Mostrar datos en navbar
            document.getElementById('user-display').innerHTML = `
                <i class="fas fa-shield-haltered user-icon"></i>
                <div class="user-details">
                    <span class="user-name">${currentUser.nombres} ${currentUser.apellido_paterno} ${currentUser.apellido_materno || ''}</span>
                    <span class="user-role-badge">${currentUser.rol}</span>
                </div>`;
            return true;
        }

        function buildSidebar(role) {
            const allowed = ROLE_PERMISSIONS[role] || [];
            const sidebar = document.getElementById('sidebar-menu');
            sidebar.innerHTML = '<ul class="sidebar-menu">' +
                allowed.map(key => {
                    const item = MENU_ITEMS[key];
                    if (!item) return '';
                    const link = item.external
                        ? `<a href="${item.external}" class="external-link"><i class="fas ${item.icon}"></i> ${item.label} <i class="fas fa-external-link-alt"></i></a>`
                        : `<a href="#" data-panel="${key}"><i class="fas ${item.icon}"></i> ${item.label}</a>`;
                    return `<li>${link}</li>`;
                }).join('') +
                '</ul>';

            // Eventos de navegación interna
            sidebar.querySelectorAll('a[data-panel]').forEach(link => {
                link.addEventListener('click', e => {
                    e.preventDefault();
                    loadPanel(link.dataset.panel);
                });
            });
        }

        // ===================== CARGA DE PANELES (Client‑Side Include) =====================
        async function loadPanel(panelName) {
            const main = document.getElementById('main-panel');
            main.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Cargando panel...</div>';

            try {
                const response = await fetch(`panels/${panelName}.html`);
                if (!response.ok) throw new Error(`Panel "${panelName}" no encontrado`);
                const html = await response.text();
                main.innerHTML = html;

                // Marcar enlace activo en el sidebar
                document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
                const activeLink = document.querySelector(`.sidebar-menu a[data-panel="${panelName}"]`);
                if (activeLink) activeLink.classList.add('active');
            } catch (err) {
                main.innerHTML = `<div class="error"><i class="fas fa-exclamation-triangle"></i> ${err.message}</div>`;
            }
        }

        // ===================== INICIALIZACIÓN =====================
        window.addEventListener('DOMContentLoaded', () => {
            if (!verificarSesion()) return;
            const role = currentUser.rol;
            if (!ROLE_PERMISSIONS[role]) {
                showNotification('Rol no autorizado para este panel', 'error');
                cerrarSesion();
                return;
            }
            buildSidebar(role);
            // Cargar el primer panel permitido que no sea un enlace externo
            const firstPanel = ROLE_PERMISSIONS[role].find(p => !MENU_ITEMS[p]?.external) || 'inicio';
            loadPanel(firstPanel);
        });
    </script>
</body>
</html>
