<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexial Suite · Panel Directivo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
        }
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0 32px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #0066ff, #00c2ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(0, 102, 255, 0.6));
            animation: subtleGlow 3s ease-in-out infinite alternate;
        }
        @keyframes subtleGlow {
            0% {
                filter: drop-shadow(0 0 8px rgba(0, 102, 255, 0.4));
            }
            100% {
                filter: drop-shadow(0 0 18px rgba(0, 194, 255, 0.8));
            }
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #b0c4de);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
            color: white;
            padding: 8px 20px;
            border-radius: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.10);
            backdrop-filter: blur(8px);
            transition: 0.25s;
        }
        .user-info:hover {
            background: rgba(255,255,255,0.10);
            border-color: rgba(255,255,255,0.20);
        }
        .user-icon {
            font-size: 1.6rem;
            color: #0066ff;
            filter: drop-shadow(0 0 6px rgba(0,102,255,0.5));
        }
        .user-details {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }
        .user-name {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.2px;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .user-role-badge {
            font-size: 0.7rem;
            font-weight: 600;
            background: linear-gradient(135deg, #0066ff, #4da6ff);
            padding: 3px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            width: fit-content;
            margin-top: 4px;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,102,255,0.3);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 18px rgba(0, 150, 255, 0.3);
        }
        .btn-solid {
            background: #0066ff;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .btn-solid:hover {
            background: #0052cc;
            box-shadow: 0 0 18px rgba(0, 102, 255, 0.4);
        }
        .btn-icon {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .dashboard-container {
            margin-top: 72px;
            display: flex;
            min-height: calc(100vh - 72px);
        }
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #e2e8f0;
            padding: 32px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 72px;
            bottom: 0;
            overflow-y: auto;
        }
        .sidebar-menu {
            list-style: none;
            flex: 1;
        }
        .sidebar-menu li {
            padding: 0 24px;
            margin-bottom: 4px;
        }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-radius: 14px;
            color: #475569;
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
            transition: 0.2s;
        }
        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: #f1f5f9;
            color: #0066ff;
            font-weight: 600;
        }
        .sidebar-menu a i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
            background: #f8fafc;
        }
        .section-panel {
            display: none;
        }
        .section-panel.active {
            display: block;
        }
        /* PESTAÑAS (nuevo estilo) */
        .tabs-nav {
            display: flex;
            gap: 0;
            margin-bottom: 32px;
            border-bottom: 2px solid #e2e8f0;
            flex-wrap: wrap;
            overflow-x: auto;
        }
        .tab-btn {
            padding: 14px 24px;
            border: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }
        .tab-btn i {
            font-size: 1.1rem;
        }
        .tab-btn:hover {
            color: #334155;
            background: rgba(0,102,255,0.03);
        }
        .tab-btn.active {
            color: #0066ff;
            border-bottom-color: #0066ff;
            background: rgba(0,102,255,0.04);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            margin-bottom: 28px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
        }
        .filtros {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .filtros select,
        .filtros input,
        .filtros button {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1.5px solid #e2e8f0;
            font-family: 'Inter', sans-serif;
            background: white;
            font-size: 0.85rem;
        }
        .filtros button {
            background: #0066ff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .filtros button:hover {
            background: #0052cc;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }
        th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        tr:hover td {
            background: #f1f5f9;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .btn-sm {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-edit {
            background: #e0f2fe;
            color: #0369a1;
        }
        .btn-delete {
            background: #fee2e2;
            color: #991b1b;
        }
        .btn-activate {
            background: #dcfce7;
            color: #166534;
        }
        .btn-edit:hover {
            background: #bae6fd;
        }
        .btn-delete:hover {
            background: #fecaca;
        }
        .btn-activate:hover {
            background: #bbf7d0;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 18, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 32px;
            padding: 40px 36px;
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        .modal-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #64748b;
        }
        .form-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .form-col {
            flex: 1;
            min-width: 180px;
        }
        .form-group {
            margin-bottom: 4px;
            position: relative;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #0066ff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.08);
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 38px;
            cursor: pointer;
            color: #64748b;
            background: none;
            border: none;
            font-size: 1.1rem;
        }
        .notification {
            position: fixed;
            top: 24px;
            right: 32px;
            background: #1e293b;
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 500;
            z-index: 3000;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        .notification.error {
            background: #c2412c;
        }
        .notification.success {
            background: #2c6e49;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-success {
            background: #dcfce7;
            color: #166534;
        }
        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }
        .graficos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        @media (max-width: 900px) {
            .graficos-grid {
                grid-template-columns: 1fr;
            }
        }
        .grafico-box {
            background: #f8fafc;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            min-width: 300px;
        }
        .grafico-box h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 16px;
            text-align: center;
        }
        .file-upload-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        /* TOOLTIP PERSONALIZADO */
        .tooltip-trigger {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #cbd5e1;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: help;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .tooltip-trigger:hover {
            background: #0066ff;
            transform: scale(1.1);
        }
        .tooltip-trigger .tooltip-text {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: #f1f5f9;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 400;
            white-space: normal;
            width: 240px;
            text-align: left;
            line-height: 1.5;
            box-shadow: 0 12px 28px rgba(0,0,0,0.25);
            z-index: 5000;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            letter-spacing: 0.2px;
            text-transform: none;
        }
        .tooltip-trigger .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: #0f172a transparent transparent transparent;
        }
        .tooltip-trigger:hover .tooltip-text,
        .tooltip-trigger:focus .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        /* Ajuste para tooltips en modales (overflow) */
        .modal .tooltip-trigger .tooltip-text {
            position: fixed;
            bottom: auto;
            top: auto;
            left: auto;
            transform: none;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo-area">
            <i class="fas fa-brain logo-icon"></i>
            <span class="logo-text">Nexial Suite</span>
        </a>
        <div class="nav-actions">
            <div class="user-info" id="user-display"></div>
            <button class="btn-icon" onclick="recargarTodo()" title="Actualizar datos"><i class="fas fa-sync-alt"></i></button>
            <button class="btn-outline" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="#" data-panel="dashboard" class="active"><i class="fas fa-grid-2"></i> Inicio</a></li>
                <li><a href="#" data-panel="empresa"><i class="fas fa-building"></i> Mi Empresa</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <!-- PANEL INICIO -->
            <section id="panel-dashboard" class="section-panel active">
                <!-- PESTAÑAS -->
                <div class="tabs-nav" id="tabs-nav">
                    <button class="tab-btn active" data-tab="resumen"><i class="fas fa-chart-pie"></i> Resumen General</button>
                    <button class="tab-btn" data-tab="clientes"><i class="fas fa-building"></i> Clientes</button>
                    <button class="tab-btn" data-tab="productos"><i class="fas fa-box"></i> Productos</button>
                    <button class="tab-btn" data-tab="equipo"><i class="fas fa-users"></i> Equipo</button>
                </div>
                <div id="tab-resumen" class="tab-content active"></div>
                <div id="tab-clientes" class="tab-content"></div>
                <div id="tab-productos" class="tab-content"></div>
                <div id="tab-equipo" class="tab-content"></div>
            </section>

            <!-- PANEL EMPRESA -->
            <section id="panel-empresa" class="section-panel">
                <div class="card">
                    <div class="card-header">
                        <h2>Información de la Empresa</h2>
                        <button class="btn-solid" id="btn-editar-empresa" onclick="habilitarEdicionEmpresa()"><i class="fas fa-pen-to-square"></i> Editar</button>
                    </div>
                    <form id="form-empresa">
                        <div class="form-row">
                            <div class="form-col"><div class="form-group"><label>Razón Social *</label><input id="emp-razon" disabled required style="text-transform:uppercase;" oninput="this.value = this.value.toUpperCase()"></div></div>
                            <div class="form-col"><div class="form-group"><label>Nombre Comercial *</label><input id="emp-nombre" disabled required style="text-transform:uppercase;" oninput="this.value = this.value.toUpperCase()"></div></div>
                        </div>
                        <div class="form-row">
                            <div class="form-col"><div class="form-group"><label>NIT *</label><input id="emp-nit" disabled required></div></div>
                            <div class="form-col"><div class="form-group"><label>Moneda Principal *</label><input id="emp-moneda-input" list="monedas-global-list" autocomplete="off" disabled required><datalist id="monedas-global-list"></datalist></div></div>
                        </div>
                        <div class="form-row">
                            <div class="form-col"><div class="form-group"><label>País</label><input id="emp-pais" list="paises-list-emp" autocomplete="off" disabled><datalist id="paises-list-emp"></datalist></div></div>
                            <div class="form-col"><div class="form-group"><label>Estado</label><input id="emp-estado" list="emp-estados-list" autocomplete="off" disabled><datalist id="emp-estados-list"></datalist></div></div>
                            <div class="form-col"><div class="form-group"><label>Ciudad</label><input id="emp-ciudad" list="emp-ciudades-list" autocomplete="off" disabled><datalist id="emp-ciudades-list"></datalist></div></div>
                        </div>
                        <div class="form-row">
                            <div class="form-col"><div class="form-group"><label>Dirección</label><input id="emp-direccion" disabled></div></div>
                            <div class="form-col"><div class="form-group"><label>Teléfono</label><input id="emp-telefono" disabled></div></div>
                            <div class="form-col"><div class="form-group"><label>Email Corporativo</label><input id="emp-email" type="email" disabled></div></div>
                        </div>
                        <div class="form-row">
                            <div class="form-col"><div class="form-group"><label>Logotipo</label><div class="file-upload-area"><input type="file" id="file-logotipo" accept="image/*" disabled><span id="logotipo-preview"></span></div></div></div>
                            <div class="form-col"><div class="form-group"><label>Imagen corporativa</label><div class="file-upload-area"><input type="file" id="file-imagen" accept="image/*" disabled><span id="imagen-preview"></span></div></div></div>
                        </div>
                        <div id="botones-edicion-empresa" style="display:none; gap:12px;">
                            <button type="button" class="btn-outline" style="color:#1e293b; border-color:#cbd5e1;" onclick="cancelarEdicionEmpresa()">Cancelar</button>
                            <button type="submit" class="btn-solid"><i class="fas fa-save"></i> Guardar</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL USUARIO -->
    <div class="modal-overlay" id="modal-usuario">
        <div class="modal">
            <div class="modal-header">
                <h2 id="titulo-modal-usuario">Nuevo Usuario</h2>
                <button class="close-modal" onclick="cerrarModalUsuario()">&times;</button>
            </div>
            <form id="form-usuario">
                <input type="hidden" id="usuario-id"><input type="hidden" id="empleado-id">
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Nombres *</label><input id="usr-nombres" required oninput="this.value = this.value.replace(/\b\w/g, c => c.toUpperCase())"></div></div>
                    <div class="form-col"><div class="form-group"><label>Apellido Paterno *</label><input id="usr-ap" required oninput="this.value = this.value.replace(/\b\w/g, c => c.toUpperCase())"></div></div>
                    <div class="form-col"><div class="form-group"><label>Apellido Materno</label><input id="usr-am" oninput="this.value = this.value.replace(/\b\w/g, c => c.toUpperCase())"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Email *</label><input id="usr-email" type="email" required></div></div>

    <script>
        const SUPABASE_URL = 'https://zgzwhyywkervutpvazqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aE2X3gv4CE110VzI4uoT-Q_yo4Xv6Zb';
        const STORAGE_BUCKET = 'empresas';
        const GEO_API_BASE = 'https://city-state-country.vercel.app';
        let currentUser = null,
            empresaActual = null,
            empresaOriginal = {};
        let paisesData = [],
            todasLasMonedas = [];
        let chartVentasVendedores = null,
            chartEntregasAlmacen = null,
            chartProductos = null;

        const rolesDisponibles = ['Director General', 'Director Financiero', 'Supervisor Senior', 'Ejecutivo Comercial',

        function verificarSesion() {
            const s = sessionStorage.getItem('currentUser');
            if (!s) { window.location.href = 'login.html'; return; }
            currentUser = JSON.parse(s);
            document.getElementById('user-display').innerHTML = `
                <i class="fas fa-shield-haltered user-icon"></i>
                <div class="user-details">
                    <span class="user-name">${currentUser.nombres} ${currentUser.apellido_paterno} ${currentUser.apellido_materno || ''}</span>
                    <span class="user-role-badge">${currentUser.rol}</span>
                </div>`;
        }

        function cerrarSesion() { sessionStorage.removeItem('currentUser');
            window.location.href = 'index.html'; }

        function showNotification(m, t = 'success') {
            const n = document.getElementById('notification');
            n.querySelector('span').innerText = m;
            n.className = `notification ${t}`;
            n.style.display = 'flex';
            setTimeout(() => n.style.display = 'none', 4500);
        }
        async function apiFetch(endpoint, method = 'GET', body = null) {
            const headers = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };
            if (method === 'POST' || method === 'PATCH') headers['Prefer'] = 'return=representation';
            const opts = { method, headers };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, opts);
            if (!res.ok) { const e = await res.text(); throw new Error(e); }
            const txt = await res.text();
            return txt ? JSON.parse(txt) : {};
        }
        async function uploadFile(file, folder) {
            const name = `${folder}/${Date.now()}-${file.name}`;
            const fd = new FormData();
            fd.append('', file);
            const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${name}`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                body: fd
            });
            if (!res.ok) throw new Error('Error al subir');
            return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${name}`;
        }

        async function cargarDatosIniciales() {
            const resp = await fetch('https://restcountries.com/v3.1/all?fields=name,cca2,idd,currencies');
            paisesData = await resp.json();
            ['paises-list-emp', 'usr-paises-list'].forEach(id => {
                const dl = document.getElementById(id);
                if (!dl) return;
                dl.innerHTML = '';
                paisesData.forEach(p => { const o = document.createElement('option');
                    o.value = p.name.common;
                    dl.appendChild(o); });
            });
            const monSet = new Map();
            paisesData.forEach(p => { if (p.currencies) Object.entries(p.currencies).forEach(([c, i]) => { if (!monSet.has(
                        c)) monSet.set(c, { name: i.name, symbol: i.symbol || '' }); }); });
            todasLasMonedas = Array.from(monSet, ([c, d]) => ({ codigo: c, nombre: d.name, simbolo: d.symbol }));
            ['monedas-global-list', 'monedas-global-list-emp', 'monedas-global-list-prod'].forEach(id => {
                const dl = document.getElementById(id);
                if (!dl) return;
                dl.innerHTML = '';
                todasLasMonedas.forEach(m => { const o = document.createElement('option');
                    o.value = `${m.codigo} - ${m.nombre}`;
                    dl.appendChild(o); });
            });
            if (currentUser && currentUser.empresa_id) {
                const emp = await apiFetch(`empresas?id=eq.${currentUser.empresa_id}&select=moneda_principal_id`);
                if (emp.length > 0 && emp[0].moneda_principal_id) {
                    const mon = await apiFetch(`monedas?id=eq.${emp[0].moneda_principal_id}&select=codigo`);
                    if (mon.length > 0) empresaMonedaCodigo = mon[0].codigo;
                }
            }
        }

        function extraerCodigo(v) { return (v.split(' - ')[0] || '').trim().toUpperCase(); }
        async function ensureCurrency(input) {
            const cod = extraerCodigo(input);
            if (!cod) throw new Error('Moneda inválida');
            const exist = await apiFetch(`monedas?codigo=eq.${cod}&select=id`);
            if (exist.length) return exist[0].id;
            const data = todasLasMonedas.find(m => m.codigo === cod) || { nombre: cod, symbol: null };
            const nueva = await apiFetch('monedas', 'POST', { codigo: cod, nombre: data.nombre, simbolo: data.symbol });
            return Array.isArray(nueva) ? nueva[0].id : nueva.id;
        }

                const d = await r.json();
                return d.length ? d[0].id : null;
            } catch { return null; }

        function obtenerRangoFechas(periodo) {
            const hoy = new Date();
            let desde, hasta;
            if (periodo === 'hoy') {
                desde = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
                hasta = new Date(desde.getTime() + 86400000 - 1);
            } else if (periodo === 'semana') {
                const dia = hoy.getDay();
                desde = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - dia);
                hasta = new Date(desde.getTime() + 7 * 86400000 - 1);
            } else if (periodo === 'mes') {
                desde = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
                hasta = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0, 23, 59, 59);
            } else if (periodo === 'año') {
                desde = new Date(hoy.getFullYear(), 0, 1);
                hasta = new Date(hoy.getFullYear(), 11, 31, 23, 59, 59);
            }
            return { desde: desde.toISOString(), hasta: hasta.toISOString() };
        }

        async function cargarProductos(categoria = '') {
            const empId = currentUser.empresa_id;
            let query = `productos?empresa_id=eq.${empId}&select=*`;
            if (categoria) query += `&categoria=eq.${encodeURIComponent(categoria)}`;
            const productos = await apiFetch(query);
            const ventas = await apiFetch(`ventas?empresa_id=eq.${empId}&select=producto_id,total_linea,cantidad`);
            const ventasPorProd = {};
            ventas.forEach(v => { if (!ventasPorProd[v.producto_id]) ventasPorProd[v.producto_id] = { cantidad: 0,
                    total: 0 };
                ventasPorProd[v.producto_id].cantidad += v.cantidad;
                ventasPorProd[v.producto_id].total += parseFloat(v.total_linea); });
            let filas = '';
            const prodLabels = [],
                prodData = [];
            productos.forEach(p => {
                const v = ventasPorProd[p.id] || { cantidad: 0, total: 0 };
                prodLabels.push(p.nombre);
                prodData.push(v.cantidad);
                filas += `<tr>
                    <td>${p.sku}</td><td>${p.nombre}</td><td>${p.categoria||'-'}</td><td>$${p.precio_venta_base||0}</td><td>${v.cantidad}</td><td>$${v.total.toFixed(2)}</td>
                    <td class="action-buttons">
                        <button class="btn-sm btn-edit" onclick="editarProducto('${p.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-sm btn-delete" onclick="eliminarProducto('${p.id}')"><i class="fas fa-trash"></i></button>
                    </td></tr>`;
            });
            const categorias = [...new Set(productos.map(p => p.categoria).filter(Boolean))];
            const html = `
                <div class="card">
                    <div class="card-header">
                        <h2>Productos</h2>
                        <button class="btn-solid" onclick="abrirModalProducto()"><i class="fas fa-plus"></i> Nuevo Producto</button>
                    </div>
                    <div class="filtros">
                        <select id="filtro-categoria-productos" onchange="cargarProductos(this.value)"><option value="">Todas las categorías</option></select>
                    </div>
                    <div style="display:flex; gap:40px; flex-wrap:wrap;">
                        <div style="flex:2;" class="table-wrapper"><table><thead><tr><th>SKU</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Vendidos</th><th>Total</th><th>Acciones</th></tr></thead><tbody>${filas}</tbody></table></div>
                        <div style="flex:1; min-width:300px;"><canvas id="chart-productos"></canvas></div>
                    </div>
                </div>`;
            document.getElementById('tab-productos').innerHTML = html;
            const selCat = document.getElementById('filtro-categoria-productos');
            selCat.innerHTML = '<option value="">Todas las categorías</option>';
            categorias.forEach(c => { const o = document.createElement('option');
                o.value = c;
                o.text = c; if (c === categoria) o.selected = true;
                selCat.appendChild(o); });
            if (chartProductos) chartProductos.destroy();
            const ctx = document.getElementById('chart-productos')?.getContext('2d');
            if (ctx) {
                chartProductos = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: prodLabels, datasets: [{ label: 'Unidades vendidas', data: prodData,
                            backgroundColor: 'rgba(0,102,255,0.2)' }] },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });
            }
        }

                } else {
                    await apiFetch(`usuarios?id=eq.${userId}`, 'PATCH', payloadUsuario);
                    if (empleadoId) await apiFetch(`empleados?id=eq.${empleadoId}`, 'PATCH', payloadEmpleado);
                    else { payloadEmpleado.empresa_id = currentUser.empresa_id;
                        await apiFetch('empleados', 'POST', payloadEmpleado); }
                }
                cerrarModalUsuario();
                cargarEquipo(document.getElementById('filtro-rol-usuarios')?.value || '');
                showNotification(userId ? 'Usuario actualizado' : 'Usuario creado');
            } catch (err) { showNotification('Error: ' + err.message, 'error'); }
        });

        function actualizarExtensionUsuario(pais) {
            const p = paisesData.find(x => x.name.common.toLowerCase() === pais.toLowerCase());
            if (p && p.idd) document.getElementById('usr-extension').value = (p.idd.root || '') + (p.idd.suffixes?.[0] ||
                '');
        }

        async function cargarFormularioEmpresa() {
            if (!empresaActual) { const emp = await apiFetch(`empresas?id=eq.${currentUser.empresa_id}&select=*`);
                empresaActual = emp[0]; }
            empresaOriginal = { ...empresaActual };
            document.getElementById('emp-razon').value = empresaActual.razon_social || '';
            document.getElementById('emp-nombre').value = empresaActual.nombre_comercial || '';
            document.getElementById('emp-nit').value = empresaActual.nit || '';
            if (empresaActual.moneda_principal_id) {
                const mon = await apiFetch(`monedas?id=eq.${empresaActual.moneda_principal_id}&select=codigo,nombre`);
                if (mon.length) document.getElementById('emp-moneda-input').value = `${mon[0].codigo} - ${mon[0].nombre}`;
            }
            document.getElementById('emp-pais').value = empresaActual.pais || '';
            document.getElementById('emp-estado').value = empresaActual.estado_provincia || '';
            document.getElementById('emp-ciudad').value = empresaActual.ciudad || '';
            document.getElementById('emp-direccion').value = empresaActual.direccion || '';
            document.getElementById('emp-telefono').value = empresaActual.telefono || '';
            document.getElementById('emp-email').value = empresaActual.email || '';
            deshabilitarEdicionEmpresa();
        }
        function habilitarEdicionEmpresa() {
            document.querySelectorAll('#form-empresa input:not([type=file])').forEach(c => c.disabled = false);
            document.getElementById('file-logotipo').disabled = false;
            document.getElementById('file-imagen').disabled = false;
            document.getElementById('btn-editar-empresa').style.display = 'none';
            document.getElementById('botones-edicion-empresa').style.display = 'flex';
        }
        function deshabilitarEdicionEmpresa() {
            document.querySelectorAll('#form-empresa input:not([type=file])').forEach(c => c.disabled = true);
            document.getElementById('file-logotipo').disabled = true;
            document.getElementById('file-imagen').disabled = true;
            document.getElementById('btn-editar-empresa').style.display = 'inline-flex';
            document.getElementById('botones-edicion-empresa').style.display = 'none';
        }
        function cancelarEdicionEmpresa() {
            document.getElementById('emp-razon').value = empresaOriginal.razon_social || '';
            document.getElementById('emp-nombre').value = empresaOriginal.nombre_comercial || '';
            document.getElementById('emp-nit').value = empresaOriginal.nit || '';
            if (empresaOriginal.moneda_principal_id) apiFetch(
                `monedas?id=eq.${empresaOriginal.moneda_principal_id}&select=codigo,nombre`).then(m => { if (m
                    .length) document.getElementById('emp-moneda-input').value =
                    `${m[0].codigo} - ${m[0].nombre}`; });
            document.getElementById('emp-pais').value = empresaOriginal.pais || '';
            document.getElementById('emp-estado').value = empresaOriginal.estado_provincia || '';
            document.getElementById('emp-ciudad').value = empresaOriginal.ciudad || '';
            document.getElementById('emp-direccion').value = empresaOriginal.direccion || '';
            document.getElementById('emp-telefono').value = empresaOriginal.telefono || '';
            document.getElementById('emp-email').value = empresaOriginal.email || '';
            deshabilitarEdicionEmpresa();
        }
        document.getElementById('form-empresa').addEventListener('submit', async function(e) {
            e.preventDefault();
            const monInput = document.getElementById('emp-moneda-input').value.trim();
            let monId;
            try { monId = await ensureCurrency(monInput); } catch { showNotification('Moneda inválida',
                'error'); return; }
            const payload = {
                razon_social: document.getElementById('emp-razon').value.trim(),
                nombre_comercial: document.getElementById('emp-nombre').value.trim(),
                nit: document.getElementById('emp-nit').value.trim(),
                moneda_principal_id: monId,
                pais: document.getElementById('emp-pais').value.trim() || null,
                estado_provincia: document.getElementById('emp-estado').value.trim() || null,
                ciudad: document.getElementById('emp-ciudad').value.trim() || null,
                direccion: document.getElementById('emp-direccion').value.trim() || null,
                telefono: document.getElementById('emp-telefono').value.trim() || null,
                email: document.getElementById('emp-email').value.trim() || null
            };
            try {
                const fLogo = document.getElementById('file-logotipo').files[0];
                if (fLogo) payload.logotipo = await uploadFile(fLogo, 'logos');
                const fImg = document.getElementById('file-imagen').files[0];
                if (fImg) payload.imagen = await uploadFile(fImg, 'imagenes');
                await apiFetch(`empresas?id=eq.${currentUser.empresa_id}`, 'PATCH', payload);
                empresaActual = { ...empresaActual, ...payload };
                empresaOriginal = { ...empresaActual };
                showNotification('Empresa actualizada');
                deshabilitarEdicionEmpresa();
            } catch (err) { showNotification('Error: ' + err.message, 'error'); }
        });

        window.onload = async function() {
            verificarSesion();
            if (currentUser) {
                await cargarDatosIniciales();
                llenarRolesSelect();
                cargarDashboard();
            }
        };
    </script>
</body>
</html>
