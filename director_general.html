<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexial Suite · Panel Directivo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    <!-- Tema Nexial Suite -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET Y BASE ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        html { overscroll-behavior: none; }
        body {
            font-family:'Inter', -apple-system, sans-serif;
            background:#f4f6fb;
            color:#1a1f36;
            touch-action:manipulation;
            -webkit-tap-highlight-color:transparent;
        }

        /* ===== HEADER Y LOGO ===== */
        .app-header {
            position:fixed; top:0; left:0; width:100%; height:80px;
            background:rgba(10,15,30,0.96); backdrop-filter:blur(14px);
            z-index:1000; display:flex; align-items:center; justify-content:space-between;
            padding:0 32px; border-bottom:1px solid rgba(255,255,255,0.08);
        }
        .header-brand { display:flex; align-items:center; gap:12px; text-decoration:none; }
        .app-logo {
            font-size:2.5rem;
            background:linear-gradient(135deg,#1a56db,#00a3ff);
            -webkit-background-clip:text; background-clip:text;
            -webkit-text-fill-color:transparent;
            filter:drop-shadow(0 0 14px rgba(26,86,219,0.7));
        }
        .brand-name {
            color:white; font-weight:900; font-size:1.5rem; letter-spacing:-0.5px;
            text-shadow: 0 0 20px rgba(0,163,255,0.5);
        }
        .header-actions { display:flex; align-items:center; gap:20px; }

        /* ===== BOTONES ===== */
        .btn-outline {
            background:transparent; border:1.5px solid rgba(255,255,255,0.35); color:white;
            padding:10px 24px; border-radius:40px;
            font-weight:600; font-size:0.9rem; cursor:pointer;
            transition:0.25s; display:inline-flex; align-items:center; gap:8px;
            font-family:'Inter',sans-serif;
        }
        .btn-outline:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.7); box-shadow:0 0 18px rgba(0,150,255,0.3); }
        .btn-icon {
            background:rgba(255,255,255,0.1); border:none; color:white;
            width:40px; height:40px; border-radius:50%; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            font-size:1.2rem; transition:0.2s;
        }
        .btn-icon:hover { background:rgba(255,255,255,0.2); }

        .user-info {
            display:flex; align-items:center; gap:14px; color:white;
            padding:8px 20px; border-radius:14px; background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.10); backdrop-filter:blur(8px); transition:0.25s;
        }
        .user-info:hover { background:rgba(255,255,255,0.10); border-color:rgba(255,255,255,0.20); }
        .user-icon { font-size:1.6rem; color:#1a56db; filter:drop-shadow(0 0 6px rgba(26,86,219,0.5)); }
        .user-details { display:flex; flex-direction:column; line-height:1.3; }
        .user-name { font-weight:700; font-size:1.1rem; letter-spacing:0.2px; color:#ffffff; }
        .user-role-badge {
            font-size:0.7rem; font-weight:600; background:linear-gradient(135deg,#1a56db,#4da6ff);
            padding:3px 12px; border-radius:20px; text-transform:uppercase; letter-spacing:0.8px;
            width:fit-content; margin-top:4px; color:#fff; box-shadow:0 2px 8px rgba(26,86,219,0.3);
        }

        /* ===== LAYOUT ===== */
        .dashboard-container { display:flex; min-height:100vh; padding-top:80px; }
        .sidebar {
            width:260px; background:white; border-right:1px solid #e2e8f0;
            padding:32px 0; position:fixed; top:80px; bottom:0;
            overflow-y:auto; z-index:500;
        }
        .sidebar-menu { list-style:none; }
        .sidebar-menu li { padding:0 24px; margin-bottom:4px; }
        .sidebar-menu a {
            display:flex; align-items:center; gap:14px; padding:14px 20px;
            border-radius:14px; color:#475569; font-weight:500;
            font-size:0.95rem; text-decoration:none; transition:0.2s;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background:#f1f5f9; color:#1a56db; font-weight:600;
        }
        .sidebar-menu a i { font-size:1.2rem; width:24px; text-align:center; }

        .main-content {
            margin-left:260px; flex:1; padding:32px; background:#f4f6fb;
        }
        .section-panel { display:none; }
        .section-panel.active { display:block; }

        .tabs-nav {
            display:flex; gap:0; margin-bottom:28px;
            border-bottom:2px solid #e2e8f0; flex-wrap:wrap; overflow-x:auto;
        }
        .tab-btn {
            padding:14px 24px; border:none; background:transparent;
            font-family:'Inter',sans-serif; font-size:0.95rem; font-weight:600;
            color:#64748b; cursor:pointer; transition:0.2s; white-space:nowrap;
            position:relative; display:inline-flex; align-items:center; gap:10px;
            border-bottom:3px solid transparent; margin-bottom:-2px;
        }
        .tab-btn:hover { color:#334155; background:rgba(26,86,219,0.03); }
        .tab-btn.active { color:#1a56db; border-bottom-color:#1a56db; background:rgba(26,86,219,0.04); }
        .tab-content { display:none; }
        .tab-content.active { display:block; }

        .notification {
            position:fixed; top:16px; right:16px;
            background:#1a1f36; color:white; padding:12px 20px;
            border-radius:40px; font-weight:500; z-index:3000;
            font-size:0.85rem; display:none; align-items:center; gap:8px;
        }
        .notification.error { background:#c2412c; }
        .notification.success { background:#2c6e49; }
    </style>
</head>
<body>

<header class="app-header">
    <a href="index.html" class="header-brand">
        <i class="fas fa-brain app-logo"></i>
        <span class="brand-name">Nexial Suite</span>
    </a>
    <div class="header-actions">
        <div class="user-info" id="user-display"></div>
        <button class="btn-icon" onclick="recargarTodo()" title="Actualizar datos"><i class="fas fa-sync-alt"></i></button>
        <button class="btn-outline" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
    </div>
</header>

<div class="dashboard-container">
    <aside class="sidebar">
        <ul class="sidebar-menu">
            <li><a href="#" data-panel="dashboard" class="active"><i class="fas fa-grid-2"></i> Inicio</a></li>
            <li><a href="#" data-panel="empresa"><i class="fas fa-building"></i> Mi Empresa</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <!-- PANEL INICIO (Dashboard con pestañas) -->
        <section id="panel-dashboard" class="section-panel active">
            <div class="tabs-nav" id="tabs-nav">
                <button class="tab-btn active" data-tab="resumen"><i class="fas fa-chart-pie"></i> Resumen</button>
                <button class="tab-btn" data-tab="clientes"><i class="fas fa-users"></i> Clientes</button>
                <button class="tab-btn" data-tab="productos"><i class="fas fa-box"></i> Productos</button>
                <button class="tab-btn" data-tab="equipo"><i class="fas fa-user-tie"></i> Equipo</button>
                <button class="tab-btn" data-tab="proveedores"><i class="fas fa-truck"></i> Proveedores</button>
                <button class="tab-btn" data-tab="almacenes"><i class="fas fa-warehouse"></i> Almacenes</button>
                <button class="tab-btn" data-tab="inventario"><i class="fas fa-pallet"></i> Inventario</button>
                <button class="tab-btn" data-tab="ventas"><i class="fas fa-receipt"></i> Ventas</button>
                <button class="tab-btn" data-tab="compras"><i class="fas fa-shopping-cart"></i> Compras</button>
            </div>
            <!-- Los contenidos se cargarán dinámicamente desde la carpeta modulos/ -->
            <div id="tab-resumen" class="tab-content active"></div>
            <div id="tab-clientes" class="tab-content"></div>
            <div id="tab-productos" class="tab-content"></div>
            <div id="tab-equipo" class="tab-content"></div>
            <div id="tab-proveedores" class="tab-content"></div>
            <div id="tab-almacenes" class="tab-content"></div>
            <div id="tab-inventario" class="tab-content"></div>
            <div id="tab-ventas" class="tab-content"></div>
            <div id="tab-compras" class="tab-content"></div>
        </section>

        <!-- PANEL MI EMPRESA -->
        <section id="panel-empresa" class="section-panel">
            <div id="panel-empresa-contenido"></div>
        </section>
    </main>
</div>

<div id="notification" class="notification"><i class="fas fa-circle-info"></i><span></span></div>

<script>
    // --- Configuración ---
    const SUPABASE_URL = 'https://zgzwhyywkervutpvazqp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_aE2X3gv4CE110VzI4uoT-Q_yo4Xv6Zb';
    let currentUser = null;

    // Mapeo de pestañas a archivos de módulo
    const moduloArchivo = {
        resumen: 'resumen.html',
        clientes: 'clientes.html',
        productos: 'productos.html',
        equipo: 'equipo.html',
        proveedores: 'proveedores.html',
        almacenes: 'almacenes.html',
        inventario: 'inventario.html',
        ventas: 'ventas.html',
        compras: 'compras.html'
    };

    // --- Sesión ---
    function verificarSesion() {
        const s = sessionStorage.getItem('currentUser');
        if (!s) { window.location.href = 'login.html'; return; }
        currentUser = JSON.parse(s);
        document.getElementById('user-display').innerHTML = `
            <i class="fas fa-shield-haltered user-icon"></i>
            <div class="user-details">
                <span class="user-name">${currentUser.nombres} ${currentUser.apellido_paterno} ${currentUser.apellido_materno || ''}</span>
                <span class="user-role-badge">${currentUser.rol}</span>
            </div>`;
    }
    function cerrarSesion() { sessionStorage.removeItem('currentUser'); window.location.href = 'index.html'; }

    // --- Carga dinámica de módulos ---
    async function cargarModulo(tab) {
        const contenedorId = 'tab-' + tab;
        const contenedor = document.getElementById(contenedorId);
        if (!contenedor) return;

        // Si ya tiene contenido, no recargar (opcional)
        if (contenedor.innerHTML.trim() !== '') return;

        try {
            const respuesta = await fetch('modulos/' + moduloArchivo[tab]);
            if (!respuesta.ok) throw new Error('No se pudo cargar el módulo');
            let html = await respuesta.text();

            contenedor.innerHTML = html;

            // Ejecutar scripts que vengan dentro del HTML (porque innerHTML no los ejecuta)
            const scripts = contenedor.querySelectorAll('script');
            scripts.forEach(script => {
                const nuevoScript = document.createElement('script');
                // Copiar atributos
                Array.from(script.attributes).forEach(attr => {
                    nuevoScript.setAttribute(attr.name, attr.value);
                });
                nuevoScript.textContent = script.textContent;
                script.replaceWith(nuevoScript);
            });
        } catch (error) {
            contenedor.innerHTML = `<p class="error">Error al cargar el módulo: ${error.message}</p>`;
        }
    }

    // --- Navegación por pestañas ---
    document.getElementById('tabs-nav').addEventListener('click', function(e) {
        const btn = e.target.closest('.tab-btn');
        if (!btn) return;

        document.querySelectorAll('#tabs-nav .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        const tabId = 'tab-' + btn.dataset.tab;
        const contenedor = document.getElementById(tabId);
        contenedor.classList.add('active');

        cargarModulo(btn.dataset.tab);
    });

    // Navegación del sidebar
    document.querySelectorAll('.sidebar-menu a').forEach(a => a.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelectorAll('.sidebar-menu a').forEach(l => l.classList.remove('active'));
        this.classList.add('active');

        document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`panel-${this.dataset.panel}`).classList.add('active');

        if (this.dataset.panel === 'dashboard') {
            // Cargar la pestaña activa por defecto
            const tabActivo = document.querySelector('#tabs-nav .tab-btn.active')?.dataset.tab;
            if (tabActivo) cargarModulo(tabActivo);
        } else if (this.dataset.panel === 'empresa') {
            cargarModuloEmpresa();
        }
    }));

    function cargarModuloEmpresa() {
        // Si quieres que "Mi Empresa" también sea un fragmento externo
        const contenedor = document.getElementById('panel-empresa-contenido');
        if (contenedor.innerHTML.trim() !== '') return;
        fetch('modulos/empresa.html')
            .then(res => res.text())
            .then(html => {
                contenedor.innerHTML = html;
                // Ejecutar scripts
                const scripts = contenedor.querySelectorAll('script');
                scripts.forEach(s => {
                    const ns = document.createElement('script');
                    ns.textContent = s.textContent;
                    s.replaceWith(ns);
                });
            });
    }

    function recargarTodo() {
        const tab = document.querySelector('#tabs-nav .tab-btn.active')?.dataset.tab;
        if (tab) {
            const contenedor = document.getElementById('tab-' + tab);
            contenedor.innerHTML = ''; // fuerza recarga
            cargarModulo(tab);
        }
    }

    // Notificación global
    function showNotification(m, t = 'success') {
        const n = document.getElementById('notification');
        n.querySelector('span').innerText = m;
        n.className = `notification ${t}`;
        n.style.display = 'flex';
        setTimeout(() => n.style.display = 'none', 4500);
    }

    // --- Inicio ---
    verificarSesion();
    // Cargar la primera pestaña activa al abrir
    window.addEventListener('load', () => {
        cargarModulo('resumen');
    });
</script>
</body>
</html>
