    <style>
        /* ======== ESTILOS EXACTAMENTE IGUALES A TU ORIGINAL ======== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background:#f4f6fb; color:#1a1f36; line-height:1.6; touch-action:manipulation; }
        .navbar { position:fixed; top:0; width:100%; background:rgba(10,15,30,0.94); backdrop-filter:blur(14px); z-index:1000; border-bottom:1px solid rgba(255,255,255,0.05); padding:0 32px; height:72px; display:flex; align-items:center; justify-content:space-between; }

        .logo-icon { font-size:2.2rem; background:linear-gradient(135deg,#1a56db,#00a3ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 12px rgba(26,86,219,0.6)); animation:subtleGlow 3s ease-in-out infinite alternate; }

        .logo-text { font-size:1.5rem; font-weight:700; background:linear-gradient(to right,#ffffff,#c0d0f0); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .nav-actions { display:flex; align-items:center; gap:20px; }
        .user-info { display:flex; align-items:center; gap:14px; color:white; padding:8px 20px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(8px); transition:0.25s; }
        .user-info:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.18); }
        .user-icon { font-size:1.6rem; color:#1a56db; filter:drop-shadow(0 0 6px rgba(26,86,219,0.5)); }
        .user-details { display:flex; flex-direction:column; line-height:1.3; }
        .user-name { font-weight:700; font-size:1.15rem; letter-spacing:0.2px; color:#fff; }
        .user-role-badge { font-size:0.7rem; font-weight:600; background:linear-gradient(135deg,#1a56db,#4a8eff); padding:3px 12px; border-radius:20px; text-transform:uppercase; letter-spacing:0.8px; width:fit-content; margin-top:4px; color:#fff; box-shadow:0 2px 8px rgba(26,86,219,0.3); }
        .btn-outline { background:transparent; border:1.5px solid rgba(255,255,255,0.35); color:white; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; transition:0.25s; display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; }
        .btn-outline:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.7); box-shadow:0 0 18px rgba(0,150,255,0.3); }
        .btn-solid { background:#1a56db; border:none; color:white; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; transition:0.25s; display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; }
        .btn-solid:hover { background:#1340a0; box-shadow:0 0 18px rgba(26,86,219,0.5); }
        .btn-icon { background:rgba(255,255,255,0.1); border:none; color:white; width:40px; height:40px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.2rem; transition:0.2s; }
        .btn-icon:hover { background:rgba(255,255,255,0.2); }
        .dashboard-container { margin-top:72px; display:flex; min-height:calc(100vh - 72px); }
        .sidebar { width:260px; background:white; border-right:1px solid #e5e7eb; padding:20px 0; display:flex; flex-direction:column; position:fixed; top:72px; bottom:0; overflow-y:auto; z-index:900; }
        .sidebar-menu { list-style:none; flex:1; }
        .sidebar-menu li { padding:0 16px; margin-bottom:2px; }
        .sidebar-menu a { display:flex; align-items:center; gap:12px; padding:12px 18px; border-radius:12px; color:#475569; font-weight:500; font-size:0.9rem; text-decoration:none; transition:0.2s; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background:#f1f5f9; color:#1a56db; font-weight:600; }
        .sidebar-menu a i { font-size:1.1rem; width:22px; text-align:center; }
        .sidebar-menu a.external-link i.fa-external-link-alt { font-size:0.7rem; margin-left:auto; opacity:0.5; }
        .main-content { margin-left:260px; flex:1; padding:32px; background:#f4f6fb; }
        .section-panel { display:none; }
        .section-panel.active { display:block; }

<body>

    <script>
        // ==================== CONFIGURACIÓN Y VARIABLES GLOBALES (EXACTAMENTE IGUAL) ====================
        const SUPABASE_URL = 'https://zgzwhyywkervutpvazqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aE2X3gv4CE110VzI4uoT-Q_yo4Xv6Zb';
        const STORAGE_BUCKET = 'empresas';
        const GEO_API_BASE = 'https://city-state-country.vercel.app';
        let currentUser = null, empresaMonedaCodigo = 'USD', empresaPais = '';
        let paisesData = [], todasLasMonedas = [];
        let chartVentas = null, chartProductos = null;
        let ventasDataCache = [], productosMapCache = {};
        let currentDesde = null, currentHasta = null;
        let confirmCallback = null;
        let productosVentasCache = [], productosChartDesde = null, productosChartHasta = null;
        let soloUnDiaActivo = true;

        // ==================== PERMISOS POR ROL (NUEVO) ====================
        const ROLE_PERMISSIONS = {
            'Director Corporativo': ['inicio', 'equipo', 'metas', 'distribucion', 'clientes', 'productos', 'rutas', 'carga', 'admin'],
            'Director General':    ['inicio', 'equipo', 'metas', 'distribucion', 'clientes', 'productos', 'rutas', 'carga'],
            'Director Financiero': ['inicio', 'equipo', 'metas', 'distribucion', 'clientes', 'productos'],
            'Supervisor Senior':  ['inicio', 'equipo', 'metas', 'distribucion', 'clientes', 'productos', 'rutas', 'carga'],
            'Ejecutivo Comercial': ['inicio', 'clientes', 'productos', 'mis_metas'],
            'Especialista Logístico': ['inicio', 'distribucion', 'clientes', 'productos', 'rutas', 'carga'],
            'Gestor de Almacén':   ['inicio', 'productos', 'distribucion', 'inventario']
        };

        const MENU_ITEMS = {
            inicio:        { icon: 'fa-home',       label: 'Inicio' },
            equipo:        { icon: 'fa-users',      label: 'Equipo' },
            metas:         { icon: 'fa-bullseye',   label: 'Metas' },
            distribucion:  { icon: 'fa-boxes',      label: 'Distribución' },
            clientes:      { icon: 'fa-building',   label: 'Clientes' },
            productos:     { icon: 'fa-box',        label: 'Productos' },
            rutas:         { icon: 'fa-route',      label: 'Asignación de rutas', external: 'asignacion_rutas.html' },
            carga:         { icon: 'fa-truck-loading', label: 'Asignación de carga', external: 'asignacion_carga.html' },
            admin:         { icon: 'fa-cogs',       label: 'Administración' },
            mis_metas:     { icon: 'fa-bullseye',   label: 'Mis Metas' },
            inventario:    { icon: 'fa-warehouse',  label: 'Inventario' }
        };

        // ==================== FUNCIONES ORIGINALES (TODAS, SIN CAMBIOS) ====================
        // Aquí pega TODAS las funciones de tu archivo original: verificarSesion, cerrarSesion, showNotification, apiFetch, uploadFile, etc.
        // ...

        // La función verificarSesion se modifica ligeramente para aceptar más roles
        function verificarSesion() {
            const s = sessionStorage.getItem('currentUser');
            if (!s) { window.location.href = 'login.html'; return; }
            currentUser = JSON.parse(s);
            // Ahora permitimos todos los roles definidos en ROLE_PERMISSIONS
            if (!ROLE_PERMISSIONS[currentUser.rol]) {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('user-display').innerHTML = `
            <i class="fas fa-shield-haltered user-icon"></i>
            <div class="user-details">
                <span class="user-name">${currentUser.nombres} ${currentUser.apellido_paterno} ${currentUser.apellido_materno || ''}</span>
                <span class="user-role-badge">${currentUser.rol}</span>
            </div>`;
        }

        // ==================== CONSTRUCCIÓN DEL SIDEBAR DINÁMICO (NUEVO) ====================
        function buildSidebar(role) {
            const allowed = ROLE_PERMISSIONS[role] || [];
            const sidebar = document.getElementById('sidebar-menu');
            sidebar.innerHTML = '<ul class="sidebar-menu">' +
                allowed.map(key => {
                    const item = MENU_ITEMS[key];
                    if (!item) return '';
                    const link = item.external
                        ? `<a href="${item.external}" class="external-link"><i class="fas ${item.icon}"></i> ${item.label} <i class="fas fa-external-link-alt"></i></a>`
                        : `<a href="#" data-panel="${key}"><i class="fas ${item.icon}"></i> ${item.label}</a>`;
                    return `<li>${link}</li>`;
                }).join('') +
                '</ul>';

            // Asignar eventos de navegación
            sidebar.querySelectorAll('a[data-panel]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    navegarA(this.dataset.panel);
                });
            });
        }

        // ==================== NAVEGACIÓN (ORIGINAL PERO ADAPTADA) ====================
        function navegarA(panel) {
            if (!currentUser || !currentUser.empresa_id) return;
            // Verificar que el panel esté permitido (por si se accede directamente)
            const allowed = ROLE_PERMISSIONS[currentUser.rol] || [];
            if (!allowed.includes(panel)) return;

            // Ocultar todos los paneles y desactivar links
            document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));

            // Activar panel
            const target = document.getElementById(`panel-${panel}`);
            if (target) target.classList.add('active');
            const activeLink = document.querySelector(`.sidebar-menu a[data-panel="${panel}"]`);
            if (activeLink) activeLink.classList.add('active');

            // Llamar a la función de carga correspondiente (las originales tuyas)
            if (panel === 'inicio') cargarInicio();
            else if (panel === 'productos') cargarProductos();
            else if (panel === 'equipo') cargarEquipo('comercial');
            else if (panel === 'clientes') cargarClientes();
            else if (panel === 'metas') cargarPanelMetas();
            else if (panel === 'distribucion') cargarPanelDistribucion();
        }

        function recargarTodo() {
            const panelActivo = document.querySelector('.section-panel.active')?.id?.replace('panel-','');
            if (panelActivo) navegarA(panelActivo);
            showNotification('Datos actualizados');
        }

        // ==================== INICIALIZACIÓN (MODIFICADA) ====================
        window.onload = async function() {
            verificarSesion();
            if (!currentUser) return;
            await cargarDatosIniciales();
            buildSidebar(currentUser.rol);  // <-- Construir menú según rol
            // Cargar el primer panel permitido que no sea externo
            const firstPanel = ROLE_PERMISSIONS[currentUser.rol].find(p => !MENU_ITEMS[p]?.external) || 'inicio';
            navegarA(firstPanel);
        };

        // ==================== A PARTIR DE AQUÍ, TODO EL CÓDIGO DE TUS PANELES (SIN MODIFICAR) ====================
        // Incluye todas las funciones: cargarInicio, cargarEquipo, abrirModalUsuario, etc.
        // ...

        // ==================== EJEMPLO DE ALGUNAS FUNCIONES (DEBEN IR TODAS) ====================
        // Como referencia, estas son las que estaban en tu archivo original.
        // Por brevedad no las copio todas aquí, pero DEBES PEGARLAS ÍNTEGRAMENTE.
    </script>
</body>
