<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Nexial Suite · Panel de Control</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    
    <!-- Fuente y Font Awesome (tema base) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ===== TEMA BASE ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        html { overscroll-behavior: none; }
        body {
            font-family:'Inter', -apple-system, sans-serif;
            background:#f4f6fb;
            color:#1a1f36;
            touch-action:manipulation;
            -webkit-tap-highlight-color:transparent;
        }

        /* ===== HEADER ===== */
        .app-header {
            position:fixed; top:0; left:0; width:100%; height:80px;
            background:rgba(10,15,30,0.96); backdrop-filter:blur(14px);
            z-index:1000; display:flex; align-items:center; justify-content:space-between;
            padding:0 24px; border-bottom:1px solid rgba(255,255,255,0.08);
        }
        .header-brand { display:flex; align-items:center; gap:12px; text-decoration:none; }
        .app-logo {
            font-size:2.8rem;
            background:linear-gradient(135deg,#1a56db,#00a3ff);
            -webkit-background-clip:text; background-clip:text;
            -webkit-text-fill-color:transparent;
            filter:drop-shadow(0 0 14px rgba(26,86,219,0.7));
        }
        .brand-name {
            color:white; font-weight:900; font-size:1.8rem; letter-spacing:-0.5px;
            text-shadow: 0 0 20px rgba(0,163,255,0.5);
        }
        .header-actions {
            display:flex; align-items:center; gap:16px;
        }
        .user-info {
            display:flex; align-items:center; gap:12px;
            background:rgba(255,255,255,0.06); padding:6px 18px 6px 12px;
            border-radius:40px; border:1px solid rgba(255,255,255,0.08);
        }
        .user-icon { font-size:1.8rem; color:#1a56db; }
        .user-details { display:flex; flex-direction:column; }
        .user-name { font-weight:700; font-size:1rem; color:#fff; }
        .user-role-badge {
            font-size:0.6rem; font-weight:600;
            background:linear-gradient(135deg,#1a56db,#4a8eff);
            padding:2px 12px; border-radius:20px; color:#fff;
            width:fit-content; margin-top:2px;
        }

        /* ===== BOTONES ===== */
        .btn-outline {
            background:transparent; border:1.5px solid rgba(255,255,255,0.35);
            color:white; padding:8px 20px; border-radius:40px;
            font-weight:600; font-size:0.85rem; cursor:pointer;
            display:inline-flex; align-items:center; gap:8px;
            font-family:'Inter',sans-serif; transition:0.2s;
        }
        .btn-outline:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.7); }
        .btn-outline.icon-only { padding:8px 12px; }
        .btn-outline.danger:hover { background:rgba(194,65,44,0.3); border-color:#c2412c; }

        /* ===== SIDEBAR ===== */
        .dashboard-container {
            margin-top:80px; display:flex; min-height:calc(100vh - 80px);
        }
        .sidebar {
            width:260px; background:white; border-right:1px solid #e5e7eb;
            padding:20px 0; position:fixed; top:80px; bottom:0; overflow-y:auto;
            z-index:900;
        }
        .sidebar-menu { list-style:none; }
        .sidebar-menu li { padding:0 16px; margin-bottom:2px; }
        .sidebar-menu a {
            display:flex; align-items:center; gap:12px;
            padding:12px 18px; border-radius:12px;
            color:#475569; font-weight:500; font-size:0.9rem;
            text-decoration:none; transition:0.2s;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background:#f1f5f9; color:#1a56db; font-weight:600;
        }
        .sidebar-menu a i { width:22px; text-align:center; }

        /* ===== MAIN IFRAME ===== */
        .main-content {
            margin-left:260px; flex:1;
            height:calc(100vh - 80px);
        }
        iframe {
            width:100%; height:100%; border:none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width:900px) {
            .app-header { padding:0 12px; height:70px; }
            .brand-name { font-size:1.4rem; }
            .user-info { padding:4px 12px; }
            .user-name { font-size:0.85rem; }
            .btn-outline { padding:6px 14px; font-size:0.75rem; }
            .sidebar {
                width:100%; height:auto; position:relative; top:auto;
                bottom:auto; border-right:none; border-bottom:1px solid #e2e8f0;
                padding:8px; overflow-x:auto; display:flex;
            }
            .sidebar-menu { display:flex; gap:4px; flex-wrap:nowrap; }
            .sidebar-menu li { padding:0; }
            .sidebar-menu a { padding:8px 14px; font-size:0.75rem; white-space:nowrap; }
            .main-content { margin-left:0; height:calc(100vh - 70px); }
            .dashboard-container { flex-direction:column; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER (con tema base) ===== -->
    <header class="app-header">
        <div class="header-brand">
            <i class="fas fa-brain app-logo"></i>
            <span class="brand-name">Nexial Suite</span>
        </div>
        <div class="header-actions">
            <div class="user-info" id="user-display"></div>
            <!-- Botón recargar -->
            <button class="btn-outline icon-only" onclick="recargarDatos()" title="Recargar datos">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button class="btn-outline" onclick="cerrarSesion()">
                <i class="fas fa-sign-out-alt"></i> Cerrar sesión
            </button>
        </div>
    </header>

    <!-- ===== DASHBOARD ===== -->
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar-menu"></aside>
        <main class="main-content">
            <iframe id="content-frame" src=""></iframe>
        </main>
    </div>

    <script>
        // ═══════════════════════════════════════════
        // CONFIGURACIÓN
        // ═══════════════════════════════════════════

        // Módulos en el orden deseado
        const MODULE_ORDER = ['inicio', 'metas', 'stock', 'clientes', 'catalogo', 'equipo', 'rutas', 'carga'];

        // Metadatos de cada módulo
        const MENU_ITEMS = {
            inicio:  { icon: 'fa-home',        label: 'Inicio' },
            metas:   { icon: 'fa-bullseye',    label: 'Metas' },
            stock:   { icon: 'fa-cubes',       label: 'Stock' },
            clientes:{ icon: 'fa-building',    label: 'Clientes' },
            catalogo:{ icon: 'fa-box',         label: 'Catálogo' },
            equipo:  { icon: 'fa-users',       label: 'Equipo' },
            rutas:   { icon: 'fa-route',       label: 'Asignación de Rutas' },
            carga:   { icon: 'fa-truck-loading', label: 'Asignación de Carga' }
        };

        // Archivos HTML correspondientes (rutas relativas a la base)
        const PAGE_FILES = {
            inicio:  'inicio.html',
            metas:   'metas.html',
            stock:   'stock.html',
            clientes:'clientes.html',
            catalogo:'catalogo.html',
            equipo:  'equipo.html',
            rutas:   'asignacion_rutas.html',
            carga:   'asignacion_carga.html'
        };

        // Permisos por rol (todos los módulos disponibles para todos los roles, puedes modificar)
        const ROLE_PERMISSIONS = {
            'Director Corporativo': MODULE_ORDER,
            'Director General':    MODULE_ORDER,
            'Director Financiero': MODULE_ORDER,
            'Supervisor Senior':  MODULE_ORDER,
            'Ejecutivo Comercial': MODULE_ORDER,
            'Especialista Logístico': MODULE_ORDER,
            'Gestor de Almacén':   MODULE_ORDER
        };

        let currentUser = null;

        // ═══════════════════════════════════════════
        // SESIÓN
        // ═══════════════════════════════════════════

        function verificarSesion() {
            const s = sessionStorage.getItem('currentUser');
            if (!s) { window.location.href = 'login.html'; return false; }
            currentUser = JSON.parse(s);
            if (!ROLE_PERMISSIONS[currentUser.rol]) {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'login.html';
                return false;
            }
            document.getElementById('user-display').innerHTML = `
                <i class="fas fa-shield-haltered user-icon"></i>
                <div class="user-details">
                    <span class="user-name">${currentUser.nombres} ${currentUser.apellido_paterno} ${currentUser.apellido_materno || ''}</span>
                    <span class="user-role-badge">${currentUser.rol}</span>
                </div>`;
            return true;
        }

        function cerrarSesion() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // ═══════════════════════════════════════════
        // RECARGA DE DATOS
        // ═══════════════════════════════════════════

        function recargarDatos() {
            // Recarga el iframe actual (o puedes recargar la página completa)
            const iframe = document.getElementById('content-frame');
            if (iframe && iframe.src) {
                iframe.src = iframe.src; // Esto fuerza la recarga
            } else {
                location.reload(); // fallback
            }
        }

        // ═══════════════════════════════════════════
        // CONSTRUCCIÓN DEL MENÚ LATERAL
        // ═══════════════════════════════════════════

        function buildSidebar(role) {
            const allowed = ROLE_PERMISSIONS[role] || [];
            const sidebar = document.getElementById('sidebar-menu');
            let html = '<ul class="sidebar-menu">';

            // Recorremos en el orden definido
            MODULE_ORDER.forEach(key => {
                if (!allowed.includes(key)) return;
                const item = MENU_ITEMS[key];
                const file = PAGE_FILES[key];
                if (!item || !file) return;

                html += `<li><a href="#" data-panel="${key}" data-file="${file}">
                    <i class="fas ${item.icon}"></i> ${item.label}
                </a></li>`;
            });

            html += '</ul>';
            sidebar.innerHTML = html;

            // Eventos de clic
            sidebar.querySelectorAll('a[data-panel]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const file = this.dataset.file;
                    // Marcar activo
                    sidebar.querySelectorAll('a').forEach(a => a.classList.remove('active'));
                    this.classList.add('active');
                    // Cargar en iframe (resolviendo ruta)
                    const base = getBasePath();
                    document.getElementById('content-frame').src = base + file;
                });
            });
        }

        // ═══════════════════════════════════════════
        // RUTA BASE (para GitHub Pages)
        // ═══════════════════════════════════════════

        function getBasePath() {
            const path = window.location.pathname;
            const lastSlash = path.lastIndexOf('/');
            return path.substring(0, lastSlash + 1);
        }

        // ═══════════════════════════════════════════
        // INICIALIZACIÓN
        // ═══════════════════════════════════════════

        window.addEventListener('DOMContentLoaded', () => {
            if (!verificarSesion()) return;

            buildSidebar(currentUser.rol);

            // Cargar el primer módulo permitido (por orden, el primero de la lista)
            const allowed = ROLE_PERMISSIONS[currentUser.rol] || [];
            for (let key of MODULE_ORDER) {
                if (allowed.includes(key)) {
                    const firstFile = PAGE_FILES[key];
                    if (firstFile) {
                        const base = getBasePath();
                        document.getElementById('content-frame').src = base + firstFile;
                        // Activar enlace
                        const firstLink = document.querySelector(`.sidebar-menu a[data-panel="${key}"]`);
                        if (firstLink) firstLink.classList.add('active');
                    }
                    break;
                }
            }
        });
    </script>
</body>
</html>
