<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Nexial Suite · Panel de Control</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background:#f4f6fb; color:#1a1f36; line-height:1.6; }
        .navbar { position:fixed; top:0; width:100%; background:rgba(10,15,30,0.94); backdrop-filter:blur(14px); z-index:1000; border-bottom:1px solid rgba(255,255,255,0.05); padding:0 32px; height:72px; display:flex; align-items:center; justify-content:space-between; }
        .logo-area { display:flex; align-items:center; gap:12px; text-decoration:none; }
        .logo-icon { font-size:2.2rem; background:linear-gradient(135deg,#1a56db,#00a3ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .logo-text { font-size:1.5rem; font-weight:700; background:linear-gradient(to right,#ffffff,#c0d0f0); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .nav-actions { display:flex; align-items:center; gap:20px; }
        .user-info { display:flex; align-items:center; gap:14px; color:white; padding:8px 20px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); }
        .user-icon { font-size:1.6rem; color:#1a56db; }
        .user-details { display:flex; flex-direction:column; }
        .user-name { font-weight:700; font-size:1.15rem; color:#fff; }
        .user-role-badge { font-size:0.7rem; font-weight:600; background:linear-gradient(135deg,#1a56db,#4a8eff); padding:3px 12px; border-radius:20px; width:fit-content; margin-top:4px; color:#fff; }
        .btn-outline { background:transparent; border:1.5px solid rgba(255,255,255,0.35); color:white; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; }
        .btn-outline:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.7); }
        .dashboard-container { margin-top:72px; display:flex; min-height:calc(100vh - 72px); }
        .sidebar { width:260px; background:white; border-right:1px solid #e5e7eb; padding:20px 0; position:fixed; top:72px; bottom:0; overflow-y:auto; z-index:900; }
        .sidebar-menu { list-style:none; }
        .sidebar-menu li { padding:0 16px; margin-bottom:2px; }
        .sidebar-menu a { display:flex; align-items:center; gap:12px; padding:12px 18px; border-radius:12px; color:#475569; font-weight:500; font-size:0.9rem; text-decoration:none; transition:0.2s; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background:#f1f5f9; color:#1a56db; font-weight:600; }
        .sidebar-menu a i { width:22px; text-align:center; }
        .main-content { margin-left:260px; flex:1; height:calc(100vh - 72px); }
        iframe { width:100%; height:100%; border:none; }
        @media (max-width:900px) {
            .sidebar { width:100%; height:auto; position:relative; top:auto; bottom:auto; flex-direction:row; overflow-x:auto; padding:8px; border-right:none; border-bottom:1px solid #e2e8f0; }
            .sidebar-menu { display:flex; gap:4px; }
            .sidebar-menu li { padding:0; }
            .sidebar-menu a { padding:8px 14px; font-size:0.78rem; white-space:nowrap; }
            .main-content { margin-left:0; height:calc(100vh - 132px); }
            .dashboard-container { flex-direction:column; }
            .navbar { padding:0 12px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo-area">
            <i class="fas fa-brain logo-icon"></i>
            <span class="logo-text">Nexial Suite</span>
        </div>
        <div class="nav-actions">
            <div class="user-info" id="user-display"></div>
            <button class="btn-outline" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar-menu"></aside>
        <main class="main-content">
            <iframe id="content-frame" src=""></iframe>
        </main>
    </div>

    <script>
        // ═══════════════════════════════════════════
        // Configuración de roles y archivos reales
        // ═══════════════════════════════════════════

        // Definimos qué módulos (clave interna) puede ver cada rol
        const ROLE_PERMISSIONS = {
            'Director Corporativo': ['catalogo', 'clientes', 'equipo', 'rutas'],
            'Director General':    ['catalogo', 'clientes', 'equipo', 'rutas'],
            'Director Financiero': ['catalogo', 'clientes', 'equipo'],         // sin rutas
            'Supervisor Senior':  ['catalogo', 'clientes', 'equipo', 'rutas'],
            'Ejecutivo Comercial': ['catalogo', 'clientes'],                  // solo catálogo y clientes
            'Especialista Logístico': ['catalogo', 'clientes', 'rutas'],       // sin equipo
            'Gestor de Almacén':   ['catalogo']                                // solo catálogo
        };

        // Obtener la base de la ruta donde está este archivo (para rutas relativas)
        function getBasePath() {
            const path = window.location.pathname;
            // Si termina con '/', es un directorio
            if (path.endsWith('/')) return path;
            // Si no, quita el nombre del archivo
            const lastSlash = path.lastIndexOf('/');
            return path.substring(0, lastSlash + 1);
        }

        const BASE_PATH = getBasePath();

        // Mapeo de clave interna → archivo HTML (ruta absoluta desde la raíz)
        // Usamos BASE_PATH para que funcione en cualquier subdirectorio
        const PAGE_FILES = {
            catalogo: BASE_PATH + 'catalogo.html',
            clientes: BASE_PATH + 'clientes.html',
            equipo:   BASE_PATH + 'equipo.html',
            rutas:    BASE_PATH + 'asignacion_rutas.html'
        };

        // Información para el menú (icono y etiqueta)
        const MENU_ITEMS = {
            catalogo: { icon: 'fa-box',         label: 'Catálogo' },
            clientes: { icon: 'fa-building',    label: 'Clientes' },
            equipo:   { icon: 'fa-users',       label: 'Equipo' },
            rutas:    { icon: 'fa-route',       label: 'Rutas' }
        };

        let currentUser = null;

        // ═══════════════════════════════════════════
        // Sesión
        // ═══════════════════════════════════════════
        function verificarSesion() {
            const s = sessionStorage.getItem('currentUser');
            if (!s) { window.location.href = 'login.html'; return false; }
            currentUser = JSON.parse(s);
            if (!ROLE_PERMISSIONS[currentUser.rol]) {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'login.html';
                return false;
            }
            document.getElementById('user-display').innerHTML = `
                <i class="fas fa-shield-haltered user-icon"></i>
                <div class="user-details">
                    <span class="user-name">${currentUser.nombres} ${currentUser.apellido_paterno} ${currentUser.apellido_materno || ''}</span>
                    <span class="user-role-badge">${currentUser.rol}</span>
                </div>`;
            return true;
        }

        function cerrarSesion() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }

        // ═══════════════════════════════════════════
        // Construcción del menú lateral
        // ═══════════════════════════════════════════
        function buildSidebar(role) {
            const allowed = ROLE_PERMISSIONS[role] || [];
            const sidebar = document.getElementById('sidebar-menu');
            let html = '<ul class="sidebar-menu">';

            allowed.forEach(key => {
                const item = MENU_ITEMS[key];
                const file = PAGE_FILES[key];
                if (!item || !file) return;

                html += `<li><a href="#" data-panel="${key}" data-file="${file}">
                    <i class="fas ${item.icon}"></i> ${item.label}
                </a></li>`;
            });

            html += '</ul>';
            sidebar.innerHTML = html;

            // Agregar eventos de clic a los enlaces
            sidebar.querySelectorAll('a[data-panel]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const file = this.dataset.file;
                    // Marcar como activo
                    sidebar.querySelectorAll('a').forEach(a => a.classList.remove('active'));
                    this.classList.add('active');
                    // Cargar en el iframe
                    document.getElementById('content-frame').src = file;
                });
            });
        }

        // ═══════════════════════════════════════════
        // Inicialización
        // ═══════════════════════════════════════════
        window.addEventListener('DOMContentLoaded', () => {
            if (!verificarSesion()) return;
            buildSidebar(currentUser.rol);

            // Cargar automáticamente el primer módulo permitido
            const allowed = ROLE_PERMISSIONS[currentUser.rol] || [];
            if (allowed.length > 0) {
                const firstKey = allowed[0];
                const firstFile = PAGE_FILES[firstKey];
                if (firstFile) {
                    document.getElementById('content-frame').src = firstFile;
                    // Activar el enlace correspondiente
                    const firstLink = document.querySelector(`.sidebar-menu a[data-panel="${firstKey}"]`);
                    if (firstLink) firstLink.classList.add('active');
                }
            }
        });
    </script>
</body>
</html>
