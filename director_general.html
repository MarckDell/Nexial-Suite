<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Nexial Suite · Panel de Control</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#f4f6fb; height:100vh; overflow:hidden; }
        .navbar { position:fixed; top:0; width:100%; height:72px; background:rgba(10,15,30,0.94); backdrop-filter:blur(14px); z-index:1000; display:flex; align-items:center; justify-content:space-between; padding:0 32px; border-bottom:1px solid rgba(255,255,255,0.05); }
        .logo-area { display:flex; align-items:center; gap:12px; text-decoration:none; }
        .logo-icon { font-size:2.2rem; background:linear-gradient(135deg,#1a56db,#00a3ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .logo-text { font-size:1.5rem; font-weight:700; background:linear-gradient(to right,#ffffff,#c0d0f0); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .user-info { display:flex; align-items:center; gap:14px; color:white; padding:8px 20px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); }
        .user-icon { font-size:1.6rem; color:#1a56db; }
        .user-details { display:flex; flex-direction:column; line-height:1.3; }
        .user-name { font-weight:700; font-size:1.15rem; color:#fff; }
        .user-role-badge { font-size:0.7rem; font-weight:600; background:linear-gradient(135deg,#1a56db,#4a8eff); padding:3px 12px; border-radius:20px; text-transform:uppercase; letter-spacing:0.8px; width:fit-content; margin-top:4px; color:#fff; }
        .btn-outline { background:transparent; border:1.5px solid rgba(255,255,255,0.35); color:white; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; transition:0.25s; display:inline-flex; align-items:center; gap:8px; }
        .btn-outline:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.7); }
        .dashboard-container { display:flex; height:calc(100vh - 72px); margin-top:72px; }
        .sidebar { width:260px; background:white; border-right:1px solid #e5e7eb; padding:20px 0; overflow-y:auto; flex-shrink:0; }
        .sidebar-menu { list-style:none; }
        .sidebar-menu li { padding:0 16px; margin-bottom:2px; }
        .sidebar-menu a { display:flex; align-items:center; gap:12px; padding:12px 18px; border-radius:12px; color:#475569; font-weight:500; font-size:0.9rem; text-decoration:none; transition:0.2s; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background:#f1f5f9; color:#1a56db; font-weight:600; }
        .sidebar-menu a i { font-size:1.1rem; width:22px; text-align:center; }
        .sidebar-menu a.external-link i.fa-external-link-alt { font-size:0.7rem; margin-left:auto; opacity:0.5; }
        .main-content { flex:1; background:#f4f6fb; }
        iframe { width:100%; height:100%; border:none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo-area">
            <i class="fas fa-brain logo-icon"></i>
            <span class="logo-text">Nexial Suite</span>
        </a>
        <div class="nav-actions">
            <div class="user-info" id="user-display"></div>
            <button class="btn-outline" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar-menu"></aside>
        <main class="main-content">
            <iframe id="content-frame" src=""></iframe>
        </main>
    </div>

    <script>
        const ROLE_PERMISSIONS = {
            'Director Corporativo': ['inicio', 'equipo', 'metas', 'distribucion', 'clientes', 'productos', 'rutas', 'carga', 'admin'],
            'Director General':    ['inicio', 'equipo', 'metas', 'distribucion', 'clientes', 'productos', 'rutas', 'carga'],
            'Director Financiero': ['inicio', 'equipo', 'metas', 'distribucion', 'clientes', 'productos'],
            'Supervisor Senior':  ['inicio', 'equipo', 'metas', 'distribucion', 'clientes', 'productos', 'rutas', 'carga'],
            'Ejecutivo Comercial': ['inicio', 'clientes', 'productos', 'mis_metas'],
            'Especialista Logístico': ['inicio', 'distribucion', 'clientes', 'productos', 'rutas', 'carga'],
            'Gestor de Almacén':   ['inicio', 'productos', 'distribucion', 'inventario']
        };

        const MENU_ITEMS = {
            inicio:        { icon: 'fa-home',       label: 'Inicio',        file: 'inicio.html' },
            equipo:        { icon: 'fa-users',      label: 'Equipo',        file: 'equipo.html' },
            metas:         { icon: 'fa-bullseye',   label: 'Metas',         file: 'metas.html' },
            distribucion:  { icon: 'fa-boxes',      label: 'Distribución',  file: 'distribucion.html' },
            clientes:      { icon: 'fa-building',   label: 'Clientes',      file: 'clientes.html' },
            productos:     { icon: 'fa-box',        label: 'Productos',     file: 'productos.html' },
            rutas:         { icon: 'fa-route',      label: 'Asignación de rutas', external: true, file: 'asignacion_rutas.html' },
            carga:         { icon: 'fa-truck-loading', label: 'Asignación de carga', external: true, file: 'asignacion_carga.html' },
            admin:         { icon: 'fa-cogs',       label: 'Administración', file: 'admin.html' },
            mis_metas:     { icon: 'fa-bullseye',   label: 'Mis Metas',     file: 'mis_metas.html' },
            inventario:    { icon: 'fa-warehouse',  label: 'Inventario',    file: 'inventario.html' }
        };

        let currentUser = null;

        function verificarSesion() {
            const s = sessionStorage.getItem('currentUser');
            if (!s) { window.location.href = 'login.html'; return false; }
            currentUser = JSON.parse(s);
            if (!ROLE_PERMISSIONS[currentUser.rol]) {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'login.html';
                return false;
            }
            document.getElementById('user-display').innerHTML = `
                <i class="fas fa-shield-haltered user-icon"></i>
                <div class="user-details">
                    <span class="user-name">${currentUser.nombres} ${currentUser.apellido_paterno} ${currentUser.apellido_materno || ''}</span>
                    <span class="user-role-badge">${currentUser.rol}</span>
                </div>`;
            return true;
        }

        function cerrarSesion() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        function buildSidebar(role) {
            const allowed = ROLE_PERMISSIONS[role] || [];
            const sidebar = document.getElementById('sidebar-menu');
            sidebar.innerHTML = '<ul class="sidebar-menu">' +
                allowed.map(key => {
                    const item = MENU_ITEMS[key];
                    if (!item) return '';
                    const link = item.external
                        ? `<a href="${item.file}" target="_blank"><i class="fas ${item.icon}"></i> ${item.label} <i class="fas fa-external-link-alt"></i></a>`
                        : `<a href="#" data-panel="${key}" data-file="${item.file}"><i class="fas ${item.icon}"></i> ${item.label}</a>`;
                    return `<li>${link}</li>`;
                }).join('') +
                '</ul>';

            sidebar.querySelectorAll('a[data-panel]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    // Marcar activo
                    sidebar.querySelectorAll('a').forEach(a => a.classList.remove('active'));
                    this.classList.add('active');
                    // Cargar en iframe
                    const file = this.dataset.file;
                    document.getElementById('content-frame').src = file;
                });
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!verificarSesion()) return;
            buildSidebar(currentUser.rol);
            // Cargar el primer panel permitido no externo por defecto
            const firstPanel = ROLE_PERMISSIONS[currentUser.rol].find(key => !MENU_ITEMS[key]?.external);
            if (firstPanel) {
                const file = MENU_ITEMS[firstPanel].file;
                document.getElementById('content-frame').src = file;
                // Marcar el enlace como activo
                const activeLink = document.querySelector(`.sidebar-menu a[data-panel="${firstPanel}"]`);
                if (activeLink) activeLink.classList.add('active');
            }
        });
    </script>
</body>
</html>
