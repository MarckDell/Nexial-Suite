<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Nexial Suite</title>
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a1f 0%, #1a1a3e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            margin: 0;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 102, 255, 0.2);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo i {
            font-size: 4rem;
            background: linear-gradient(45deg, #0066ff, #00f5ff, #0099ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s infinite alternate;
            filter: drop-shadow(0 0 10px rgba(0, 102, 255, 0.5));
        }

        @keyframes glow {
            0% {
                filter: drop-shadow(0 0 6px rgba(0, 102, 255, 0.3));
            }
            100% {
                filter: drop-shadow(0 0 18px rgba(0, 102, 255, 0.8)) drop-shadow(0 0 25px rgba(0, 245, 255, 0.5));
            }
        }

        h2 {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 500;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #ccc;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #0066ff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 5px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .toggle-password:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0066ff, #0099ff);
            border: none;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 102, 255, 0.3);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 1rem;
            display: none;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 8px;
            border-left: 3px solid #ff6b6b;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .remember-row input[type="checkbox"] {
            width: auto;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #0066ff;
        }

        .remember-row label {
            margin-bottom: 0;
            font-size: 0.85rem;
            color: #bbb;
            cursor: pointer;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Estilo para el mensaje de bienvenida en el botón */
        .welcome-message {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .welcome-message i {
            font-size: 1.2rem;
            animation: brainPulse 0.8s ease-in-out;
        }

        @keyframes brainPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-brain"></i>
        </div>
        <h2>Nexial Suite</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope" style="margin-right: 8px; font-size: 0.85rem;"></i>
                    Correo electrónico
                </label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock" style="margin-right: 8px; font-size: 0.85rem;"></i>
                    Contraseña
                </label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                    <button type="button" class="toggle-password" id="togglePasswordBtn">Mostrar</button>
                </div>
            </div>
            <div class="remember-row">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Recordar mi correo</label>
            </div>
            <button type="submit" id="submitBtn">Iniciar sesión</button>
            <div class="error-message" id="errorMsg"></div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://zgzwhyywkervutpvazqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aE2X3gv4CE110VzI4uoT-Q_yo4Xv6Zb';

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberCheck = document.getElementById('rememberMe');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');

        // Cargar email guardado si existe
        const savedEmail = localStorage.getItem('rememberedEmail');
        if (savedEmail) {
            emailInput.value = savedEmail;
            rememberCheck.checked = true;
        }

        // Funcionalidad de mostrar/ocultar contraseña
        togglePasswordBtn.addEventListener('click', function(e) {
            e.preventDefault();
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            this.textContent = isPassword ? 'Ocultar' : 'Mostrar';
        });

        // Función de login usando fetch directo a la API REST
        async function performLogin(email, password) {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/login_user`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                },
                body: JSON.stringify({
                    p_email: email,
                    p_password: password
                })
            });

            if (!response.ok) {
                throw new Error('Error del servidor');
            }

            return await response.json();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('Por favor completa todos los campos.');
                return;
            }

            // Mostrar estado de carga
            submitBtn.disabled = true;
            const originalButtonText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="loading-spinner"></span> Validando credenciales...';
            errorMsg.style.display = 'none';

            try {
                const data = await performLogin(email, password);
                
                if (data && data.length > 0) {
                    const user = data[0];
                    
                    // Guardar datos de sesión
                    sessionStorage.setItem('currentUser', JSON.stringify(user));
                    localStorage.setItem('user_id', user.id);
                    localStorage.setItem('user_empresa_id', user.empresa_id);
                    localStorage.setItem('user_nombres', user.nombres);
                    localStorage.setItem('user_apellido_paterno', user.apellido_paterno);
                    localStorage.setItem('user_email', user.email);
                    localStorage.setItem('user_rol', user.rol);
                    
                    // Recordar correo si el checkbox está marcado
                    if (rememberCheck.checked) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }
                    
                    // Mostrar mensaje de bienvenida con el logo y redirigir
                    showWelcomeAndRedirect(user.rol);
                    
                } else {
                    showError('Credenciales incorrectas. Verifica tu email y contraseña.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalButtonText;
                }
            } catch (err) {
                console.error('Error en login:', err);
                showError('Error al conectar con el servidor. Verifica tu conexión e intenta nuevamente.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalButtonText;
            }
        });

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            
            // Auto-ocultar después de 5 segundos
            setTimeout(() => {
                if (errorMsg.style.display === 'block') {
                    errorMsg.style.display = 'none';
                }
            }, 5000);
        }

        function showWelcomeAndRedirect(rol) {
            // Cambiar el botón a un mensaje de bienvenida con el logo
            submitBtn.innerHTML = `
                <div class="welcome-message">
                    <i class="fas fa-brain"></i>
                    <span>Bienvenido a Nexial Suite</span>
                </div>
            `;
            submitBtn.style.background = 'linear-gradient(135deg, #00c853, #00e676)';
            submitBtn.style.cursor = 'default';
            
            // Convertir el rol a formato de archivo
            const rolSlug = rol
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_|_$/g, '');
            
            const targetPage = rolSlug + '.html';
            
            // Redirigir después de 1.2 segundos para que se vea el mensaje
            setTimeout(() => {
                window.location.href = targetPage;
            }, 1200);
        }

        // Permitir envío con Enter en cualquier campo
        const inputs = [emailInput, passwordInput];
        inputs.forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const submitEvent = new Event('submit', { cancelable: true });
                    form.dispatchEvent(submitEvent);
                }
            });
        });
    </script>
</body>
</html>
