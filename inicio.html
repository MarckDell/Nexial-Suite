<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Inicio · Nexial Suite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background:#f4f6fb; color:#1a1f36; line-height:1.6; }
        .container { max-width:1200px; margin:24px auto; padding:0 24px; }
        .card { background:white; border-radius:24px; padding:28px; box-shadow:0 4px 20px rgba(0,0,0,0.03); margin-bottom:24px; border:1px solid #f0f2f5; }
        .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:14px; }
        .card-header h2 { font-size:1.4rem; font-weight:700; color:#0f172a; }
        .filtros { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
        .filtro-group { display:flex; align-items:center; gap:6px; background:#f8fafc; padding:4px 14px; border-radius:30px; border:1px solid #e2e8f0; }
        .filtro-group label { font-size:0.8rem; font-weight:600; color:#475569; white-space:nowrap; }
        .filtro-group input, .filtro-group select { padding:6px 10px; border-radius:20px; border:1px solid #e2e8f0; font-family:'Inter',sans-serif; }
        .filtros button { padding:8px 14px; border-radius:30px; background:#1a56db; color:white; border:none; cursor:pointer; font-weight:600; font-family:'Inter',sans-serif; }
        .btn-solid { background:#1a56db; border:none; color:white; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; }
        .info-banner { background:#f0f9ff; border:1px solid #bae6fd; border-radius:16px; padding:14px 20px; margin-bottom:20px; font-size:0.85rem; color:#0369a1; display:flex; align-items:flex-start; gap:10px; }
        .chart-container { position:relative; height:400px; width:100%; margin-top:20px; }
        .notification { position:fixed; top:24px; right:32px; background:#1a1f36; color:white; padding:14px 28px; border-radius:60px; font-weight:500; z-index:3000; box-shadow:0 12px 28px rgba(0,0,0,0.3); display:none; align-items:center; gap:10px; font-size:0.9rem; }
        .notification.error { background:#c2412c; }
        .notification.success { background:#2c6e49; }
    </style>
</head>
<body>
    <div class="container" id="inicio-container">
        <!-- Se llena dinámicamente -->
    </div>
    <div id="notification" class="notification"><i class="fas fa-circle-info"></i><span></span></div>

    <script>
        const SUPABASE_URL = 'https://zgzwhyywkervutpvazqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aE2X3gv4CE110VzI4uoT-Q_yo4Xv6Zb';
        let currentUser = null, empresaMonedaCodigo = 'USD';
        let chartVentas = null, ventasDataCache = [], productosMapCache = {};
        let currentDesde = null, currentHasta = null;
        let soloUnDiaActivo = true;

        function verificarSesion() { 
            const s = sessionStorage.getItem('currentUser'); 
            if(!s){ window.location.href='login.html'; return; } 
            currentUser = JSON.parse(s); 
            if(currentUser.rol !== 'Supervisor Senior' && currentUser.rol !== 'Director General' && currentUser.rol !== 'Director Financiero') {
                sessionStorage.removeItem('currentUser'); 
                window.location.href = 'login.html'; 
            } 
        }

        function showNotification(m, t='success') {
            const n = document.getElementById('notification');
            n.querySelector('span').innerText = m;
            n.className = `notification ${t}`;
            n.style.display = 'flex';
            setTimeout(() => n.style.display = 'none', 4500);
        }

        async function apiFetch(endpoint, method='GET', body=null) {
            const headers = { 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` };
            if(method === 'POST' || method === 'PATCH') headers['Prefer'] = 'return=representation';
            const opts = { method, headers };
            if(body) opts.body = JSON.stringify(body);
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, opts);
            if(!res.ok) { const e = await res.text(); throw new Error(e); }
            const txt = await res.text();
            return txt ? JSON.parse(txt) : {};
        }

        function getSimboloMoneda(codigo) {
            // Retorna el código si no se encuentra (simplificado)
            return codigo;
        }

        async function cargarInicio(desde = null, hasta = null) {
            if(!currentUser || !currentUser.empresa_id) return;
            const empId = currentUser.empresa_id;
            if(!desde || !hasta) {
                const hoy = new Date(); 
                const fechaHoy = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
                desde = fechaHoy.toISOString(); 
                hasta = new Date(fechaHoy.getTime() + 86399999).toISOString();
            }
            currentDesde = desde; 
            currentHasta = hasta;

            // Cargar datos de ventas y productos
            ventasDataCache = await apiFetch(`ventas?empresa_id=eq.${empId}&fecha=gte.${encodeURIComponent(desde)}&fecha=lte.${encodeURIComponent(hasta)}&select=vendedor_id,total_linea,cantidad,producto_id&limit=1000`);
            const prodRes = await apiFetch(`productos?empresa_id=eq.${empId}&select=id,peso&activo=eq.true&limit=1000`);
            productosMapCache = {}; 
            prodRes.forEach(p => { productosMapCache[p.id] = p.peso ? parseFloat(p.peso) : 0; });

            const monSimbolo = getSimboloMoneda(empresaMonedaCodigo);
            const fechaDesdeFormato = new Date(desde).toISOString().slice(0,10);
            const fechaHastaFormato = new Date(hasta).toISOString().slice(0,10);

            document.getElementById('inicio-container').innerHTML = `
            <div class="card">
                <div class="card-header"><h2>Avance de Ventas por Vendedor</h2></div>
                <div class="filtros">
                    <div class="filtro-group"><label>Desde:</label><input type="date" id="fecha-desde-inicio" value="${fechaDesdeFormato}"></div>
                    <div class="filtro-group" id="hasta-group" style="display:${soloUnDiaActivo ? 'none' : 'flex'};"><label>Hasta:</label><input type="date" id="fecha-hasta-inicio" value="${fechaHastaFormato}"></div>
                    <div class="filtro-group"><label><input type="checkbox" id="chk-solo-dia" ${soloUnDiaActivo ? 'checked' : ''} onchange="toggleFiltroUnDia()"> Solo un día</label></div>
                    <button onclick="filtrarVentasInicio()"><i class="fas fa-filter"></i> Filtrar</button>
                </div>
                <div class="info-banner"><i class="fas fa-lightbulb"></i> Seleccione el rango o active <strong>"Solo un día"</strong> para ver una fecha concreta. Luego ordene con el selector.</div>
                <div style="display:flex; flex-wrap:wrap; align-items:center; gap:20px; margin-bottom:16px;">
                    <div class="filtro-group"><label>Ordenar por:</label>
                        <select id="orden-ventas" onchange="actualizarGrafico()">
                            <option value="monto_desc">Monto: Mayor a Menor</option>
                            <option value="monto_asc">Monto: Menor a Mayor</option>
                            <option value="carga_desc">Carga Total: Mayor a Menor</option>
                            <option value="carga_asc">Carga Total: Menor a Mayor</option>
                            <option value="variedad_desc">Variedad: Mayor a Menor</option>
                            <option value="variedad_asc">Variedad: Menor a Mayor</option>
                        </select>
                    </div>
                </div>
                <div class="chart-container"><canvas id="grafico-ventas"></canvas></div>
            </div>`;
            actualizarGrafico();
        }

        function toggleFiltroUnDia() {
            const chk = document.getElementById('chk-solo-dia');
            const hastaGroup = document.getElementById('hasta-group');
            const hastaInput = document.getElementById('fecha-hasta-inicio');
            const desdeInput = document.getElementById('fecha-desde-inicio');
            if(chk && chk.checked) {
                soloUnDiaActivo = true;
                hastaGroup.style.display = 'none';
                if(desdeInput && hastaInput) hastaInput.value = desdeInput.value;
            } else {
                soloUnDiaActivo = false;
                hastaGroup.style.display = 'flex';
            }
        }

        function actualizarGrafico() {
            if(!ventasDataCache.length) return;
            const empleadosMap = {}; 
            const resumen = {};
            ventasDataCache.forEach(v => {
                const vid = v.vendedor_id || 'sin_asignar';
                if(!resumen[vid]) resumen[vid] = { monto:0, cantidad:0, productos:new Set(), carga:0 };
                resumen[vid].monto += parseFloat(v.total_linea); 
                resumen[vid].cantidad += v.cantidad;
                resumen[vid].productos.add(v.producto_id);
                resumen[vid].carga += v.cantidad * (productosMapCache[v.producto_id] || 0);
            });

            apiFetch(`empleados?empresa_id=eq.${currentUser.empresa_id}&select=id,nombres,apellido_paterno&activo=eq.true&limit=1000`).then(emps => {
                emps.forEach(e => empleadosMap[e.id] = `${e.nombres} ${e.apellido_paterno}`);
            }).finally(() => {
                const vendors = Object.entries(resumen).map(([id, d]) => ({ 
                    id, 
                    nombre: id === 'sin_asignar' ? 'Sin vendedor' : (empleadosMap[id] || 'Desconocido'), 
                    monto: d.monto, 
                    carga: d.carga, 
                    variedad: d.productos.size 
                }));
                const orden = document.getElementById('orden-ventas')?.value || 'monto_desc';
                const [campo, dir] = orden.split('_');
                vendors.sort((a,b) => dir === 'desc' ? b[campo] - a[campo] : a[campo] - b[campo]);

                if(chartVentas) chartVentas.destroy();
                const ctx = document.getElementById('grafico-ventas')?.getContext('2d'); 
                if(!ctx) return;
                chartVentas = new Chart(ctx, { 
                    type:'bar', 
                    data:{ 
                        labels: vendors.map(v => v.nombre), 
                        datasets:[
                            { label:`Monto (${getSimboloMoneda(empresaMonedaCodigo)})`, data: vendors.map(v => v.monto), backgroundColor:'#2563eb', borderColor:'#1d4ed8', borderWidth:1, borderRadius:8 },
                            { label:'Carga Total', data: vendors.map(v => v.carga), backgroundColor:'#f59e0b', borderColor:'#d97706', borderWidth:1, borderRadius:8 },
                            { label:'Variedad (productos)', data: vendors.map(v => v.variedad), backgroundColor:'#10b981', borderColor:'#059669', borderWidth:1, borderRadius:8 }
                        ]
                    }, 
                    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ usePointStyle:true, font:{ size:12 } } } } } 
                });
            });
        }

        function filtrarVentasInicio() {
            const desde = document.getElementById('fecha-desde-inicio')?.value;
            let hasta = document.getElementById('fecha-hasta-inicio')?.value;
            if(soloUnDiaActivo) hasta = desde;
            if(desde && hasta) {
                if(hasta < desde) { showNotification('La fecha "Hasta" no puede ser menor que "Desde".', 'error'); return; }
                cargarInicio(desde + 'T00:00:00', hasta + 'T23:59:59');
            } else showNotification('Seleccione al menos la fecha "Desde"', 'error');
        }

        // Inicializar moneda de la empresa
        async function cargarDatosIniciales() {
            if(currentUser && currentUser.empresa_id) {
                const emp = await apiFetch(`empresas?id=eq.${currentUser.empresa_id}&select=moneda_principal_id`);
                if(emp.length > 0 && emp[0].moneda_principal_id) {
                    const mon = await apiFetch(`monedas?id=eq.${emp[0].moneda_principal_id}&select=codigo`);
                    if(mon.length > 0) empresaMonedaCodigo = mon[0].codigo;
                }
            }
        }

        window.onload = async function() {
            verificarSesion();
            if(currentUser) {
                await cargarDatosIniciales();
                cargarInicio();
            }
        };
    </script>
</body>
</html>
