<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Clientes · Nexial Suite</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background:#f4f6fb; color:#1a1f36; line-height:1.6; touch-action:manipulation; }
        .container { max-width:1200px; margin:24px auto; padding:0 24px; }
        .card { background:white; border-radius:24px; padding:28px; box-shadow:0 4px 20px rgba(0,0,0,0.03); margin-bottom:24px; border:1px solid #f0f2f5; }
        .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:14px; }
        .card-header h2 { font-size:1.4rem; font-weight:700; color:#0f172a; }
        .table-wrapper { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:12px 14px; text-align:left; border-bottom:1px solid #e2e8f0; font-size:0.88rem; }
        th { background:#f8fafc; color:#475569; font-weight:600; text-transform:uppercase; font-size:0.73rem; letter-spacing:0.5px; }
        tr:hover td { background:#f1f5f9; }
        .action-buttons { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
        .btn-sm { padding:6px 12px; border-radius:18px; font-size:0.78rem; font-weight:600; border:none; cursor:pointer; font-family:'Inter',sans-serif; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
        .btn-edit { background:#e0f2fe; color:#0369a1; }
        .btn-delete { background:#fee2e2; color:#991b1b; }
        .btn-activate { background:#dcfce7; color:#166534; }
        .btn-remove-permanent { background:#ffedd5; color:#9a3412; }
        .badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.7rem; font-weight:600; }
        .badge-success { background:#dcfce7; color:#166534; }
        .badge-danger { background:#fee2e2; color:#991b1b; }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(2,6,18,0.8); backdrop-filter:blur(8px); z-index:2000; display:none; align-items:flex-start; justify-content:center; padding:24px; overflow-y:auto; }
        .modal-overlay.active { display:flex; }
        .modal { background:white; border-radius:28px; padding:36px 32px; max-width:1050px; width:100%; box-shadow:0 30px 60px rgba(0,0,0,0.4); animation:modalIn 0.3s ease; position:relative; margin:auto 0; }
        .modal-sm { max-width:440px; padding:32px; text-align:center; }
        @keyframes modalIn { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .modal-header h2 { font-size:1.7rem; font-weight:700; color:#0f172a; }
        .close-modal { background:none; border:none; font-size:1.8rem; cursor:pointer; color:#64748b; }
        .form-row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
        .form-col { flex:1; min-width:160px; }
        .form-group { margin-bottom:2px; position:relative; }
        .form-group label { font-size:0.73rem; font-weight:700; text-transform:uppercase; color:#334155; display:flex; align-items:center; gap:5px; margin-bottom:5px; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:12px; font-size:0.88rem; font-family:'Inter',sans-serif; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#1a56db; outline:none; box-shadow:0 0 0 3px rgba(26,86,219,0.08); }
        .notification { position:fixed; top:24px; right:32px; background:#1a1f36; color:white; padding:14px 28px; border-radius:60px; font-weight:500; z-index:3000; box-shadow:0 12px 28px rgba(0,0,0,0.3); display:none; align-items:center; gap:10px; font-size:0.9rem; }
        .notification.error { background:#c2412c; }
        .notification.success { background:#2c6e49; }
        .btn-outline { background:transparent; border:1.5px solid #cbd5e1; color:#1e293b; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; transition:0.25s; display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; }
        .btn-solid { background:#1a56db; border:none; color:white; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; transition:0.25s; display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; }
        .btn-solid:hover { background:#1340a0; }
        .filtros { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
        .filtros select, .filtros input, .filtros button { padding:8px 14px; border-radius:30px; border:1.5px solid #e2e8f0; font-family:'Inter',sans-serif; background:white; font-size:0.84rem; }
        .filtros button { background:#1a56db; color:white; border:none; cursor:pointer; font-weight:600; }
        .filtro-group { display:flex; align-items:center; gap:6px; background:#f8fafc; padding:4px 14px; border-radius:30px; border:1px solid #e2e8f0; }
        .filtro-group label { font-size:0.8rem; font-weight:600; color:#475569; white-space:nowrap; }
        .btn-add-phone { background:#e0f2fe; color:#0369a1; border:none; padding:8px 14px; border-radius:20px; cursor:pointer; font-size:0.8rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
        .phone-input-row { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
        .phone-input-row input { flex:1; }
        .phone-input-row input.tag-input { flex:0 0 100px; }
        .btn-remove-phone { background:#fee2e2; color:#991b1b; border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:0.8rem; display:inline-flex; align-items:center; justify-content:center; }
        .gps-input-row { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
        .gps-input-row input { flex:1; }
        .gps-input-row input.tag-input { flex:0 0 110px; }
        .btn-gps-location { background:none; border:none; color:#1a56db; cursor:pointer; font-size:1rem; }
        .info-banner { background:#f0f9ff; border:1px solid #bae6fd; border-radius:16px; padding:14px 20px; margin-bottom:20px; font-size:0.85rem; color:#0369a1; display:flex; align-items:flex-start; gap:10px; }
        .confirm-buttons { display:flex; gap:12px; justify-content:center; margin-top:24px; }
        .tooltip-trigger { position:relative; display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; border-radius:50%; background:#cbd5e1; color:white; font-size:0.65rem; font-weight:700; cursor:help; }
        #tooltip-global { position:fixed; background:#0f172a; color:#f1f5f9; padding:10px 16px; border-radius:12px; font-size:0.76rem; white-space:normal; width:320px; max-width:90vw; line-height:1.5; box-shadow:0 12px 28px rgba(0,0,0,0.25); z-index:5000; pointer-events:none; opacity:0; visibility:hidden; transition:opacity 0.2s; }
        #tooltip-global.visible { opacity:1; visibility:visible; }
    </style>
</head>
<body>
    <div class="container" id="clientes-container"></div>

    <!-- Modal Confirmación -->
    <div class="modal-overlay" id="modal-confirm">
        <div class="modal modal-sm">
            <div class="modal-header" style="justify-content:center;"><h2 id="confirm-titulo">Confirmar acción</h2></div>
            <p id="confirm-mensaje" style="color:#475569; font-size:0.95rem; margin-bottom:8px;"></p>
            <div class="confirm-buttons">
                <button class="btn-outline" onclick="cerrarModalConfirm(false)">Cancelar</button>
                <button class="btn-solid" style="background:#c2412c;" onclick="cerrarModalConfirm(true)">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal Cliente -->
    <div class="modal-overlay" id="modal-cliente">
        <div class="modal">
            <div class="modal-header">
                <h2 id="titulo-modal-cliente">Nuevo Cliente</h2>
                <button class="close-modal" onclick="cerrarModalCliente()">&times;</button>
            </div>
            <form id="form-cliente" autocomplete="off">
                <input type="hidden" id="cliente-id">
                <div class="info-banner"><i class="fas fa-info-circle"></i> Complete primero el <strong>País</strong> para configurar documentos y moneda.</div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>País</label><input id="cli-pais" list="cli-paises-list" autocomplete="off" oninput="capitalizarInput(this)"><datalist id="cli-paises-list"></datalist></div></div>
                    <div class="form-col"><div class="form-group"><label>Tipo Persona</label><select id="cli-tipo-persona" onchange="toggleClientePersona()"><option value="natural">Persona Natural</option><option value="juridica">Persona Jurídica</option></select></div></div>
                </div>
                <div class="form-row" id="row-cli-natural">
                    <div class="form-col"><div class="form-group"><label>Nombres</label><input id="cli-nombres" oninput="capitalizarInput(this)"></div></div>
                    <div class="form-col"><div class="form-group"><label>Apellido Paterno</label><input id="cli-ap" oninput="capitalizarInput(this)"></div></div>
                    <div class="form-col"><div class="form-group"><label>Apellido Materno</label><input id="cli-am" oninput="capitalizarInput(this)"></div></div>
                </div>
                <div class="form-row" id="row-cli-juridica" style="display:none;">
                    <div class="form-col"><div class="form-group"><label>Razón Social *</label><input id="cli-razon-social" oninput="capitalizarInput(this)"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Nombre Comercial</label><input id="cli-nombre-comercial" oninput="capitalizarInput(this)"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Tipo Documento</label><select id="cli-tipo-doc"></select></div></div>
                    <div class="form-col"><div class="form-group"><label>Número Documento</label><input id="cli-num-doc"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Email</label><input id="cli-email" type="email"></div></div>
                    <div class="form-col"><div class="form-group"><label>Teléfonos</label>
                        <div id="cli-telefonos-container"></div>
                        <button type="button" class="btn-add-phone" onclick="agregarTelefonoCliente()" style="margin-top:8px;"><i class="fas fa-plus"></i> Agregar teléfono</button>
                    </div></div>
                    <div class="form-col"><div class="form-group"><label>Dirección</label><input id="cli-direccion" oninput="capitalizarInput(this)"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Coordenadas GPS de Entrega *</label>
                        <div id="gps-entrega-container"></div>
                        <button type="button" class="btn-add-phone" onclick="agregarPuntoGPS()" style="margin-top:8px;"><i class="fas fa-plus"></i> Agregar punto GPS</button>
                    </div></div>
                    <div class="form-col"><div class="form-group"><label>Estado / Provincia</label><input id="cli-estado" list="cli-estados-list" autocomplete="off"><datalist id="cli-estados-list"></datalist></div></div>
                    <div class="form-col"><div class="form-group"><label>Ciudad</label><input id="cli-ciudad" list="cli-ciudades-list" autocomplete="off" oninput="capitalizarInput(this)"><datalist id="cli-ciudades-list"></datalist></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Tipo Cliente</label><select id="cli-tipo-cliente"><option value="">Seleccione...</option></select></div></div>
                    <div class="form-col"><div class="form-group"><label>Segmento Mercado</label><select id="cli-segmento"><option value="">Seleccione...</option></select></div></div>
                    <div class="form-col"><div class="form-group"><label>Canal Venta</label><select id="cli-canal"><option value="">Seleccione...</option></select></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Límite Crédito</label><input id="cli-limite-credito" type="number" step="0.01" min="0"></div></div>
                    <div class="form-col"><div class="form-group"><label>Moneda Crédito</label><input id="cli-moneda-credito" list="monedas-global-list-cli"><datalist id="monedas-global-list-cli"></datalist></div></div>
                    <div class="form-col"><div class="form-group"><label>Días Crédito</label><input id="cli-dias-credito" type="number" step="1" min="0"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Vendedor Asignado</label><select id="cli-vendedor"><option value="">Sin asignar</option></select></div></div>
                    <div class="form-col"><div class="form-group"><label>Imagen</label><input type="file" id="file-cli-imagen" accept="image/*"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Lista de Precios Especiales</label><textarea id="cli-lista-precios" rows="2" placeholder="Producto: SKU-001, Precio: 9.99"></textarea></div></div>
                </div>
                <div style="margin-top:16px; display:flex; gap:12px; justify-content:flex-end;">
                    <button type="button" class="btn-outline" onclick="cerrarModalCliente()">Cancelar</button>
                    <button type="submit" class="btn-solid"><i class="fas fa-save"></i> Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="notification" class="notification"><i class="fas fa-circle-info"></i><span></span></div>
    <div id="tooltip-global"></div>

    <script>
        const SUPABASE_URL = 'https://zgzwhyywkervutpvazqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aE2X3gv4CE110VzI4uoT-Q_yo4Xv6Zb';
        const STORAGE_BUCKET = 'empresas';
        const GEO_API_BASE = 'https://city-state-country.vercel.app';
        let currentUser = null, empresaMonedaCodigo = 'USD', empresaPais = '';
        let paisesData = [], todasLasMonedas = [];
        let confirmCallback = null;

        const TIPOS_CLIENTE = ['Distribuidor','Mayorista','Minorista','Mayorista-Distribuidor','Cuenta Clave (Key Account)','Institucional','HORECA','Consumidor Final','E-commerce (Marketplace)'];
        const SEGMENTOS_MERCADO = ['Moderno – Hipermercado','Moderno – Supermercado','Moderno – Discount','Moderno – Conveniencia','Tradicional – Tienda de barrio','Tradicional – Canal Mayorista','Industrial / B2B','Institucional','HORECA','Digital'];
        const CANALES_VENTA = ['Venta Directa – Fuerza Propia','Venta Directa – Preventa','Venta Directa – Autoventa','Distribuidor Exclusivo','Televenta','E-commerce B2B','E-commerce B2C','Mayorista / Cash & Carry','Retail Moderno'];
        const tiposDocPorPais = { 'Bolivia':['CI','Pasaporte','NIT'], 'Argentina':['DNI','Pasaporte','CUIT'], 'Perú':['DNI','Pasaporte','RUC'], 'Chile':['RUN','Pasaporte','RUT'], 'Colombia':['CC','Pasaporte','NIT'], 'Ecuador':['CI','Pasaporte','RUC'], 'Paraguay':['CI','Pasaporte','RUC'], 'Uruguay':['CI','Pasaporte','RUT'], 'México':['INE','Pasaporte','RFC'], 'España':['DNI','Pasaporte','NIE'], 'Estados Unidos':['Pasaporte','SSN','Driver License'] };
        const PAISES_ESTATICOS = [
            { name: { common: 'Bolivia' }, currencies: { BOB: { name: 'Boliviano', symbol: 'Bs.' } } },
            // ... lista completa (incluir la misma del original)
        ];

        function capitalizarInput(el) { let val=el.value, pos=el.selectionStart; val=val.replace(/(?:^|\s)(\p{L})/gu,(m,p)=>m.toUpperCase()); el.value=val; el.setSelectionRange(pos,pos); }
        function verificarSesion() { const s=sessionStorage.getItem('currentUser'); if(!s){window.location.href='login.html';return;} currentUser=JSON.parse(s); if(currentUser.rol!=='Supervisor Senior' && currentUser.rol!=='Director General' && currentUser.rol!=='Director Financiero'){sessionStorage.removeItem('currentUser');window.location.href='login.html';} }
        function showNotification(m,t='success'){const n=document.getElementById('notification');n.querySelector('span').innerText=m;n.className=`notification ${t}`;n.style.display='flex';setTimeout(()=>n.style.display='none',4500);}
        function mostrarConfirmacion(mensaje,titulo,callback){document.getElementById('confirm-mensaje').innerText=mensaje;document.getElementById('confirm-titulo').innerText=titulo||'Confirmar acción';document.getElementById('modal-confirm').classList.add('active');confirmCallback=callback;}
        function cerrarModalConfirm(resultado){document.getElementById('modal-confirm').classList.remove('active');if(confirmCallback&&resultado)confirmCallback();confirmCallback=null;}
        async function apiFetch(endpoint,method='GET',body=null){const headers={'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`};if(method==='POST'||method==='PATCH')headers['Prefer']='return=representation';const opts={method,headers};if(body)opts.body=JSON.stringify(body);const res=await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`,opts);if(!res.ok){const e=await res.text();throw new Error(e);}const txt=await res.text();return txt?JSON.parse(txt):{};}
        async function uploadFile(file,folder){const name=`${folder}/${Date.now()}-${file.name}`;const fd=new FormData();fd.append('',file);const res=await fetch(`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${name}`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`},body:fd});if(!res.ok)throw new Error('Error al subir');return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${name}`;}
        function extraerCodigo(v){return(v.split(' - ')[0]||'').trim().toUpperCase();}
        function monedaPorDefecto(){const mon=todasLasMonedas.find(m=>m.codigo===empresaMonedaCodigo);return mon?`${mon.codigo} - ${mon.nombre}`:empresaMonedaCodigo;}
        function initTooltips(){const tooltip=document.getElementById('tooltip-global');document.querySelectorAll('.tooltip-trigger').forEach(trigger=>{trigger.addEventListener('mouseenter',function(e){const text=this.getAttribute('data-tooltip');if(!text)return;tooltip.textContent=text;tooltip.classList.add('visible');});trigger.addEventListener('mouseleave',()=>tooltip.classList.remove('visible'));trigger.addEventListener('mousemove',function(e){tooltip.style.left=e.clientX-160+'px';tooltip.style.top=e.clientY-10-tooltip.offsetHeight+'px';});});}

        async function ensureCurrency(input){const cod=extraerCodigo(input);if(!cod)throw new Error('Moneda inválida');const exist=await apiFetch(`monedas?codigo=eq.${encodeURIComponent(cod)}&select=id`);if(exist.length)return exist[0].id;const data=todasLasMonedas.find(m=>m.codigo===cod)||{nombre:cod,symbol:null};const nueva=await apiFetch('monedas','POST',{codigo:cod,nombre:data.nombre,simbolo:data.symbol});return Array.isArray(nueva)?nueva[0].id:nueva.id;}
        async function ensureUnidadMedida(nombre){if(!nombre||!nombre.trim())return null;const nm=nombre.trim();const exist=await apiFetch(`unidades_medida?nombre=eq.${encodeURIComponent(nm)}&select=id`);if(exist.length)return exist[0].id;const nueva=await apiFetch('unidades_medida','POST',{nombre:nm,codigo:nm.substring(0,20),abreviacion:nm.substring(0,10)});return Array.isArray(nueva)?nueva[0].id:nueva.id;}

        function jsonATelefonosDesdeInputs(containerSelector){const rows=document.querySelectorAll(containerSelector+' .phone-input-row');const tels=[];rows.forEach(row=>{const tagInput=row.querySelector('input.tag-input');const numInput=row.querySelector('input:not(.tag-input)');const etiqueta=tagInput?tagInput.value.trim():'';const numero=numInput?numInput.value.trim():'';if(numero||etiqueta)tels.push({etiqueta,numero});});return tels;}
        function jsonACoordenadasDesdeInputs(){const rows=document.querySelectorAll('#gps-entrega-container .gps-input-row');const coords=[];rows.forEach(row=>{const tagInput=row.querySelector('input.tag-input');const coordInput=row.querySelector('input:not(.tag-input)');const etiqueta=tagInput?tagInput.value.trim():'';const coordenadas=coordInput?coordInput.value.trim():'';if(coordenadas||etiqueta)coords.push({etiqueta,coordenadas});});return coords;}
        function llenarInputsTelefonoDesdeJson(containerSelector,telefonos){const container=document.querySelector(containerSelector);if(!container)return;container.innerHTML='';const lista=Array.isArray(telefonos)?telefonos:[];if(!lista.length)lista.push({etiqueta:'',numero:''});lista.forEach(item=>{let etiqueta='',numero='';if(typeof item==='string'){numero=item;}else if(item&&typeof item==='object'){etiqueta=item.etiqueta||'';numero=item.numero||'';}const row=document.createElement('div');row.className='phone-input-row';const tagInp=document.createElement('input');tagInp.type='text';tagInp.className='tag-input';tagInp.placeholder='Etiqueta';tagInp.value=etiqueta;tagInp.addEventListener('input',function(){capitalizarInput(this);});const numInp=document.createElement('input');numInp.type='text';numInp.placeholder='555-1234';numInp.value=numero;row.appendChild(tagInp);row.appendChild(numInp);container.appendChild(row);});actualizarEstadoTelefonos(containerSelector);}
        function llenarCoordenadasGPSDesdeArray(coordenadas){const container=document.getElementById('gps-entrega-container');if(!container)return;container.innerHTML='';const lista=Array.isArray(coordenadas)?coordenadas:[];if(!lista.length)lista.push({etiqueta:'',coordenadas:''});lista.forEach(item=>{let etiqueta='',coord='';if(typeof item==='string'){coord=item;}else if(item&&typeof item==='object'){etiqueta=item.etiqueta||'';coord=item.coordenadas||'';}const row=document.createElement('div');row.className='gps-input-row';const tagInp=document.createElement('input');tagInp.type='text';tagInp.className='tag-input';tagInp.placeholder='Ej: Tienda';tagInp.value=etiqueta;tagInp.addEventListener('input',function(){capitalizarInput(this);});const coordInp=document.createElement('input');coordInp.type='text';coordInp.placeholder='lat, lng';coordInp.value=coord;const gpsBtn=document.createElement('button');gpsBtn.type='button';gpsBtn.className='btn-gps-location';gpsBtn.innerHTML='<i class="fas fa-map-marker-alt"></i>';gpsBtn.title='Usar ubicación actual';gpsBtn.onclick=function(){obtenerUbicacionGPSInput(coordInp);};row.appendChild(tagInp);row.appendChild(coordInp);row.appendChild(gpsBtn);container.appendChild(row);});actualizarEstadoGPS();}
        function agregarTelefonoGenerico(containerSelector){const container=document.querySelector(containerSelector);if(!container)return;const row=document.createElement('div');row.className='phone-input-row';const tagInp=document.createElement('input');tagInp.type='text';tagInp.className='tag-input';tagInp.placeholder='Etiqueta';tagInp.addEventListener('input',function(){capitalizarInput(this);});const numInp=document.createElement('input');numInp.type='text';numInp.placeholder='555-1234';row.appendChild(tagInp);row.appendChild(numInp);container.appendChild(row);actualizarEstadoTelefonos(containerSelector);}
        function agregarTelefonoCliente(){agregarTelefonoGenerico('#cli-telefonos-container');}
        function agregarPuntoGPS(){const container=document.getElementById('gps-entrega-container');if(!container)return;const row=document.createElement('div');row.className='gps-input-row';const tagInp=document.createElement('input');tagInp.type='text';tagInp.className='tag-input';tagInp.placeholder='Ej: Tienda';tagInp.addEventListener('input',function(){capitalizarInput(this);});const coordInp=document.createElement('input');coordInp.type='text';coordInp.placeholder='lat, lng';const gpsBtn=document.createElement('button');gpsBtn.type='button';gpsBtn.className='btn-gps-location';gpsBtn.innerHTML='<i class="fas fa-map-marker-alt"></i>';gpsBtn.onclick=function(){obtenerUbicacionGPSInput(coordInp);};row.appendChild(tagInp);row.appendChild(coordInp);row.appendChild(gpsBtn);container.appendChild(row);actualizarEstadoGPS();}
        function obtenerUbicacionGPSInput(inputElement){if(!navigator.geolocation){showNotification('Geolocalización no soportada.','error');return;}navigator.geolocation.getCurrentPosition(pos=>{inputElement.value=`${pos.coords.latitude}, ${pos.coords.longitude}`;showNotification('Coordenadas actualizadas.');},()=>showNotification('No se pudo obtener la ubicación.','error'));}
        function actualizarEstadoTelefonos(containerSelector){const container=document.querySelector(containerSelector);if(!container)return;const filas=container.querySelectorAll('.phone-input-row');filas.forEach(fila=>{const existingBtn=fila.querySelector('.btn-remove-phone');if(filas.length===1&&existingBtn)existingBtn.remove();else if(filas.length>1&&!existingBtn){const btn=document.createElement('button');btn.type='button';btn.className='btn-remove-phone';btn.innerHTML='<i class="fas fa-minus"></i>';btn.title='Eliminar';btn.onclick=function(){fila.remove();actualizarEstadoTelefonos(containerSelector);};fila.appendChild(btn);}});}
        function actualizarEstadoGPS(){const container=document.getElementById('gps-entrega-container');if(!container)return;const filas=container.querySelectorAll('.gps-input-row');filas.forEach(fila=>{const existingBtn=fila.querySelector('.btn-remove-phone');if(filas.length===1&&existingBtn)existingBtn.remove();else if(filas.length>1&&!existingBtn){const btn=document.createElement('button');btn.type='button';btn.className='btn-remove-phone';btn.innerHTML='<i class="fas fa-minus"></i>';btn.title='Eliminar';btn.onclick=function(){fila.remove();actualizarEstadoGPS();};fila.appendChild(btn);}});}
        function toggleClientePersona(){const tipo=document.getElementById('cli-tipo-persona').value;document.getElementById('row-cli-natural').style.display=tipo==='natural'?'flex':'none';document.getElementById('row-cli-juridica').style.display=tipo==='juridica'?'flex':'none';}

        async function buscarPaisId(nombre){try{const r=await fetch(`${GEO_API_BASE}/countries/search/${encodeURIComponent(nombre)}`);if(!r.ok)return null;const d=await r.json();return d.length?d[0].id:null;}catch{return null;}}
        async function cargarEstados(paisNombre,datalistId){const dl=document.getElementById(datalistId);if(!dl)return;dl.innerHTML='';const id=await buscarPaisId(paisNombre);if(!id)return;const r=await fetch(`${GEO_API_BASE}/countries/${id}/states`);if(!r.ok)return;const estados=await r.json();estados.forEach(e=>{const o=document.createElement('option');o.value=e.name;dl.appendChild(o);});}
        async function cargarCiudades(paisNombre,estadoNombre,datalistId){const dl=document.getElementById(datalistId);if(!dl)return;dl.innerHTML='';const paisId=await buscarPaisId(paisNombre);if(!paisId)return;const r=await fetch(`${GEO_API_BASE}/countries/${paisId}/states`);if(!r.ok)return;const estados=await r.json();const est=estados.find(e=>e.name.toLowerCase()===estadoNombre.toLowerCase());if(!est)return;const c=await fetch(`${GEO_API_BASE}/states/${est.id}/cities`);if(!c.ok)return;const cities=await c.json();cities.forEach(city=>{const o=document.createElement('option');o.value=city.name;dl.appendChild(o);});}
        function actualizarSelectTiposDocumento(pais,selectId){const sel=document.getElementById(selectId);if(!sel)return;sel.innerHTML='';const clave=Object.keys(tiposDocPorPais).find(k=>k.toLowerCase()===pais.toLowerCase());const tipos=clave?tiposDocPorPais[clave]:['CI','Pasaporte','DNI','RUC','NIT'];tipos.forEach(codigo=>{const o=document.createElement('option');o.value=codigo;o.text=codigo;sel.appendChild(o);});}

        async function llenarSelectVendedores(selectId, vendedorSeleccionado = '') {
            if(!currentUser||!currentUser.empresa_id)return;
            const sel=document.getElementById(selectId);if(!sel)return;
            sel.innerHTML='<option value="">Sin asignar</option>';
            const comerciales=await apiFetch(`usuarios?empresa_id=eq.${currentUser.empresa_id}&rol=eq.${encodeURIComponent('"Ejecutivo Comercial"')}&select=email&limit=1000`);
            const emails=comerciales.map(u=>u.email.toLowerCase());
            const emps=await apiFetch(`empleados?empresa_id=eq.${currentUser.empresa_id}&activo=eq.true&select=id,nombres,apellido_paterno,email&limit=1000`);
            const filtrados=emps.filter(e=>emails.includes((e.email||'').toLowerCase()));
            filtrados.forEach(e=>{const o=document.createElement('option');o.value=e.id;o.text=`${e.nombres} ${e.apellido_paterno}`;if(e.id===vendedorSeleccionado)o.selected=true;sel.appendChild(o);});
        }

        async function cargarClientes(vendedorId='', filtroTipo='', filtroSegmento='', filtroCanal='', estadoFiltro='true'){
            if(!currentUser||!currentUser.empresa_id)return;
            const empId=currentUser.empresa_id;
            let query=`clientes?empresa_id=eq.${empId}&select=*&limit=1000`;
            if(estadoFiltro==='true') query+=`&activo=eq.true`;
            else if(estadoFiltro==='false') query+=`&activo=eq.false`;
            if(vendedorId) query+=`&vendedor_asignado_id=eq.${vendedorId}`;
            if(filtroTipo) query+=`&tipo_cliente=eq.${encodeURIComponent(filtroTipo)}`;
            if(filtroSegmento) query+=`&segmento_mercado=eq.${encodeURIComponent(filtroSegmento)}`;
            if(filtroCanal) query+=`&canal_venta=eq.${encodeURIComponent(filtroCanal)}`;
            const clientes=await apiFetch(query);
            const vendedores=await apiFetch(`empleados?empresa_id=eq.${empId}&select=id,nombres,apellido_paterno&activo=eq.true&limit=1000`);
            const vendedorMap={}; vendedores.forEach(v=>vendedorMap[v.id]=v.nombres+' '+v.apellido_paterno);
            let filas='';
            clientes.forEach(c=>{
                const nombreMostrar=c.razon_social||(c.nombres||'')+' '+(c.apellido_paterno||'');
                const gpsCount=Array.isArray(c.direcciones_entrega)?c.direcciones_entrega.length:0;
                const estadoBadge=c.activo?'<span class="badge badge-success">Activo</span>':'<span class="badge badge-danger">Inactivo</span>';
                const acciones=c.activo
                    ?`<button class="btn-sm btn-edit" onclick="editarCliente('${c.id}')"><i class="fas fa-edit"></i></button><button class="btn-sm btn-delete" onclick="eliminarCliente('${c.id}')"><i class="fas fa-ban"></i></button><button class="btn-sm btn-remove-permanent" onclick="eliminarDefinitivamenteCliente('${c.id}')"><i class="fas fa-trash-alt"></i></button>`
                    :`<button class="btn-sm btn-activate" onclick="activarCliente('${c.id}')"><i class="fas fa-check"></i> Activar</button><button class="btn-sm btn-remove-permanent" onclick="eliminarDefinitivamenteCliente('${c.id}')"><i class="fas fa-trash-alt"></i></button>`;
                filas+=`<tr><td>${nombreMostrar.trim()||'-'}</td><td>${c.nombre_comercial||'-'}</td><td>${c.email||'-'}</td><td>${c.ciudad||'-'}, ${c.pais||'-'}</td><td>${c.tipo_cliente||'-'}</td><td>${c.segmento_mercado||'-'}</td><td>${c.canal_venta||'-'}</td><td>${gpsCount>0?`<i class="fas fa-map-marker-alt" style="color:#1a56db;"></i> ${gpsCount}`:'-'}</td><td>${c.vendedor_asignado_id?(vendedorMap[c.vendedor_asignado_id]||'Asignado'):'Sin asignar'}</td><td>${estadoBadge}</td><td class="action-buttons">${acciones}</td></tr>`;
            });
            if(!filas) filas='<tr><td colspan="11" style="text-align:center;">No se encontraron clientes.</td></tr>';
            document.getElementById('clientes-container').innerHTML=`
            <div class="card"><div class="card-header"><h2>Clientes</h2><button class="btn-solid" onclick="abrirModalCliente()"><i class="fas fa-plus"></i> Nuevo Cliente</button></div>
            <div class="filtros"><div class="filtro-group"><label>Vendedor:</label><select id="filtro-vendedor-clientes" onchange="aplicarFiltrosClientes()"><option value="">Todos</option></select></div>
            <div class="filtro-group"><label>Estado:</label><select id="filtro-estado-clientes" onchange="aplicarFiltrosClientes()"><option value="true" ${estadoFiltro==='true'?'selected':''}>Activos</option><option value="false" ${estadoFiltro==='false'?'selected':''}>Inactivos</option><option value="all" ${estadoFiltro==='all'?'selected':''}>Todos</option></select></div>
            <div class="filtro-group"><label>Tipo:</label><select id="filtro-tipo-cliente" onchange="aplicarFiltrosClientes()"><option value="">Todos</option></select></div>
            <div class="filtro-group"><label>Segmento:</label><select id="filtro-segmento-cliente" onchange="aplicarFiltrosClientes()"><option value="">Todos</option></select></div>
            <div class="filtro-group"><label>Canal:</label><select id="filtro-canal-cliente" onchange="aplicarFiltrosClientes()"><option value="">Todos</option></select></div></div>
            <div class="table-wrapper"><table><thead><tr><th>Razón Social / Nombre</th><th>Nombre Comercial</th><th>Email</th><th>Ubicación</th><th>Tipo</th><th>Segmento</th><th>Canal</th><th>GPS</th><th>Vendedor</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${filas}</tbody></table></div></div>`;
            const selVend=document.getElementById('filtro-vendedor-clientes'); vendedores.forEach(v=>{const o=document.createElement('option');o.value=v.id;o.text=v.nombres+' '+v.apellido_paterno;if(v.id===vendedorId)o.selected=true;selVend.appendChild(o);});
            const tipos=[...new Set(clientes.map(c=>c.tipo_cliente).filter(Boolean))].sort();
            const segs=[...new Set(clientes.map(c=>c.segmento_mercado).filter(Boolean))].sort();
            const canales=[...new Set(clientes.map(c=>c.canal_venta).filter(Boolean))].sort();
            ['filtro-tipo-cliente','filtro-segmento-cliente','filtro-canal-cliente'].forEach((id,i)=>{
                const sel=document.getElementById(id), arr=[tipos,segs,canales][i], val=[filtroTipo,filtroSegmento,filtroCanal][i];
                arr.forEach(v=>{const o=document.createElement('option');o.value=v;o.text=v;if(v===val)o.selected=true;sel.appendChild(o);});
            });
            initTooltips();
        }
        function aplicarFiltrosClientes(){
            const estado=document.getElementById('filtro-estado-clientes')?.value||'true';
            cargarClientes(document.getElementById('filtro-vendedor-clientes')?.value||'', document.getElementById('filtro-tipo-cliente')?.value||'', document.getElementById('filtro-segmento-cliente')?.value||'', document.getElementById('filtro-canal-cliente')?.value||'', estado);
        }
        function activarCliente(id){mostrarConfirmacion('¿Activar cliente?','Activar Cliente',async()=>{await apiFetch(`clientes?id=eq.${id}`,'PATCH',{activo:true});aplicarFiltrosClientes();showNotification('Cliente activado');});}

        function abrirModalCliente(id=null){
            document.getElementById('modal-cliente').classList.add('active');
            document.getElementById('form-cliente').reset();document.getElementById('cliente-id').value='';
            document.getElementById('titulo-modal-cliente').textContent='Nuevo Cliente';
            document.getElementById('cli-tipo-persona').value='natural';document.getElementById('cli-moneda-credito').value=monedaPorDefecto();
            document.getElementById('cli-pais').value=empresaPais;
            if(empresaPais){actualizarSelectTiposDocumento(empresaPais,'cli-tipo-doc');}
            llenarInputsTelefonoDesdeJson('#cli-telefonos-container',[{etiqueta:'',numero:''}]);
            llenarCoordenadasGPSDesdeArray([{etiqueta:'',coordenadas:''}]);
            toggleClientePersona(); llenarSelectVendedores('cli-vendedor');
            if(id) editarCliente(id); initTooltips();
        }
        function cerrarModalCliente(){document.getElementById('modal-cliente').classList.remove('active');}

        async function editarCliente(id){
            const c=await apiFetch(`clientes?id=eq.${id}&select=*`);if(!c.length)return;
            const cli=c[0];
            document.getElementById('cliente-id').value=cli.id;
            document.getElementById('cli-tipo-persona').value=cli.razon_social?'juridica':'natural';toggleClientePersona();
            document.getElementById('cli-pais').value=cli.pais||empresaPais;
            document.getElementById('cli-tipo-doc').value=cli.tipo_documento||'';document.getElementById('cli-num-doc').value=cli.numero_documento||'';
            document.getElementById('cli-nombres').value=cli.nombres||'';document.getElementById('cli-ap').value=cli.apellido_paterno||'';document.getElementById('cli-am').value=cli.apellido_materno||'';
            document.getElementById('cli-razon-social').value=cli.razon_social||'';
            document.getElementById('cli-nombre-comercial').value=cli.nombre_comercial||'';
            document.getElementById('cli-email').value=cli.email||'';document.getElementById('cli-direccion').value=cli.direccion||'';
            document.getElementById('cli-estado').value=cli.estado_provincia||'';document.getElementById('cli-ciudad').value=cli.ciudad||'';
            document.getElementById('cli-tipo-cliente').value=cli.tipo_cliente||'';
            document.getElementById('cli-segmento').value=cli.segmento_mercado||'';
            document.getElementById('cli-canal').value=cli.canal_venta||'';
            document.getElementById('cli-limite-credito').value=cli.limite_credito||'';document.getElementById('cli-dias-credito').value=cli.dias_credito||'';
            document.getElementById('cli-moneda-credito').value=monedaPorDefecto();
            document.getElementById('cli-lista-precios').value=cli.lista_precios?JSON.stringify(cli.lista_precios,null,2):'';
            llenarInputsTelefonoDesdeJson('#cli-telefonos-container',cli.telefonos||[{etiqueta:'',numero:''}]);
            llenarCoordenadasGPSDesdeArray(cli.direcciones_entrega||[{etiqueta:'',coordenadas:''}]);
            if(cli.moneda_credito_id){const mon=await apiFetch(`monedas?id=eq.${cli.moneda_credito_id}&select=codigo,nombre`);if(mon.length)document.getElementById('cli-moneda-credito').value=`${mon[0].codigo} - ${mon[0].nombre}`;}
            await llenarSelectVendedores('cli-vendedor',cli.vendedor_asignado_id||'');
            const paisVal=cli.pais||empresaPais;
            if(paisVal)actualizarSelectTiposDocumento(paisVal,'cli-tipo-doc');
            document.getElementById('titulo-modal-cliente').textContent='Editar Cliente';
            document.getElementById('modal-cliente').classList.add('active');initTooltips();
        }
        function eliminarCliente(id){mostrarConfirmacion('¿Desactivar cliente?','Desactivar Cliente',async()=>{await apiFetch(`clientes?id=eq.${id}`,'PATCH',{activo:false});aplicarFiltrosClientes();showNotification('Cliente desactivado');});}
        function eliminarDefinitivamenteCliente(id){mostrarConfirmacion('¿Eliminar permanentemente?','Eliminar Cliente',async()=>{await apiFetch(`clientes?id=eq.${id}`,'DELETE');aplicarFiltrosClientes();showNotification('Cliente eliminado');});}

        document.getElementById('form-cliente').addEventListener('submit',async function(e){
            e.preventDefault();const id=document.getElementById('cliente-id').value;
            const tipoPersona=document.getElementById('cli-tipo-persona').value;
            const monCreditoId=await ensureCurrency(document.getElementById('cli-moneda-credito').value.trim());
            const gpsArray=jsonACoordenadasDesdeInputs();
            const telefonosArray=jsonATelefonosDesdeInputs('#cli-telefonos-container');
            const payload={
                empresa_id:currentUser.empresa_id,
                tipo_documento:document.getElementById('cli-tipo-doc').value.trim()||null,
                numero_documento:document.getElementById('cli-num-doc').value.trim()||null,
                nombres:tipoPersona==='natural'?document.getElementById('cli-nombres').value.trim():null,
                apellido_paterno:tipoPersona==='natural'?document.getElementById('cli-ap').value.trim():null,
                apellido_materno:tipoPersona==='natural'?document.getElementById('cli-am').value.trim():null,
                razon_social:tipoPersona==='juridica'?document.getElementById('cli-razon-social').value.trim():null,
                nombre_comercial:document.getElementById('cli-nombre-comercial').value.trim()||null,
                email:document.getElementById('cli-email').value.trim()||null,
                telefonos:telefonosArray,
                direccion:document.getElementById('cli-direccion').value.trim()||null,
                direcciones_entrega:gpsArray,
                pais:document.getElementById('cli-pais').value.trim()||null,
                estado_provincia:document.getElementById('cli-estado').value.trim()||null,
                ciudad:document.getElementById('cli-ciudad').value.trim()||null,
                tipo_cliente:document.getElementById('cli-tipo-cliente').value||null,
                segmento_mercado:document.getElementById('cli-segmento').value||null,
                canal_venta:document.getElementById('cli-canal').value||null,
                limite_credito:parseFloat(document.getElementById('cli-limite-credito').value)||null,
                moneda_credito_id:monCreditoId,
                dias_credito:parseInt(document.getElementById('cli-dias-credito').value)||null,
                vendedor_asignado_id:document.getElementById('cli-vendedor').value||null,
                lista_precios:parseJsonSeguro(document.getElementById('cli-lista-precios').value)
            };
            try{const file=document.getElementById('file-cli-imagen').files[0];if(file)payload.imagen=await uploadFile(file,'clientes');}catch{}
            try{
                if(id){delete payload.empresa_id;await apiFetch(`clientes?id=eq.${id}`,'PATCH',payload);}
                else await apiFetch('clientes','POST',payload);
                cerrarModalCliente();aplicarFiltrosClientes();showNotification(id?'Cliente actualizado':'Cliente creado');
            }catch(err){showNotification('Error: '+err.message,'error');}
        });
        function parseJsonSeguro(valor){if(!valor||!valor.trim())return null;try{return JSON.parse(valor);}catch(e){return null;}}

        document.getElementById('cli-pais').addEventListener('input',function(){const val=this.value.trim();if(val.length>1){actualizarSelectTiposDocumento(val,'cli-tipo-doc');}});
        document.getElementById('cli-estado').addEventListener('input',function(){const pais=document.getElementById('cli-pais').value.trim();const est=this.value.trim();if(pais&&est)cargarCiudades(pais,est,'cli-ciudades-list');});

        async function cargarDatosIniciales(){
            paisesData=PAISES_ESTATICOS;
            ['cli-paises-list'].forEach(id=>{const dl=document.getElementById(id);if(!dl)return;dl.innerHTML='';paisesData.forEach(p=>{const o=document.createElement('option');o.value=p.name.common;dl.appendChild(o);});});
            const monSet=new Map();
            paisesData.forEach(p=>{if(p.currencies)Object.entries(p.currencies).forEach(([c,i])=>{if(!monSet.has(c))monSet.set(c,{name:i.name,symbol:i.symbol||''});});});
            todasLasMonedas=Array.from(monSet,([c,d])=>({codigo:c,nombre:d.name,simbolo:d.symbol}));
            try{const bdMonedas=await apiFetch('monedas?select=codigo,nombre,simbolo');bdMonedas.forEach(m=>{if(!todasLasMonedas.find(t=>t.codigo===m.codigo))todasLasMonedas.push({codigo:m.codigo,nombre:m.nombre,simbolo:m.simbolo||''});});}catch(e){}
            ['monedas-global-list-cli'].forEach(id=>{const dl=document.getElementById(id);if(!dl)return;dl.innerHTML='';todasLasMonedas.forEach(m=>{const o=document.createElement('option');o.value=`${m.codigo} - ${m.nombre}`;dl.appendChild(o);});});
            if(currentUser&&currentUser.empresa_id){
                const emp=await apiFetch(`empresas?id=eq.${currentUser.empresa_id}&select=moneda_principal_id,pais`);
                if(emp.length>0){
                    if(emp[0].moneda_principal_id){const mon=await apiFetch(`monedas?id=eq.${emp[0].moneda_principal_id}&select=codigo`);if(mon.length>0)empresaMonedaCodigo=mon[0].codigo;}
                    empresaPais=emp[0].pais||'';
                }
            }
            // Poblar selects fijos
            ['cli-tipo-cliente','cli-segmento','cli-canal'].forEach((id,i)=>{
                const sel=document.getElementById(id);if(!sel)return;sel.innerHTML='<option value="">Seleccione...</option>';
                const arr=[TIPOS_CLIENTE,SEGMENTOS_MERCADO,CANALES_VENTA][i];
                arr.forEach(o=>{const opt=document.createElement('option');opt.value=o;opt.textContent=o;sel.appendChild(opt);});
            });
        }

        window.onload=async function(){
            verificarSesion();
            if(currentUser){
                await cargarDatosIniciales();
                cargarClientes();
            }
        };
    </script>
</body>
</html>
