<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Nexial Suite · Supervisor Senior</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background:#f4f6fb; color:#1a1f36; line-height:1.6; touch-action:manipulation; }
        .navbar { position:fixed; top:0; width:100%; background:rgba(10,15,30,0.94); backdrop-filter:blur(14px); z-index:1000; border-bottom:1px solid rgba(255,255,255,0.05); padding:0 32px; height:72px; display:flex; align-items:center; justify-content:space-between; }
        .logo-area { display:flex; align-items:center; gap:12px; text-decoration:none; }
        .logo-icon { font-size:2.2rem; background:linear-gradient(135deg,#1a56db,#00a3ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 12px rgba(26,86,219,0.6)); animation:subtleGlow 3s ease-in-out infinite alternate; }
        @keyframes subtleGlow { 0%{filter:drop-shadow(0 0 8px rgba(26,86,219,0.4));} 100%{filter:drop-shadow(0 0 18px rgba(0,163,255,0.8));} }
        .logo-text { font-size:1.5rem; font-weight:700; background:linear-gradient(to right,#ffffff,#c0d0f0); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .nav-actions { display:flex; align-items:center; gap:20px; }
        .user-info { display:flex; align-items:center; gap:14px; color:white; padding:8px 20px; border-radius:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(8px); transition:0.25s; }
        .user-info:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.18); }
        .user-icon { font-size:1.6rem; color:#1a56db; filter:drop-shadow(0 0 6px rgba(26,86,219,0.5)); }
        .user-details { display:flex; flex-direction:column; line-height:1.3; }
        .user-name { font-weight:700; font-size:1.15rem; letter-spacing:0.2px; color:#fff; }
        .user-role-badge { font-size:0.7rem; font-weight:600; background:linear-gradient(135deg,#1a56db,#4a8eff); padding:3px 12px; border-radius:20px; text-transform:uppercase; letter-spacing:0.8px; width:fit-content; margin-top:4px; color:#fff; box-shadow:0 2px 8px rgba(26,86,219,0.3); }
        .btn-outline { background:transparent; border:1.5px solid rgba(255,255,255,0.35); color:white; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; transition:0.25s; display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; }
        .btn-outline:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.7); box-shadow:0 0 18px rgba(0,150,255,0.3); }
        .btn-solid { background:#1a56db; border:none; color:white; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; transition:0.25s; display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; }
        .btn-solid:hover { background:#1340a0; box-shadow:0 0 18px rgba(26,86,219,0.5); }
        .btn-icon { background:rgba(255,255,255,0.1); border:none; color:white; width:40px; height:40px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.2rem; transition:0.2s; }
        .btn-icon:hover { background:rgba(255,255,255,0.2); }
        .dashboard-container { margin-top:72px; display:flex; min-height:calc(100vh - 72px); }
        .sidebar { width:260px; background:white; border-right:1px solid #e5e7eb; padding:20px 0; display:flex; flex-direction:column; position:fixed; top:72px; bottom:0; overflow-y:auto; z-index:900; }
        .sidebar-menu { list-style:none; flex:1; }
        .sidebar-menu li { padding:0 16px; margin-bottom:2px; }
        .sidebar-menu a { display:flex; align-items:center; gap:12px; padding:12px 18px; border-radius:12px; color:#475569; font-weight:500; font-size:0.9rem; text-decoration:none; transition:0.2s; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background:#f1f5f9; color:#1a56db; font-weight:600; }
        .sidebar-menu a i { font-size:1.1rem; width:22px; text-align:center; }
        .sidebar-menu a.external-link i.fa-external-link-alt { font-size:0.7rem; margin-left:auto; opacity:0.5; }
        .main-content { margin-left:260px; flex:1; padding:32px; background:#f4f6fb; }
        .section-panel { display:none; }
        .section-panel.active { display:block; }
        .card { background:white; border-radius:24px; padding:28px; box-shadow:0 4px 20px rgba(0,0,0,0.03); margin-bottom:24px; border:1px solid #f0f2f5; }
        .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:14px; }
        .card-header h2 { font-size:1.4rem; font-weight:700; color:#0f172a; }
        .filtros { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
        .filtros select, .filtros input, .filtros button { padding:8px 14px; border-radius:30px; border:1.5px solid #e2e8f0; font-family:'Inter',sans-serif; background:white; font-size:0.84rem; }
        .filtros button { background:#1a56db; color:white; border:none; cursor:pointer; font-weight:600; }
        .filtros button:hover { background:#1340a0; }
        .filtro-group { display:flex; align-items:center; gap:6px; background:#f8fafc; padding:4px 14px; border-radius:30px; border:1px solid #e2e8f0; }
        .filtro-group label { font-size:0.8rem; font-weight:600; color:#475569; white-space:nowrap; }
        .table-wrapper { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:12px 14px; text-align:left; border-bottom:1px solid #e2e8f0; font-size:0.88rem; }
        th { background:#f8fafc; color:#475569; font-weight:600; text-transform:uppercase; font-size:0.73rem; letter-spacing:0.5px; }
        tr:hover td { background:#f1f5f9; }
        .action-buttons { display:flex; gap:6px; flex-wrap:wrap; align-items:center; position:relative; overflow:visible; }
        .btn-sm { padding:6px 12px; border-radius:18px; font-size:0.78rem; font-weight:600; border:none; cursor:pointer; font-family:'Inter',sans-serif; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
        .btn-edit { background:#e0f2fe; color:#0369a1; }
        .btn-delete { background:#fee2e2; color:#991b1b; }
        .btn-activate { background:#dcfce7; color:#166534; }
        .btn-remove-permanent { background:#ffedd5; color:#9a3412; }
        .btn-edit:hover { background:#bae6fd; }
        .btn-delete:hover { background:#fecaca; }
        .btn-activate:hover { background:#bbf7d0; }
        .btn-remove-permanent:hover { background:#fed7aa; }
        .btn-add-phone { background:#e0f2fe; color:#0369a1; border:none; padding:8px 14px; border-radius:20px; cursor:pointer; font-size:0.8rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition:0.2s; font-family:'Inter',sans-serif; }
        .btn-add-phone:hover { background:#bae6fd; }
        .btn-remove-phone { background:#fee2e2; color:#991b1b; border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:0.8rem; display:inline-flex; align-items:center; justify-content:center; transition:0.2s; flex-shrink:0; }
        .btn-remove-phone:hover { background:#fecaca; }
        .phone-input-row { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
        .phone-input-row input { flex:1; }
        .phone-input-row input.tag-input { flex:0 0 100px; }
        .gps-input-row { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
        .gps-input-row input { flex:1; }
        .gps-input-row input.tag-input { flex:0 0 110px; }
        .btn-gps-location { background:none; border:none; color:#1a56db; cursor:pointer; font-size:1rem; transition:0.2s; padding:4px; }
        .btn-gps-location:hover { color:#1340a0; transform:scale(1.2); }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(2,6,18,0.8); backdrop-filter:blur(8px); z-index:2000; display:none; align-items:flex-start; justify-content:center; padding:24px; overflow-y:auto; }
        .modal-overlay.active { display:flex; }
        .modal { background:white; border-radius:28px; padding:36px 32px; max-width:1050px; width:100%; box-shadow:0 30px 60px rgba(0,0,0,0.4); animation:modalIn 0.3s ease; position:relative; margin:auto 0; }
        .modal-sm { max-width:440px; padding:32px; text-align:center; }
        @keyframes modalIn { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .modal-header h2 { font-size:1.7rem; font-weight:700; color:#0f172a; }
        .close-modal { background:none; border:none; font-size:1.8rem; cursor:pointer; color:#64748b; }
        .form-row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
        .form-col { flex:1; min-width:160px; }
        .form-group { margin-bottom:2px; position:relative; }
        .form-group label { font-size:0.73rem; font-weight:700; text-transform:uppercase; color:#334155; display:flex; align-items:center; gap:5px; margin-bottom:5px; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:12px; font-size:0.88rem; font-family:'Inter',sans-serif; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#1a56db; outline:none; box-shadow:0 0 0 3px rgba(26,86,219,0.08); }
        .form-group textarea { resize:vertical; min-height:60px; }
        .notification { position:fixed; top:24px; right:32px; background:#1a1f36; color:white; padding:14px 28px; border-radius:60px; font-weight:500; z-index:3000; box-shadow:0 12px 28px rgba(0,0,0,0.3); display:none; align-items:center; gap:10px; font-size:0.9rem; }
        .notification.error { background:#c2412c; }
        .notification.success { background:#2c6e49; }
        .badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.7rem; font-weight:600; }
        .badge-success { background:#dcfce7; color:#166534; }
        .badge-danger { background:#fee2e2; color:#991b1b; }
        .tabs-compact { display:flex; gap:4px; margin-bottom:20px; background:#f1f5f9; padding:4px; border-radius:30px; width:fit-content; }
        .tab-btn-compact { padding:8px 20px; border-radius:26px; border:none; background:transparent; font-weight:600; font-size:0.82rem; cursor:pointer; color:#64748b; transition:0.2s; font-family:'Inter',sans-serif; }
        .tab-btn-compact.active { background:white; color:#1a56db; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
        .tooltip-trigger { position:relative; display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; border-radius:50%; background:#cbd5e1; color:white; font-size:0.65rem; font-weight:700; cursor:help; transition:0.2s; flex-shrink:0; }
        .tooltip-trigger:hover { background:#1a56db; transform:scale(1.1); }
        #tooltip-global { position:fixed; background:#0f172a; color:#f1f5f9; padding:10px 16px; border-radius:12px; font-size:0.76rem; font-weight:400; white-space:normal; width:320px; max-width:90vw; text-align:left; line-height:1.5; box-shadow:0 12px 28px rgba(0,0,0,0.25); z-index:5000; pointer-events:none; opacity:0; visibility:hidden; transition:opacity 0.2s ease, visibility 0.2s ease; }
        #tooltip-global.visible { opacity:1; visibility:visible; }
        .chart-container { position:relative; height:400px; width:100%; margin-top:20px; }
        .orden-select { padding:8px 16px; border-radius:30px; border:1.5px solid #e2e8f0; font-family:'Inter',sans-serif; font-size:0.85rem; font-weight:500; background:white; color:#1e293b; cursor:pointer; min-width:200px; }
        .confirm-buttons { display:flex; gap:12px; justify-content:center; margin-top:24px; }
        .info-banner { background:#f0f9ff; border:1px solid #bae6fd; border-radius:16px; padding:14px 20px; margin-bottom:20px; font-size:0.85rem; color:#0369a1; display:flex; align-items:flex-start; gap:10px; }
        .info-banner i { font-size:1.2rem; margin-top:2px; flex-shrink:0; }
        .meta-editable-table input { width:80px; padding:6px 8px; border-radius:8px; border:1px solid #e2e8f0; font-family:'Inter',sans-serif; font-size:0.82rem; }
        .meta-editable-table select { padding:6px 8px; border-radius:8px; border:1px solid #e2e8f0; font-family:'Inter',sans-serif; font-size:0.82rem; width:100px; }
        .meta-editable-table td { vertical-align:middle; }
        .distribucion-stock-info { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:12px; padding:12px 16px; margin-bottom:16px; font-size:0.85rem; }
        @media (max-width:900px) {
            .sidebar { width:100%; height:auto; position:relative; top:auto; bottom:auto; flex-direction:row; overflow-x:auto; padding:8px; border-right:none; border-bottom:1px solid #e2e8f0; }
            .sidebar-menu { display:flex; gap:4px; }
            .sidebar-menu li { padding:0; }
            .sidebar-menu a { padding:8px 14px; font-size:0.78rem; white-space:nowrap; }
            .main-content { margin-left:0; padding:16px; }
            .dashboard-container { flex-direction:column; }
            .navbar { padding:0 12px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo-area">
            <i class="fas fa-brain logo-icon"></i>
            <span class="logo-text">Nexial Suite</span>
        </a>
        <div class="nav-actions">
            <div class="user-info" id="user-display"></div>
            <button class="btn-icon" onclick="recargarTodo()" title="Actualizar datos"><i class="fas fa-sync-alt"></i></button>
            <button class="btn-outline" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
        </div>
    </nav>
    <div class="dashboard-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="#" data-panel="inicio" class="active"><i class="fas fa-home"></i> Inicio</a></li>
                <li><a href="#" data-panel="metas"><i class="fas fa-bullseye"></i> Metas</a></li>
                <li><a href="#" data-panel="stock"><i class="fas fa-boxes"></i> Stock</a></li>
                <li><a href="#" data-panel="clientes"><i class="fas fa-building"></i> Clientes</a></li>
                <li><a href="catalogo.html" class="external-link"><i class="fas fa-box"></i> Catálogo <i class="fas fa-external-link-alt"></i></a></li>
                <li><a href="equipo.html" class="external-link"><i class="fas fa-users"></i> Equipo <i class="fas fa-external-link-alt"></i></a></li>
                <li><a href="asignacion_rutas.html" class="external-link"><i class="fas fa-route"></i> Asignación de rutas <i class="fas fa-external-link-alt"></i></a></li>
                <li><a href="asignacion_carga.html" class="external-link"><i class="fas fa-truck-loading"></i> Asignación de carga <i class="fas fa-external-link-alt"></i></a></li>
            </ul>
        </aside>
        <main class="main-content">
            <section id="panel-inicio" class="section-panel active"></section>
            <section id="panel-metas" class="section-panel"></section>
            <section id="panel-stock" class="section-panel"></section>
            <section id="panel-clientes" class="section-panel"></section>
        </main>
    </div>

    <!-- Confirmación modal -->
    <div class="modal-overlay" id="modal-confirm">
        <div class="modal modal-sm">
            <div class="modal-header" style="justify-content:center;"><h2 id="confirm-titulo">Confirmar acción</h2></div>
            <p id="confirm-mensaje" style="color:#475569; font-size:0.95rem; margin-bottom:8px;"></p>
            <div class="confirm-buttons">
                <button class="btn-outline" style="color:#1e293b; border-color:#cbd5e1;" onclick="cerrarModalConfirm(false)">Cancelar</button>
                <button class="btn-solid" style="background:#c2412c;" id="confirm-btn-ok" onclick="cerrarModalConfirm(true)">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal Cliente -->
    <div class="modal-overlay" id="modal-cliente">
        <div class="modal">
            <div class="modal-header">
                <h2 id="titulo-modal-cliente">Nuevo Cliente</h2>
                <button class="close-modal" onclick="cerrarModalCliente()">&times;</button>
            </div>
            <form id="form-cliente" autocomplete="off">
                <input type="hidden" id="cliente-id">
                <div class="info-banner"><i class="fas fa-info-circle"></i> Complete primero el <strong>País</strong> para configurar documentos y moneda. Los campos Tipo, Segmento y Canal tienen opciones fijas estándar.</div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>País</label><input id="cli-pais" list="cli-paises-list" autocomplete="off" oninput="capitalizarInput(this)"><datalist id="cli-paises-list"></datalist></div></div>
                    <div class="form-col"><div class="form-group"><label>Tipo Persona <span class="tooltip-trigger" data-tooltip="Natural: persona con nombre. Jurídica: empresa con razón social.">?</span></label><select id="cli-tipo-persona" onchange="toggleClientePersona()"><option value="natural">Persona Natural</option><option value="juridica">Persona Jurídica</option></select></div></div>
                </div>
                <div class="form-row" id="row-cli-natural">
                    <div class="form-col"><div class="form-group"><label>Nombres</label><input id="cli-nombres" oninput="capitalizarInput(this)"></div></div>
                    <div class="form-col"><div class="form-group"><label>Apellido Paterno</label><input id="cli-ap" oninput="capitalizarInput(this)"></div></div>
                    <div class="form-col"><div class="form-group"><label>Apellido Materno</label><input id="cli-am" oninput="capitalizarInput(this)"></div></div>
                </div>
                <div class="form-row" id="row-cli-juridica" style="display:none;">
                    <div class="form-col"><div class="form-group"><label>Razón Social *</label><input id="cli-razon-social" oninput="capitalizarInput(this)"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Nombre Comercial <span class="tooltip-trigger" data-tooltip="Nombre del establecimiento o tienda (Ej: Abarrotes Doña Juanita).">?</span></label><input id="cli-nombre-comercial" oninput="capitalizarInput(this)"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Tipo Documento <span class="tooltip-trigger" data-tooltip="Documento de identidad fiscal según país.">?</span></label><select id="cli-tipo-doc"></select></div></div>
                    <div class="form-col"><div class="form-group"><label>Número Documento</label><input id="cli-num-doc"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Email</label><input id="cli-email" type="email"></div></div>
                    <div class="form-col"><div class="form-group"><label>Teléfonos <span class="tooltip-trigger" data-tooltip="Añada números con etiqueta (casa, trabajo...).">?</span></label>
                        <div id="cli-telefonos-container"></div>
                        <button type="button" class="btn-add-phone" onclick="agregarTelefonoCliente()" title="Agregar teléfono" style="margin-top:8px;"><i class="fas fa-plus"></i> Agregar teléfono</button>
                    </div></div>
                    <div class="form-col"><div class="form-group"><label>Dirección</label><input id="cli-direccion" oninput="capitalizarInput(this)"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Coordenadas GPS de Entrega * <span class="tooltip-trigger" data-tooltip="Ingrese coordenadas y etiqueta (Tienda, Almacén). Puede agregar varios puntos.">?</span></label>
                        <div id="gps-entrega-container"></div>
                        <button type="button" class="btn-add-phone" onclick="agregarPuntoGPS()" title="Agregar punto GPS" style="margin-top:8px;"><i class="fas fa-plus"></i> Agregar punto GPS</button>
                    </div></div>
                    <div class="form-col"><div class="form-group"><label>Estado / Provincia</label><input id="cli-estado" list="cli-estados-list" autocomplete="off"><datalist id="cli-estados-list"></datalist></div></div>
                    <div class="form-col"><div class="form-group"><label>Ciudad</label><input id="cli-ciudad" list="cli-ciudades-list" autocomplete="off" oninput="capitalizarInput(this)"><datalist id="cli-ciudades-list"></datalist></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Tipo Cliente <span class="tooltip-trigger" data-tooltip="Rol del cliente en la cadena de suministro:
• Distribuidor: Intermediario que compra para revender a minoristas.
• Mayorista: Compra grandes volúmenes para otros negocios.
• Minorista: Punto de venta al consumidor final.
• Mayorista-Distribuidor: Opera ambos roles.
• Cuenta Clave (Key Account): Cadena estratégica con negociación centralizada.
• Institucional: Hospitales, escuelas, gobierno.
• HORECA: Hoteles, Restaurantes, Cafeterías.
• Consumidor Final: Persona natural (venta directa).
• E-commerce (Marketplace): Plataformas digitales.">?</span></label>
                        <select id="cli-tipo-cliente"><option value="">Seleccione...</option></select></div></div>
                    <div class="form-col"><div class="form-group"><label>Segmento Mercado <span class="tooltip-trigger" data-tooltip="Perfil del cliente según formato comercial:
• Moderno – Hipermercado: Grandes superficies (>2.500 m²).
• Moderno – Supermercado: Medianas superficies (400‑2.500 m²).
• Moderno – Discount: Formato de bajo precio, surtido limitado.
• Moderno – Conveniencia: Tiendas pequeñas, horarios extendidos.
• Tradicional – Tienda de barrio: Autoservicio pequeño.

        async function apiFetch(endpoint, method = 'GET', body = null) {
            const headers = { 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` };
            if (method === 'POST' || method === 'PATCH') headers['Prefer'] = 'return=representation';
            const opts = { method, headers };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, opts);
            if (!res.ok) { const e = await res.text(); throw new Error(e); }
            const txt = await res.text();
            return txt ? JSON.parse(txt) : {};
        }

            if (!res.ok) throw new Error('Error al subir');
            return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${name}`;
        }

        function initTooltips() {
            const tooltip = document.getElementById('tooltip-global');
            document.querySelectorAll('.tooltip-trigger').forEach(trigger => {
                trigger.addEventListener('mouseenter', function(e) {
                    const text = this.getAttribute('data-tooltip'); if (!text) return;
                    tooltip.textContent = text; tooltip.classList.add('visible');
                });
                trigger.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
                trigger.addEventListener('mousemove', function(e) {
                    tooltip.style.left = e.clientX - 160 + 'px';
                    tooltip.style.top = e.clientY - 10 - tooltip.offsetHeight + 'px';
                });
            });
        }

        function extraerCodigo(v) { return (v.split(' - ')[0] || '').trim().toUpperCase(); }

        async function ensureCurrency(input) {
            const cod = extraerCodigo(input); if (!cod) throw new Error('Moneda inválida');
            const exist = await apiFetch(`monedas?codigo=eq.${encodeURIComponent(cod)}&select=id`);
            if (exist.length) return exist[0].id;
            const data = todasLasMonedas.find(m => m.codigo === cod) || { nombre:cod, symbol:null };
            const nueva = await apiFetch('monedas', 'POST', { codigo:cod, nombre:data.nombre, simbolo:data.symbol });
            return Array.isArray(nueva) ? nueva[0].id : nueva.id;
        }

        async function ensureUnidadMedida(nombre) {
            if (!nombre || !nombre.trim()) return null;
            const nm = nombre.trim();
            const exist = await apiFetch(`unidades_medida?nombre=eq.${encodeURIComponent(nm)}&select=id`);
            if (exist.length) return exist[0].id;
            const nueva = await apiFetch('unidades_medida', 'POST', { nombre:nm, codigo:nm.substring(0,20), abreviacion:nm.substring(0,10) });
            return Array.isArray(nueva) ? nueva[0].id : nueva.id;
        }

        async function buscarPaisId(nombre) {
            try { const r = await fetch(`${GEO_API_BASE}/countries/search/${encodeURIComponent(nombre)}`); if (!r.ok) return null; const d = await r.json(); return d.length ? d[0].id : null; }
            catch { return null; }
        }
        async function cargarEstados(paisNombre, datalistId) {
            const dl = document.getElementById(datalistId); if (!dl) return; dl.innerHTML = '';

            const r = await fetch(`${GEO_API_BASE}/countries/${id}/states`); if (!r.ok) return;

        async function cargarCiudades(paisNombre, estadoNombre, datalistId) {
            const dl = document.getElementById(datalistId); if (!dl) return; dl.innerHTML = '';

            const estados = await r.json();
            const est = estados.find(e => e.name.toLowerCase() === estadoNombre.toLowerCase()); if (!est) return;
            const c = await fetch(`${GEO_API_BASE}/states/${est.id}/cities`); if (!c.ok) return;
            const cities = await c.json();
            cities.forEach(city => { const o = document.createElement('option'); o.value = city.name; dl.appendChild(o); });
        }

                desde = fechaHoy.toISOString(); hasta = new Date(fechaHoy.getTime() + 86399999).toISOString();
            }

            ventasDataCache = await apiFetch(`ventas?empresa_id=eq.${empId}&fecha=gte.${encodeURIComponent(desde)}&fecha=lte.${encodeURIComponent(hasta)}&select=vendedor_id,total_linea,cantidad,producto_id&limit=1000`);
            const prodRes = await apiFetch(`productos?empresa_id=eq.${empId}&select=id,peso&activo=eq.true&limit=1000`);

            document.getElementById('panel-inicio').innerHTML = `
            <div class="card">

                    <div class="filtro-group"><label>Desde:</label><input type="date" id="fecha-desde-inicio" value="${fechaDesdeFormato}"></div>

                    <div class="filtro-group"><label><input type="checkbox" id="chk-solo-dia" ${soloUnDiaActivo ? 'checked' : ''} onchange="toggleFiltroUnDia()"> Solo un día</label></div>

                            <option value="carga_desc">Carga Total: Mayor a Menor</option><option value="carga_asc">Carga Total: Menor a Mayor</option>

        function toggleFiltroUnDia() {
            const chk = document.getElementById('chk-solo-dia');
            const hastaGroup = document.getElementById('hasta-group');
            const hastaInput = document.getElementById('fecha-hasta-inicio');
            const desdeInput = document.getElementById('fecha-desde-inicio');
            if (chk && chk.checked) {
                soloUnDiaActivo = true;
                hastaGroup.style.display = 'none';
                if (desdeInput && hastaInput) hastaInput.value = desdeInput.value;
            } else {
                soloUnDiaActivo = false;
                hastaGroup.style.display = 'flex';
            }
        }

        function actualizarGrafico() {
            if (!ventasDataCache.length) return;
            const empleadosMap = {}; const resumen = {};
            ventasDataCache.forEach(v => {
                const vid = v.vendedor_id || 'sin_asignar';
                if (!resumen[vid]) resumen[vid] = { monto:0, cantidad:0, productos:new Set(), carga:0 };
                resumen[vid].monto += parseFloat(v.total_linea); resumen[vid].cantidad += v.cantidad;
                resumen[vid].productos.add(v.producto_id);
                resumen[vid].carga += v.cantidad * (productosMapCache[v.producto_id] || 0);
            });
            apiFetch(`empleados?empresa_id=eq.${currentUser.empresa_id}&select=id,nombres,apellido_paterno&activo=eq.true&limit=1000`).then(emps => {
                emps.forEach(e => empleadosMap[e.id] = `${e.nombres} ${e.apellido_paterno}`);
            }).finally(() => {
                const vendors = Object.entries(resumen).map(([id,d]) => ({ id, nombre: id==='sin_asignar' ? 'Sin vendedor' : (empleadosMap[id]||'Desconocido'), monto:d.monto, carga:d.carga, variedad:d.productos.size }));
                const orden = document.getElementById('orden-ventas')?.value || 'monto_desc';
                const [campo, dir] = orden.split('_');
                vendors.sort((a,b) => dir==='desc' ? b[campo]-a[campo] : a[campo]-b[campo]);
                const monSimbolo = getSimboloMoneda(empresaMonedaCodigo);
                if (chartVentas) chartVentas.destroy();
                const ctx = document.getElementById('grafico-ventas')?.getContext('2d'); if (!ctx) return;
                chartVentas = new Chart(ctx, { type:'bar', data:{ labels: vendors.map(v=>v.nombre), datasets:[
                    { label:`Monto (${monSimbolo})`, data: vendors.map(v=>v.monto), backgroundColor:'#2563eb', borderColor:'#1d4ed8', borderWidth:1, borderRadius:8 },
                    { label:'Carga Total', data: vendors.map(v=>v.carga), backgroundColor:'#f59e0b', borderColor:'#d97706', borderWidth:1, borderRadius:8 },
                    { label:'Variedad (productos)', data: vendors.map(v=>v.variedad), backgroundColor:'#10b981', borderColor:'#059669', borderWidth:1, borderRadius:8 }
                ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ usePointStyle:true, font:{ size:12 } } } } } });
            });
        }

        function filtrarVentasInicio() {
            const desde = document.getElementById('fecha-desde-inicio')?.value;
            let hasta = document.getElementById('fecha-hasta-inicio')?.value;
            if (soloUnDiaActivo) hasta = desde;
            if (desde && hasta) {
                if (hasta < desde) { showNotification('La fecha "Hasta" no puede ser menor que "Desde".', 'error'); return; }
                cargarInicio(desde + 'T00:00:00', hasta + 'T23:59:59');
            } else showNotification('Seleccione al menos la fecha "Desde"', 'error');
        }

        async function guardarMetasTablaGlobal() {
            const mes = parseInt(document.getElementById('meta-mes')?.value);
            const anio = parseInt(document.getElementById('meta-anio')?.value);
            if (!mes || !anio) { showNotification('Seleccione mes y año', 'error'); return; }
            const filas = document.querySelectorAll('#meta-tabla-global-container tr[data-empleado-id]');
            if (!filas.length) return;
            const operaciones = [];
            for (const fila of filas) {
                const empId = fila.dataset.empleadoId;
                const payload = {
                    empleado_id: empId,
                    mes: mes,
                    anio: anio,
                    activo: true,
                    creado_por: currentUser.id,
                    asignado_por: currentUser.id,
                    comentario: fila.querySelector('.meta-comentario')?.value || null
                };
                for (const met of METRICAS_META) {
                    const chk = fila.querySelector(`.meta-check-metric[data-key="${met.key}"]`);
                    if (chk && chk.checked) {
                        const valInput = fila.querySelector(`.meta-val-${met.key}`);
                        const val = valInput ? valInput.value : '';
                        payload[met.key] = val !== '' ? (met.tipo === 'entero' ? parseInt(val) : parseFloat(val)) : null;
                        if (met.moneda) {
                            const selMon = fila.querySelector(`.meta-moneda-${met.key}`);
                            payload[met.moneda] = (selMon && selMon.value) ? await ensureCurrency(selMon.value) : null;
                        }
                        if (met.unidad) {
                            const selUni = fila.querySelector(`.meta-unidad-${met.key}`);
                            payload[met.unidad] = (selUni && selUni.value) ? await ensureUnidadMedida(selUni.value) : null;
                        }
                    } else {
                        payload[met.key] = null;
                        if (met.moneda) payload[met.moneda] = null;
                        if (met.unidad) payload[met.unidad] = null;
                    }
                }
                const existente = await apiFetch(`objetivos_empleado?empleado_id=eq.${empId}&mes=eq.${mes}&anio=eq.${anio}&select=id&limit=1`);

                        ? apiFetch(`objetivos_empleado?id=eq.${existente[0].id}`, 'PATCH', payload)
                        : apiFetch('objetivos_empleado', 'POST', payload)
                );
            }
            try {
                await Promise.all(operaciones);
                showNotification('Metas guardadas correctamente');
                cargarMetasTablaGlobal();
            } catch (err) { showNotification('Error al guardar: ' + err.message, 'error'); }
        }

        async function cargarDistribucion() {
            if (!currentUser || !currentUser.empresa_id) return;
            const productoId = document.getElementById('dist-prod-select')?.value;
            const mes = parseInt(document.getElementById('dist-mes')?.value);
            const anio = parseInt(document.getElementById('dist-anio')?.value);
            const verTodos = document.getElementById('dist-todos-productos')?.checked;

            if (!mes || !anio || (!productoId && !verTodos)) return;

            const empId = currentUser.empresa_id;

            let stockDisponible = 0;
            let productoNombre = '';
            if (productoId) {
                const inventario = await apiFetch(`inventario?empresa_id=eq.${empId}&producto_id=eq.${productoId}&select=cantidad,cantidad_reservada&limit=1000`);
                stockDisponible = inventario.reduce((sum, inv) => sum + (inv.cantidad - (inv.cantidad_reservada || 0)), 0);
                const prodInfo = await apiFetch(`productos?id=eq.${productoId}&select=nombre,sku&limit=1`);
                if (prodInfo.length) productoNombre = `${prodInfo[0].sku} - ${prodInfo[0].nombre}`;
            }

            const comercialesUsers = await apiFetch(`usuarios?empresa_id=eq.${empId}&rol=eq.${encodeURIComponent('Ejecutivo Comercial')}&select=email&limit=1000`);
            const emails = comercialesUsers.map(u => u.email.toLowerCase());
            const todosEmpleados = await apiFetch(`empleados?empresa_id=eq.${empId}&activo=eq.true&select=id,nombres,apellido_paterno,email&limit=1000`);
            const vendedores = todosEmpleados.filter(e => emails.includes((e.email||'').toLowerCase()));

            if (!vendedores.length) {
                document.getElementById('dist-tabla-container').innerHTML = '<p style="color:#64748b;">No hay vendedores activos. Asegúrese de que existan usuarios con rol "Ejecutivo Comercial" y empleados asociados con el mismo email.</p>';
                return;
            }

            const empleadoIds = vendedores.map(v => `"${v.id}"`).join(',');
            const objetivos = await apiFetch(`objetivos_empleado?empleado_id=in.(${encodeURIComponent(empleadoIds)})&mes=eq.${mes}&anio=eq.${anio}&activo=eq.true&select=empleado_id,monto_objetivo,cantidad_objetivo&limit=1000`);
            const objMap = {};
            objetivos.forEach(o => { objMap[o.empleado_id] = o; });

            let totalMonto = 0, totalCantidad = 0;
            vendedores.forEach(v => {
                const obj = objMap[v.id];
                if (obj) {
                    totalMonto += parseFloat(obj.monto_objetivo || 0);
                    totalCantidad += parseFloat(obj.cantidad_objetivo || 0);
                }
            });

            let asignacionesQuery = `asignaciones_producto_vendedor?empresa_id=eq.${empId}&mes=eq.${mes}&anio=eq.${anio}&empleado_id=in.(${encodeURIComponent(empleadoIds)})&select=*&limit=1000`;
            if (productoId) asignacionesQuery += `&producto_id=eq.${productoId}`;
            const asignaciones = await apiFetch(asignacionesQuery);
            const asigMap = {};
            asignaciones.forEach(a => {
                const key = `${a.empleado_id}_${a.producto_id}_${a.almacen_id || 'null'}`;
                asigMap[key] = a;
            });

            let tablaHtml = `<table class="meta-editable-table"><thead><tr><th>Vendedor</th><th>Objetivo Monto</th><th>Objetivo Cantidad</th><th>% Ponderado</th><th>Cantidad Asignada</th><th>Comentario</th></tr></thead><tbody>`;

            for (const v of vendedores) {
                const obj = objMap[v.id];
                const montoObj = obj ? parseFloat(obj.monto_objetivo || 0) : 0;
                const cantObj = obj ? parseFloat(obj.cantidad_objetivo || 0) : 0;
                let porcentaje = 0;
                if (totalMonto > 0) {
                    porcentaje = (montoObj / totalMonto) * 100;
                } else if (totalCantidad > 0) {
                    porcentaje = (cantObj / totalCantidad) * 100;
                } else if (vendedores.length > 0) {
                    porcentaje = 100 / vendedores.length;
                }
                const key = `${v.id}_${productoId || 'todos'}_null`;
                const asig = asigMap[key] || {};
                const cantidadAsignada = asig.cantidad_asignada !== undefined ? asig.cantidad_asignada : '';
                const comentario = asig.comentario || '';

                tablaHtml += `<tr data-empleado-id="${v.id}" data-producto-id="${productoId || 'todos'}">
                    <td>${v.nombres} ${v.apellido_paterno}</td>
                    <td>${montoObj.toFixed(2)}</td>
                    <td>${cantObj.toFixed(2)}</td>
                    <td>${porcentaje.toFixed(2)}%</td>
                    <td><input type="number" step="1" min="0" class="dist-cantidad" value="${cantidadAsignada}" style="width:100px;"></td>
                    <td><input type="text" class="dist-comentario" value="${comentario}" style="width:150px;"></td>
                </tr>`;
            }
            tablaHtml += `</tbody></table>`;
            document.getElementById('dist-tabla-container').innerHTML = tablaHtml;

            if (productoId) {
                document.getElementById('dist-stock-info').style.display = 'block';
                document.getElementById('dist-stock-info').innerHTML = `<strong>Producto:</strong> ${productoNombre} | <strong>Stock Disponible:</strong> ${stockDisponible} unidades`;
            } else {
                document.getElementById('dist-stock-info').style.display = 'none';
            }

            document.getElementById('dist-guardar-area').hidden = false;
            initTooltips();
        }

        async function guardarDistribucion() {
            const productoId = document.getElementById('dist-prod-select')?.value;
            const mes = parseInt(document.getElementById('dist-mes')?.value);
            const anio = parseInt(document.getElementById('dist-anio')?.value);
            const almacenId = document.getElementById('dist-almacen-select')?.value || null;
            const verTodos = document.getElementById('dist-todos-productos')?.checked;

            if (!mes || !anio) { showNotification('Seleccione mes y año', 'error'); return; }
            if (!productoId && !verTodos) { showNotification('Seleccione un producto o active "Ver todos los productos"', 'error'); return; }

            const filas = document.querySelectorAll('#dist-tabla-container tr[data-empleado-id]');
            if (!filas.length) return;

            const operaciones = [];
            for (const fila of filas) {
                const empId = fila.dataset.empleadoId;
                const prodId = fila.dataset.productoId === 'todos' ? productoId : fila.dataset.productoId;
                if (!prodId || prodId === 'todos') continue;

                const cantidad = parseInt(fila.querySelector('.dist-cantidad')?.value || '0');
                const comentario = fila.querySelector('.dist-comentario')?.value || null;

                const payload = {
                    empresa_id: currentUser.empresa_id,
                    producto_id: prodId,
                    empleado_id: empId,
                    almacen_id: almacenId,
                    cantidad_asignada: cantidad,
                    mes: mes,
                    anio: anio,
                    comentario: comentario,
                    creado_por: currentUser.id
                };

                let query = `asignaciones_producto_vendedor?producto_id=eq.${prodId}&empleado_id=eq.${empId}&mes=eq.${mes}&anio=eq.${anio}`;
                if (almacenId) query += `&almacen_id=eq.${almacenId}`;
                else query += `&almacen_id=is.null`;
                query += `&select=id&limit=1`;

                const existente = await apiFetch(query);
                if (existente.length > 0) {
                    operaciones.push(apiFetch(`asignaciones_producto_vendedor?id=eq.${existente[0].id}`, 'PATCH', payload));
                } else {
                    operaciones.push(apiFetch('asignaciones_producto_vendedor', 'POST', payload));
                }
            }

            try {
                await Promise.all(operaciones);
                showNotification('Distribución guardada correctamente');
                cargarDistribucion();
            } catch (err) {
                showNotification('Error al guardar: ' + err.message, 'error');
            }
        }

        // ==================== CLIENTES ====================
        async function cargarClientes(vendedorId='', filtroTipo='', filtroSegmento='', filtroCanal='', estadoFiltro='true') {
            if (!currentUser || !currentUser.empresa_id) return;
            const empId = currentUser.empresa_id;
            let query = `clientes?empresa_id=eq.${empId}&select=*&limit=1000`;
            if (estadoFiltro === 'true') query += `&activo=eq.true`;

                filas += `<tr><td>${nombreMostrar.trim()||'-'}</td><td>${c.nombre_comercial || '-'}</td><td>${c.email||'-'}</td><td>${c.ciudad||'-'}, ${c.pais||'-'}</td><td>${c.tipo_cliente||'-'}</td><td>${c.segmento_mercado||'-'}</td><td>${c.canal_venta||'-'}</td><td>${gpsCount > 0 ? `<i class="fas fa-map-marker-alt" style="color:#1a56db;" title="${gpsCount} punto(s) de entrega"></i> ${gpsCount}` : '-'}</td><td>${c.vendedor_asignado_id ? (vendedorMap[c.vendedor_asignado_id]||'Asignado') : 'Sin asignar'}</td><td>${estadoBadge}</td><td class="action-buttons">${acciones}</td></tr>`;
            });
            if(!filas) filas = '<tr><td colspan="11" style="text-align:center;">No se encontraron clientes.</td></tr>';
            document.getElementById('panel-clientes').innerHTML = `
            <div class="card"><div class="card-header"><h2>Clientes</h2><button class="btn-solid" onclick="abrirModalCliente()"><i class="fas fa-plus"></i> Nuevo Cliente</button></div>
            <div class="filtros"><div class="filtro-group"><label>Vendedor:</label><select id="filtro-vendedor-clientes" onchange="aplicarFiltrosClientes()"><option value="">Todos</option></select></div>
            <div class="filtro-group"><label>Estado:</label><select id="filtro-estado-clientes" onchange="aplicarFiltrosClientes()"><option value="true" ${estadoFiltro==='true'?'selected':''}>Activos</option><option value="false" ${estadoFiltro==='false'?'selected':''}>Inactivos</option><option value="all" ${estadoFiltro==='all'?'selected':''}>Todos</option></select></div>
            <div class="filtro-group"><label>Tipo:</label><select id="filtro-tipo-cliente" onchange="aplicarFiltrosClientes()"><option value="">Todos</option></select></div>
            <div class="filtro-group"><label>Segmento:</label><select id="filtro-segmento-cliente" onchange="aplicarFiltrosClientes()"><option value="">Todos</option></select></div>
            <div class="filtro-group"><label>Canal:</label><select id="filtro-canal-cliente" onchange="aplicarFiltrosClientes()"><option value="">Todos</option></select></div></div>
            <div class="table-wrapper"><table><thead><tr><th>Razón Social / Nombre</th><th>Nombre Comercial</th><th>Email</th><th>Ubicación</th><th>Tipo</th><th>Segmento</th><th>Canal</th><th>GPS</th><th>Vendedor</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${filas}</tbody></table></div></div>`;
            const selVend = document.getElementById('filtro-vendedor-clientes'); vendedores.forEach(v => { const o = document.createElement('option'); o.value=v.id; o.text=v.nombres+' '+v.apellido_paterno; if(v.id===vendedorId) o.selected=true; selVend.appendChild(o); });
            const tipos = [...new Set(clientes.map(c=>c.tipo_cliente).filter(Boolean))].sort();
            const segs = [...new Set(clientes.map(c=>c.segmento_mercado).filter(Boolean))].sort();
            const canales = [...new Set(clientes.map(c=>c.canal_venta).filter(Boolean))].sort();
            ['filtro-tipo-cliente','filtro-segmento-cliente','filtro-canal-cliente'].forEach((id,i) => {

            e.preventDefault(); const id = document.getElementById('cliente-id').value;
            const tipoPersona = document.getElementById('cli-tipo-persona').value;
            const monCreditoId = await ensureCurrency(document.getElementById('cli-moneda-credito').value.trim());
            const gpsArray = jsonACoordenadasDesdeInputs();
            const telefonosArray = jsonATelefonosDesdeInputs('#cli-telefonos-container');
            const payload = {
                empresa_id: currentUser.empresa_id,
                tipo_documento: document.getElementById('cli-tipo-doc').value.trim()||null,
                numero_documento: document.getElementById('cli-num-doc').value.trim()||null,
                nombres: tipoPersona==='natural' ? document.getElementById('cli-nombres').value.trim() : null,
                apellido_paterno: tipoPersona==='natural' ? document.getElementById('cli-ap').value.trim() : null,
                apellido_materno: tipoPersona==='natural' ? document.getElementById('cli-am').value.trim() : null,
                razon_social: tipoPersona==='juridica' ? document.getElementById('cli-razon-social').value.trim() : null,
                nombre_comercial: document.getElementById('cli-nombre-comercial').value.trim()||null,
                email: document.getElementById('cli-email').value.trim()||null,
                telefonos: telefonosArray,
                direccion: document.getElementById('cli-direccion').value.trim()||null,
                direcciones_entrega: gpsArray,
                pais: document.getElementById('cli-pais').value.trim()||null,
                estado_provincia: document.getElementById('cli-estado').value.trim()||null,
                ciudad: document.getElementById('cli-ciudad').value.trim()||null,
                tipo_cliente: document.getElementById('cli-tipo-cliente').value||null,
                segmento_mercado: document.getElementById('cli-segmento').value||null,
                canal_venta: document.getElementById('cli-canal').value||null,
                limite_credito: parseFloat(document.getElementById('cli-limite-credito').value)||null,
                moneda_credito_id: monCreditoId,
                dias_credito: parseInt(document.getElementById('cli-dias-credito').value)||null,
                vendedor_asignado_id: document.getElementById('cli-vendedor').value||null,
                lista_precios: parseJsonSeguro(document.getElementById('cli-lista-precios').value)
            };
            try { const file = document.getElementById('file-cli-imagen').files[0]; if(file) payload.imagen = await uploadFile(file, 'clientes'); } catch {}
            try {
                if(id) { delete payload.empresa_id; await apiFetch(`clientes?id=eq.${id}`, 'PATCH', payload); }
                else await apiFetch('clientes', 'POST', payload);
                cerrarModalCliente(); aplicarFiltrosClientes(); showNotification(id?'Cliente actualizado':'Cliente creado');
            } catch(err) { showNotification('Error: '+err.message, 'error'); }
        });
        function parseJsonSeguro(valor) { if(!valor||!valor.trim()) return null; try { return JSON.parse(valor); } catch(e) { return null; } }

        function prevenirSubmitEnter(e) {
            if (e.key === 'Enter') {
                const target = e.target;
                if (target.tagName === 'TEXTAREA') return;
                if (target.tagName === 'SELECT') { e.preventDefault(); return; }
                if (target.tagName === 'INPUT' && (target.hasAttribute('list') || target.type === 'date' || target.type === 'number')) { e.preventDefault(); return; }
                if (target.closest('button[type="submit"]')) return;
                e.preventDefault();
            }
        }
        document.querySelectorAll('form').forEach(f => { f.addEventListener('keydown', prevenirSubmitEnter); });

        function navegarA(panel) {
            if (!currentUser || !currentUser.empresa_id) return;
            document.querySelectorAll('.sidebar-menu a').forEach(l => l.classList.remove('active'));
            document.querySelector(`.sidebar-menu a[data-panel="${panel}"]`)?.classList.add('active');
            document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(`panel-${panel}`)?.classList.add('active');
            if(panel==='inicio') cargarInicio();
            else if(panel==='metas') cargarPanelMetas();
            else if(panel==='stock') cargarPanelDistribucion();
            else if(panel==='clientes') cargarClientes();
        }
        document.querySelectorAll('.sidebar-menu a[data-panel]').forEach(a => a.addEventListener('click', function(e) { e.preventDefault(); navegarA(this.dataset.panel); }));
        function recargarTodo() { const panelActivo = document.querySelector('.section-panel.active')?.id?.replace('panel-',''); if(panelActivo) navegarA(panelActivo); showNotification('Datos actualizados'); }
        window.onload = async function() { verificarSesion(); if(currentUser) { await cargarDatosIniciales(); navegarA('inicio'); } };
    </script>
</body>
</html>
