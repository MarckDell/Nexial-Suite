<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Catálogo · Nexial Suite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter','Segoe UI',system-ui,sans-serif; background:#f4f6fb; color:#1a1f36; line-height:1.6; }
        .container { max-width:1200px; margin:24px auto; padding:0 24px; }
        .card { background:white; border-radius:24px; padding:28px; box-shadow:0 4px 20px rgba(0,0,0,0.03); margin-bottom:24px; border:1px solid #f0f2f5; }
        .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:14px; }
        .card-header h2 { font-size:1.4rem; font-weight:700; color:#0f172a; }
        .table-wrapper { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:12px 14px; text-align:left; border-bottom:1px solid #e2e8f0; font-size:0.88rem; }
        th { background:#f8fafc; color:#475569; font-weight:600; text-transform:uppercase; font-size:0.73rem; }
        tr:hover td { background:#f1f5f9; }
        .action-buttons { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
        .btn-sm { padding:6px 12px; border-radius:18px; font-size:0.78rem; font-weight:600; border:none; cursor:pointer; font-family:'Inter',sans-serif; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
        .btn-edit { background:#e0f2fe; color:#0369a1; }
        .btn-delete { background:#fee2e2; color:#991b1b; }
        .btn-remove-permanent { background:#ffedd5; color:#9a3412; }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(2,6,18,0.8); backdrop-filter:blur(8px); z-index:2000; display:none; align-items:flex-start; justify-content:center; padding:24px; overflow-y:auto; }
        .modal-overlay.active { display:flex; }
        .modal { background:white; border-radius:28px; padding:36px 32px; max-width:1050px; width:100%; box-shadow:0 30px 60px rgba(0,0,0,0.4); animation:modalIn 0.3s ease; }
        .modal-sm { max-width:440px; padding:32px; text-align:center; }
        @keyframes modalIn { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .modal-header h2 { font-size:1.7rem; font-weight:700; color:#0f172a; }
        .close-modal { background:none; border:none; font-size:1.8rem; cursor:pointer; color:#64748b; }
        .form-row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
        .form-col { flex:1; min-width:160px; }
        .form-group { margin-bottom:2px; }
        .form-group label { font-size:0.73rem; font-weight:700; text-transform:uppercase; color:#334155; display:flex; align-items:center; gap:5px; margin-bottom:5px; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:12px; font-size:0.88rem; font-family:'Inter',sans-serif; }
        .form-group input:focus, .form-group select:focus { border-color:#1a56db; outline:none; box-shadow:0 0 0 3px rgba(26,86,219,0.08); }
        .notification { position:fixed; top:24px; right:32px; background:#1a1f36; color:white; padding:14px 28px; border-radius:60px; font-weight:500; z-index:3000; box-shadow:0 12px 28px rgba(0,0,0,0.3); display:none; align-items:center; gap:10px; font-size:0.9rem; }
        .notification.error { background:#c2412c; }
        .notification.success { background:#2c6e49; }
        .btn-outline { background:transparent; border:1.5px solid #cbd5e1; color:#1e293b; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; }
        .btn-solid { background:#1a56db; border:none; color:white; padding:10px 24px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; }
        .btn-solid:hover { background:#1340a0; }
        .filtros { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
        .filtros select, .filtros input, .filtros button { padding:8px 14px; border-radius:30px; border:1.5px solid #e2e8f0; font-family:'Inter',sans-serif; background:white; font-size:0.84rem; }
        .filtros button { background:#1a56db; color:white; border:none; cursor:pointer; font-weight:600; }
        .filtro-group { display:flex; align-items:center; gap:6px; background:#f8fafc; padding:4px 14px; border-radius:30px; border:1px solid #e2e8f0; }
        .filtro-group label { font-size:0.8rem; font-weight:600; color:#475569; }
        .chart-container { position:relative; height:400px; width:100%; margin-top:20px; }
        .info-banner { background:#f0f9ff; border:1px solid #bae6fd; border-radius:16px; padding:14px 20px; margin-bottom:20px; font-size:0.85rem; color:#0369a1; display:flex; align-items:flex-start; gap:10px; }
        .confirm-buttons { display:flex; gap:12px; justify-content:center; margin-top:24px; }
    </style>
</head>
<body>
    <div class="container" id="catalogo-container"></div>

    <!-- Modal Confirmación -->
    <div class="modal-overlay" id="modal-confirm">
        <div class="modal modal-sm">
            <div class="modal-header" style="justify-content:center;"><h2>Confirmar acción</h2></div>
            <p id="confirm-mensaje" style="color:#475569; font-size:0.95rem; margin-bottom:8px;"></p>
            <div class="confirm-buttons">
                <button class="btn-outline" onclick="cerrarModalConfirm(false)">Cancelar</button>
                <button class="btn-solid" style="background:#c2412c;" onclick="cerrarModalConfirm(true)">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal Producto -->
    <div class="modal-overlay" id="modal-producto">
        <div class="modal">
            <div class="modal-header">
                <h2 id="titulo-modal-producto">Nuevo Producto</h2>
                <button class="close-modal" onclick="cerrarModalProducto()">&times;</button>
            </div>
            <form id="form-producto" autocomplete="off">
                <input type="hidden" id="producto-id">
                <div class="info-banner"><i class="fas fa-info-circle"></i> Todos los campos con <strong>*</strong> son obligatorios.</div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>SKU *</label><input id="prod-sku" required oninput="this.value = this.value.toUpperCase()"></div></div>
                    <div class="form-col"><div class="form-group"><label>Código de Barras</label><input id="prod-codigo-barras"></div></div>
                    <div class="form-col"><div class="form-group"><label>Unidades por Caja</label><input id="prod-unidades-caja" type="number" step="1" min="1"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Nombre *</label><input id="prod-nombre" required oninput="capitalizarInput(this)"></div></div>
                    <div class="form-col"><div class="form-group"><label>Descripción</label><input id="prod-descripcion"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Categoría</label><input id="prod-categoria" list="cat-list" oninput="capitalizarInput(this)"><datalist id="cat-list"></datalist></div></div>
                    <div class="form-col"><div class="form-group"><label>Marca</label><input id="prod-marca" list="marca-list" oninput="capitalizarInput(this)"><datalist id="marca-list"></datalist></div></div>
                    <div class="form-col"><div class="form-group"><label>Modelo</label><input id="prod-modelo" list="modelo-list" oninput="capitalizarInput(this)"><datalist id="modelo-list"></datalist></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Unidad de Medida</label><input id="prod-unidad" list="unidad-list" onchange="autocompletarUnidadPeso()"><datalist id="unidad-list"></datalist></div></div>
                    <div class="form-col"><div class="form-group"><label>Peso</label><input id="prod-peso" type="number" step="0.01" min="0"></div></div>
                    <div class="form-col"><div class="form-group"><label>Unidad de Peso</label><input id="prod-peso-unidad" list="peso-unidad-list"><datalist id="peso-unidad-list"></datalist></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Volumen</label><input id="prod-volumen" type="number" step="0.01" min="0"></div></div>
                    <div class="form-col"><div class="form-group"><label>Unidad de Volumen</label><input id="prod-volumen-unidad" list="vol-unidad-list"><datalist id="vol-unidad-list"></datalist></div></div>
                    <div class="form-col"><div class="form-group"><label>Impuesto (%)</label><input id="prod-impuesto" type="number" step="0.01" min="0" max="100"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Tipo de Impuesto</label><input id="prod-tipo-impuesto" list="tipo-impuesto-list"><datalist id="tipo-impuesto-list"></datalist></div></div>
                    <div class="form-col"><div class="form-group"><label>Precio Venta Base *</label><input id="prod-precio" type="number" step="0.01" min="0" required></div></div>
                    <div class="form-col"><div class="form-group"><label>Moneda Precio</label><input id="prod-moneda-precio" list="monedas-global-list-prod"><datalist id="monedas-global-list-prod"></datalist></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Costo Unitario</label><input id="prod-costo" type="number" step="0.01" min="0"></div></div>
                    <div class="form-col"><div class="form-group"><label>Moneda Costo</label><input id="prod-moneda-costo" list="monedas-global-list-prod"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Stock Mínimo</label><input id="prod-stock-min" type="number" step="1" min="0"></div></div>
                    <div class="form-col"><div class="form-group"><label>Stock Máximo</label><input id="prod-stock-max" type="number" step="1" min="0"></div></div>
                    <div class="form-col"><div class="form-group"><label>Días de Vida Útil</label><input id="prod-dias-vida" type="number" step="1" min="0" oninput="calcularFechaDesdeDias()"></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Fecha de Vencimiento</label><input id="prod-fecha-vencimiento" type="date" onchange="calcularDiasDesdeFecha()"></div></div>
                    <div class="form-col"><div class="form-group"><label>Maneja Lote</label><select id="prod-lote"><option value="false">No</option><option value="true">Sí</option></select></div></div>
                    <div class="form-col"><div class="form-group"><label>Maneja Vencimiento</label><select id="prod-vencimiento"><option value="false">No</option><option value="true">Sí</option></select></div></div>
                </div>
                <div class="form-row">
                    <div class="form-col"><div class="form-group"><label>Imagen</label><input type="file" id="file-prod-imagen" accept="image/*"></div></div>
                </div>
                <div style="margin-top:16px; display:flex; gap:12px; justify-content:flex-end;">
                    <button type="button" class="btn-outline" onclick="cerrarModalProducto()">Cancelar</button>
                    <button type="submit" class="btn-solid"><i class="fas fa-save"></i> Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="notification" class="notification"><i class="fas fa-circle-info"></i><span></span></div>

    <script>
        const SUPABASE_URL = 'https://zgzwhyywkervutpvazqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aE2X3gv4CE110VzI4uoT-Q_yo4Xv6Zb';
        const STORAGE_BUCKET = 'empresas';
        let currentUser = null, empresaMonedaCodigo = 'USD';
        let todasLasMonedas = [];
        let confirmCallback = null;
        let chartProductos = null;
        let productosVentasCache = [], productosChartDesde = null, productosChartHasta = null;

        const unidadPesoMap = { 'Kilogramo':'kg', 'Gramo':'g', 'Tonelada':'ton', 'Libra':'lb', 'Onza':'oz' };
        const unidadVolumenMap = { 'Litro':'litro', 'Mililitro':'ml', 'Metro cúbico':'m³', 'Centímetro cúbico':'cm³', 'Galón':'galón' };

        function capitalizarInput(el) { let val=el.value, pos=el.selectionStart; val=val.replace(/(?:^|\s)(\p{L})/gu,(m,p)=>m.toUpperCase()); el.value=val; el.setSelectionRange(pos,pos); }
        function verificarSesion() { const s=sessionStorage.getItem('currentUser'); if(!s){window.location.href='login.html';return;} currentUser=JSON.parse(s); if(currentUser.rol!=='Supervisor Senior' && currentUser.rol!=='Director General' && currentUser.rol!=='Director Financiero'){sessionStorage.removeItem('currentUser');window.location.href='login.html';} }
        function showNotification(m,t='success'){const n=document.getElementById('notification');n.querySelector('span').innerText=m;n.className=`notification ${t}`;n.style.display='flex';setTimeout(()=>n.style.display='none',4500);}
        function mostrarConfirmacion(mensaje,titulo,callback){document.getElementById('confirm-mensaje').innerText=mensaje;document.getElementById('modal-confirm').classList.add('active');confirmCallback=callback;}
        function cerrarModalConfirm(resultado){document.getElementById('modal-confirm').classList.remove('active');if(confirmCallback&&resultado)confirmCallback();confirmCallback=null;}
        async function apiFetch(endpoint,method='GET',body=null){const headers={'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`};if(method==='POST'||method==='PATCH')headers['Prefer']='return=representation';const opts={method,headers};if(body)opts.body=JSON.stringify(body);const res=await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`,opts);if(!res.ok){const e=await res.text();throw new Error(e);}const txt=await res.text();return txt?JSON.parse(txt):{};}
        async function uploadFile(file,folder){const name=`${folder}/${Date.now()}-${file.name}`;const fd=new FormData();fd.append('',file);const res=await fetch(`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${name}`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`},body:fd});if(!res.ok)throw new Error('Error al subir');return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${name}`;}
        function extraerCodigo(v){return(v.split(' - ')[0]||'').trim().toUpperCase();}
        function monedaPorDefecto(){const mon=todasLasMonedas.find(m=>m.codigo===empresaMonedaCodigo);return mon?`${mon.codigo} - ${mon.nombre}`:empresaMonedaCodigo;}

        async function ensureCurrency(input){const cod=extraerCodigo(input);if(!cod)throw new Error('Moneda inválida');const exist=await apiFetch(`monedas?codigo=eq.${encodeURIComponent(cod)}&select=id`);if(exist.length)return exist[0].id;const data=todasLasMonedas.find(m=>m.codigo===cod)||{nombre:cod,symbol:null};const nueva=await apiFetch('monedas','POST',{codigo:cod,nombre:data.nombre,simbolo:data.symbol});return Array.isArray(nueva)?nueva[0].id:nueva.id;}
        async function ensureUnidadMedida(nombre){if(!nombre||!nombre.trim())return null;const nm=nombre.trim();const exist=await apiFetch(`unidades_medida?nombre=eq.${encodeURIComponent(nm)}&select=id`);if(exist.length)return exist[0].id;const nueva=await apiFetch('unidades_medida','POST',{nombre:nm,codigo:nm.substring(0,20),abreviacion:nm.substring(0,10)});return Array.isArray(nueva)?nueva[0].id:nueva.id;}

        function autocompletarUnidadPeso(){
            const unidad = document.getElementById('prod-unidad').value.trim();
            const pesoUnidad = document.getElementById('prod-peso-unidad');
            const volUnidad = document.getElementById('prod-volumen-unidad');
            if (unidadPesoMap[unidad]) pesoUnidad.value = unidadPesoMap[unidad];
            else if (unidadVolumenMap[unidad]) volUnidad.value = unidadVolumenMap[unidad];
        }

        function calcularDiasDesdeFecha(){
            const fecha = document.getElementById('prod-fecha-vencimiento').value;
            if(fecha){ const diff = Math.ceil((new Date(fecha) - new Date()) / (1000*60*60*24)); document.getElementById('prod-dias-vida').value = diff>0?diff:0; }
        }
        function calcularFechaDesdeDias(){
            const dias = parseInt(document.getElementById('prod-dias-vida').value);
            if(dias>0){ const fecha = new Date(Date.now() + dias*24*60*60*1000); document.getElementById('prod-fecha-vencimiento').value = fecha.toISOString().slice(0,10); }
        }

        // Carga del panel de catálogo
        async function cargarProductos(categoria = ''){
            if(!currentUser||!currentUser.empresa_id)return;
            const empId=currentUser.empresa_id;
            let query = `productos?empresa_id=eq.${empId}&select=*&activo=eq.true&limit=1000`;
            if(categoria) query += `&categoria=eq.${encodeURIComponent(categoria)}`;
            const productos = await apiFetch(query);
            const todasCategorias = await apiFetch(`productos?empresa_id=eq.${empId}&select=categoria&activo=eq.true&limit=1000`);
            const categorias = [...new Set(todasCategorias.map(p=>p.categoria).filter(Boolean))].sort();
            let filas='';
            productos.forEach(p=>{
                filas+=`<tr><td>${p.sku}</td><td>${p.nombre}</td><td>${p.categoria||'-'}</td><td>${p.marca||'-'}</td><td>${p.modelo||'-'}</td><td>${empresaMonedaCodigo} ${parseFloat(p.precio_venta_base||0).toFixed(2)}</td><td>${p.stock_minimo||0}</td><td>${p.stock_maximo||'-'}</td><td class="action-buttons"><button class="btn-sm btn-edit" onclick="editarProducto('${p.id}')"><i class="fas fa-edit"></i></button><button class="btn-sm btn-delete" onclick="eliminarProducto('${p.id}')"><i class="fas fa-ban"></i></button><button class="btn-sm btn-remove-permanent" onclick="eliminarDefinitivamenteProducto('${p.id}')"><i class="fas fa-trash-alt"></i></button></td></tr>`;
            });
            if(!filas) filas='<tr><td colspan="9" style="text-align:center;">No hay productos.</td></tr>';
            if(!productosChartDesde){ const hoy=new Date(); productosChartDesde = new Date(hoy.getFullYear(), hoy.getMonth(),1).toISOString(); productosChartHasta = new Date(hoy.getFullYear(), hoy.getMonth()+1,0,23,59,59).toISOString(); }
            document.getElementById('catalogo-container').innerHTML=`
            <div class="card"><div class="card-header"><h2>Ventas por Producto</h2></div>
                <div class="filtros"><div class="filtro-group"><label>Desde:</label><input type="date" id="fecha-desde-productos" value="${new Date(productosChartDesde).toISOString().slice(0,10)}"></div>
                <div class="filtro-group"><label>Hasta:</label><input type="date" id="fecha-hasta-productos" value="${new Date(productosChartHasta).toISOString().slice(0,10)}"></div>
                <button onclick="filtrarProductosGrafico()"><i class="fas fa-filter"></i> Filtrar</button></div>
                <div style="display:flex; flex-wrap:wrap; align-items:center; gap:20px; margin-bottom:16px;">
                    <div class="filtro-group"><label>Ordenar por:</label><select id="orden-productos-chart" onchange="actualizarGraficoProductos()"><option value="total_desc">Monto: Mayor a Menor</option><option value="total_asc">Monto: Menor a Mayor</option><option value="cantidad_desc">Cantidad: Mayor a Menor</option><option value="cantidad_asc">Cantidad: Menor a Mayor</option><option value="carga_desc">Carga Total: Mayor a Menor</option><option value="carga_asc">Carga Total: Menor a Mayor</option></select></div></div>
                <div class="chart-container"><canvas id="grafico-productos"></canvas></div>
            </div>
            <div class="card"><div class="card-header"><h2>Catálogo de Productos</h2><button class="btn-solid" onclick="abrirModalProducto()"><i class="fas fa-plus"></i> Nuevo Producto</button></div>
                <div class="filtros"><div class="filtro-group"><label>Categoría:</label><select id="filtro-categoria-productos" onchange="cargarProductos(this.value)"><option value="">Todas</option>${categorias.map(c=>`<option value="${c}" ${c===categoria?'selected':''}>${c}</option>`).join('')}</select></div><button onclick="cargarProductos(document.getElementById('filtro-categoria-productos').value)"><i class="fas fa-filter"></i> Filtrar</button></div>
                <div class="table-wrapper"><table><thead><tr><th>SKU</th><th>Nombre</th><th>Categoría</th><th>Marca</th><th>Modelo</th><th>Precio</th><th>Stock Mín</th><th>Stock Máx</th><th>Acciones</th></tr></thead><tbody>${filas}</tbody></table></div>
            </div>`;
            await cargarDatosProductosGrafico(); actualizarGraficoProductos();
        }

        async function cargarDatosProductosGrafico(){
            if(!currentUser||!currentUser.empresa_id)return;
            const empId=currentUser.empresa_id;
            const desde=document.getElementById('fecha-desde-productos')?.value, hasta=document.getElementById('fecha-hasta-productos')?.value;
            if(desde && hasta){ productosChartDesde = desde+'T00:00:00'; productosChartHasta = hasta+'T23:59:59'; }
            productosVentasCache = await apiFetch(`ventas?empresa_id=eq.${empId}&fecha=gte.${encodeURIComponent(productosChartDesde)}&fecha=lte.${encodeURIComponent(productosChartHasta)}&select=producto_id,total_linea,cantidad&limit=1000`);
        }
        function filtrarProductosGrafico(){ cargarDatosProductosGrafico().then(()=>actualizarGraficoProductos()); }

        function actualizarGraficoProductos(){
            apiFetch(`productos?empresa_id=eq.${currentUser.empresa_id}&select=id,nombre,peso&activo=eq.true&limit=1000`).then(productos=>{
                const prodMap={}, pesoMap={};
                productos.forEach(p=>{ prodMap[p.id]=p.nombre; pesoMap[p.id]=p.peso?parseFloat(p.peso):0; });
                const resumen={};
                productosVentasCache.forEach(v=>{
                    if(!resumen[v.producto_id]) resumen[v.producto_id]={ total:0, cantidad:0, carga:0 };
                    resumen[v.producto_id].total += parseFloat(v.total_linea);
                    resumen[v.producto_id].cantidad += v.cantidad;
                    resumen[v.producto_id].carga += v.cantidad * (pesoMap[v.producto_id]||0);
                });
                const data = Object.entries(resumen).map(([id,d])=>({ id, nombre:prodMap[id]||'Sin nombre', total:d.total, cantidad:d.cantidad, carga:d.carga }));
                const orden = document.getElementById('orden-productos-chart')?.value || 'total_desc';
                const [campo,dir] = orden.split('_');
                data.sort((a,b)=> dir==='desc'? b[campo]-a[campo] : a[campo]-b[campo]);
                const top = data.slice(0,15);
                if(chartProductos) chartProductos.destroy();
                const ctx = document.getElementById('grafico-productos')?.getContext('2d'); if(!ctx) return;
                chartProductos = new Chart(ctx, { type:'bar', data:{ labels:top.map(d=>d.nombre), datasets:[
                    { label:`Monto (${empresaMonedaCodigo})`, data:top.map(d=>d.total), backgroundColor:'#2563eb', borderColor:'#1d4ed8', borderWidth:1, borderRadius:8 },
                    { label:'Cantidad', data:top.map(d=>d.cantidad), backgroundColor:'#f59e0b', borderColor:'#d97706', borderWidth:1, borderRadius:8 },
                    { label:'Carga Total', data:top.map(d=>d.carga), backgroundColor:'#10b981', borderColor:'#059669', borderWidth:1, borderRadius:8 }
                ]}, options:{ responsive:true, maintainAspectRatio:false } });
            });
        }

        function abrirModalProducto(id=null){
            document.getElementById('modal-producto').classList.add('active');
            document.getElementById('form-producto').reset(); document.getElementById('producto-id').value='';
            document.getElementById('titulo-modal-producto').textContent='Nuevo Producto';
            document.getElementById('prod-moneda-precio').value=monedaPorDefecto();
            document.getElementById('prod-moneda-costo').value=monedaPorDefecto();
            cargarDatalistsProductos(); if(id) editarProducto(id);
        }
        function cerrarModalProducto(){ document.getElementById('modal-producto').classList.remove('active'); }

        async function editarProducto(id){
            const p = await apiFetch(`productos?id=eq.${id}&select=*`); if(!p.length) return;
            const prod = p[0];
            document.getElementById('producto-id').value = prod.id;
            document.getElementById('prod-sku').value = prod.sku||'';
            document.getElementById('prod-codigo-barras').value = prod.codigo_barras||'';
            document.getElementById('prod-nombre').value = prod.nombre||'';
            document.getElementById('prod-descripcion').value = prod.descripcion||'';
            document.getElementById('prod-categoria').value = prod.categoria||'';
            document.getElementById('prod-marca').value = prod.marca||'';
            document.getElementById('prod-modelo').value = prod.modelo||'';
            document.getElementById('prod-peso').value = prod.peso||''; document.getElementById('prod-peso-unidad').value = prod.peso_unidad||'';
            document.getElementById('prod-volumen').value = prod.volumen||''; document.getElementById('prod-volumen-unidad').value = prod.volumen_unidad||'';
            document.getElementById('prod-impuesto').value = prod.impuesto_porcentaje||'';
            document.getElementById('prod-tipo-impuesto').value = prod.tipo_impuesto||'';
            document.getElementById('prod-precio').value = prod.precio_venta_base||'';
            document.getElementById('prod-costo').value = prod.costo_unitario||'';
            document.getElementById('prod-stock-min').value = prod.stock_minimo||'';
            document.getElementById('prod-stock-max').value = prod.stock_maximo||'';
            document.getElementById('prod-dias-vida').value = prod.dias_vida_util||'';
            document.getElementById('prod-lote').value = prod.maneja_lote?'true':'false';
            document.getElementById('prod-vencimiento').value = prod.maneja_vencimiento?'true':'false';
            document.getElementById('prod-unidades-caja').value = prod.unidades_por_caja||'';
            document.getElementById('prod-moneda-precio').value = monedaPorDefecto();
            document.getElementById('prod-moneda-costo').value = monedaPorDefecto();
            if(prod.moneda_precio_id){ const mon=await apiFetch(`monedas?id=eq.${prod.moneda_precio_id}&select=codigo,nombre`); if(mon.length) document.getElementById('prod-moneda-precio').value=`${mon[0].codigo} - ${mon[0].nombre}`; }
            if(prod.moneda_costo_id){ const mon=await apiFetch(`monedas?id=eq.${prod.moneda_costo_id}&select=codigo,nombre`); if(mon.length) document.getElementById('prod-moneda-costo').value=`${mon[0].codigo} - ${mon[0].nombre}`; }
            if(prod.unidad_medida_id){ const um=await apiFetch(`unidades_medida?id=eq.${prod.unidad_medida_id}&select=nombre`); if(um.length) document.getElementById('prod-unidad').value=um[0].nombre; }
            if(prod.dias_vida_util) calcularFechaDesdeDias();
            document.getElementById('titulo-modal-producto').textContent='Editar Producto';
            document.getElementById('modal-producto').classList.add('active');
            cargarDatalistsProductos();
        }

        function eliminarProducto(id){ mostrarConfirmacion('¿Desactivar producto?','Desactivar Producto', async()=>{ await apiFetch(`productos?id=eq.${id}`, 'PATCH', { activo:false }); cargarProductos(document.getElementById('filtro-categoria-productos')?.value||''); showNotification('Producto desactivado'); }); }
        function eliminarDefinitivamenteProducto(id){ mostrarConfirmacion('¿Eliminar permanentemente?','Eliminar Producto', async()=>{ await apiFetch(`productos?id=eq.${id}`, 'DELETE'); cargarProductos(document.getElementById('filtro-categoria-productos')?.value||''); showNotification('Producto eliminado'); }); }

        document.getElementById('form-producto').addEventListener('submit', async function(e){
            e.preventDefault(); const id = document.getElementById('producto-id').value;
            const monPrecioId = await ensureCurrency(document.getElementById('prod-moneda-precio').value.trim());
            const monCostoId = await ensureCurrency(document.getElementById('prod-moneda-costo').value.trim());
            const unidadId = await ensureUnidadMedida(document.getElementById('prod-unidad').value.trim());
            const payload = {
                sku: document.getElementById('prod-sku').value.trim(), codigo_barras: document.getElementById('prod-codigo-barras').value.trim()||null,
                nombre: document.getElementById('prod-nombre').value.trim(), descripcion: document.getElementById('prod-descripcion').value.trim()||null,
                categoria: document.getElementById('prod-categoria').value.trim()||null, marca: document.getElementById('prod-marca').value.trim()||null,
                modelo: document.getElementById('prod-modelo').value.trim()||null, unidad_medida_id: unidadId,
                peso: parseFloat(document.getElementById('prod-peso').value)||null, peso_unidad: document.getElementById('prod-peso-unidad').value.trim()||null,
                volumen: parseFloat(document.getElementById('prod-volumen').value)||null, volumen_unidad: document.getElementById('prod-volumen-unidad').value.trim()||null,
                impuesto_porcentaje: parseFloat(document.getElementById('prod-impuesto').value)||null, tipo_impuesto: document.getElementById('prod-tipo-impuesto').value.trim()||null,
                precio_venta_base: parseFloat(document.getElementById('prod-precio').value)||0, moneda_precio_id: monPrecioId,
                costo_unitario: parseFloat(document.getElementById('prod-costo').value)||null, moneda_costo_id: monCostoId,
                stock_minimo: parseInt(document.getElementById('prod-stock-min').value)||0, stock_maximo: parseInt(document.getElementById('prod-stock-max').value)||null,
                dias_vida_util: parseInt(document.getElementById('prod-dias-vida').value)||null,
                maneja_lote: document.getElementById('prod-lote').value==='true', maneja_vencimiento: document.getElementById('prod-vencimiento').value==='true',
                unidades_por_caja: parseInt(document.getElementById('prod-unidades-caja').value)||null, empresa_id: currentUser.empresa_id
            };
            try { const file = document.getElementById('file-prod-imagen').files[0]; if(file) payload.imagen = await uploadFile(file, 'productos'); } catch {}
            try {
                if(id) { delete payload.empresa_id; await apiFetch(`productos?id=eq.${id}`, 'PATCH', payload); }
                else await apiFetch('productos', 'POST', payload);
                cerrarModalProducto(); cargarProductos(document.getElementById('filtro-categoria-productos')?.value||''); showNotification(id?'Producto actualizado':'Producto creado');
            } catch(err) { showNotification('Error: '+err.message, 'error'); }
        });

        async function cargarDatalistsProductos(){
            if(!currentUser||!currentUser.empresa_id) return;
            const empId=currentUser.empresa_id;
            const prods = await apiFetch(`productos?empresa_id=eq.${empId}&select=categoria,marca,modelo&limit=1000`);
            const cats = [...new Set(prods.map(p=>p.categoria).filter(Boolean))];
            const marcas = [...new Set(prods.map(p=>p.marca).filter(Boolean))];
            const modelos = [...new Set(prods.map(p=>p.modelo).filter(Boolean))];
            ['cat-list','marca-list','modelo-list'].forEach(id=>{ const dl=document.getElementById(id); if(dl) dl.innerHTML=''; });
            cats.forEach(c=>{ const o=document.createElement('option'); o.value=c; document.getElementById('cat-list')?.appendChild(o); });
            marcas.forEach(m=>{ const o=document.createElement('option'); o.value=m; document.getElementById('marca-list')?.appendChild(o); });
            modelos.forEach(m=>{ const o=document.createElement('option'); o.value=m; document.getElementById('modelo-list')?.appendChild(o); });
        }

        async function cargarDatosIniciales(){
            const PAISES_ESTATICOS = [
                { name: { common: 'Bolivia' }, currencies: { BOB: { name: 'Boliviano', symbol: 'Bs.' } } },
                // ... lista completa de países (usa la misma del original)
            ];
            const monSet = new Map();
            PAISES_ESTATICOS.forEach(p => { if(p.currencies) Object.entries(p.currencies).forEach(([c,i]) => { if(!monSet.has(c)) monSet.set(c, { name:i.name, symbol:i.symbol||'' }); }); });
            todasLasMonedas = Array.from(monSet, ([c,d]) => ({ codigo:c, nombre:d.name, simbolo:d.symbol }));
            try {
                const bdMonedas = await apiFetch('monedas?select=codigo,nombre,simbolo');
                bdMonedas.forEach(m => { if(!todasLasMonedas.find(t => t.codigo === m.codigo)) todasLasMonedas.push({ codigo:m.codigo, nombre:m.nombre, simbolo:m.simbolo||'' }); });
            } catch(e) {}
            ['monedas-global-list-prod'].forEach(id => {
                const dl = document.getElementById(id); if(!dl) return; dl.innerHTML = '';
                todasLasMonedas.forEach(m => { const o = document.createElement('option'); o.value = `${m.codigo} - ${m.nombre}`; dl.appendChild(o); });
            });
            if(currentUser && currentUser.empresa_id) {
                const emp = await apiFetch(`empresas?id=eq.${currentUser.empresa_id}&select=moneda_principal_id`);
                if(emp.length > 0 && emp[0].moneda_principal_id) {
                    const mon = await apiFetch(`monedas?id=eq.${emp[0].moneda_principal_id}&select=codigo`);
                    if(mon.length > 0) empresaMonedaCodigo = mon[0].codigo;
                }
            }
            const unidades = ['Unidad','Pieza','Caja','Kilogramo','Gramo','Litro','Metro','Centímetro','Pulgada','Par','Tonelada','Galón'];
            const pesos = ['kg','g','lb','oz','ton'];
            const vols = ['m³','cm³','litro','ml','galón'];
            const impuestos = ['IVA','ISC','IEPS','GST','VAT','Exento'];
            ['unidad-list','peso-unidad-list','vol-unidad-list','tipo-impuesto-list'].forEach((id,i)=>{
                const dl = document.getElementById(id); if(!dl) return; dl.innerHTML = '';
                const arr = [unidades, pesos, vols, impuestos][i];
                arr.forEach(u => { const o = document.createElement('option'); o.value = u; dl.appendChild(o); });
            });
        }

        window.onload = async function(){
            verificarSesion();
            if(currentUser){
                await cargarDatosIniciales();
                cargarProductos();
            }
        };
    </script>
